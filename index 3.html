const AP={0:1,1:1,2:1,3:1,4:1,5:1,6:1,7:1,8:1,9:1,10:1};
const CARDS=[
[0,"Qual a principal diferença de transporte plasmático entre peptídeos e esteroides?","Peptídeos circulam dissolvidos (meia-vida curta); esteroides circulam ligados a proteínas carreadoras (meia-vida longa).","Isso explica por que esteroides têm ação mais lenta e duradoura."],
[0,"Qual segundo mensageiro a proteína Gs aumenta?","AMPc, via adenilil ciclase, ativando a PKA.",""],
[0,"Qual via gera IP3 e DAG?","Gq → fosfolipase C → cliva PIP2 em IP3 (libera Ca²⁺ do RE) e DAG (ativa PKC).",""],
[0,"O que é down-regulation de receptores?","Redução do número ou da sensibilidade dos receptores após exposição prolongada ao hormônio.","Ex.: exposição contínua (não pulsátil) ao GnRH."],
[4,"Qual o passo que acopla glicose à secreção de insulina?","Glicose → transportadores GLUT (GLUT1/GLUT3 relevantes em humanos) → glicocinase → ATP ↑ → fecha canal KATP → despolariza → entra Ca²⁺ → exocitose.","Sulfonilureias fecham o KATP (subunidade SUR)."],

[6,"Qual a função da célula de Sertoli e qual seu principal marcador hormonal?","Sustenta a espermatogênese, forma a barreira hematotesticular, produz ABP e inibina B.","Inibina B baixa = lesão do epitélio seminífero."],
[7,"O que define o modelo de duas células e duas gonadotrofinas?","LH estimula a teca a produzir androgênios; FSH induz a aromatase na granulosa, que os converte em estradiol.",""],
[8,"O que desencadeia o pico de LH?","Estradiol alto e sustentado (~200 pg/mL por ~48 h) causa feedback positivo no eixo hipotálamo-hipófise.",""],
[9,"Qual a ação do PTH nos rins?","↑ reabsorção de Ca²⁺ (túbulo distal), ↓ reabsorção de fosfato, ↑ 1α-hidroxilase (calcitriol).",""],
[1,"Por que a compressão da haste hipofisária aumenta a prolactina?","Interrompe o fluxo portal de dopamina, que inibe tonicamente a prolactina; os demais hormônios caem por falta de hormônios liberadores.",""],

[1,"Cortisol ↑, ACTH ↑ e CRH ↓: qual o nível da lesão?","Hipofisária (secundária): ACTH autônomo eleva o cortisol, que suprime o CRH.",""],
[4,"Qual o papel da glicocinase na célula B?","É o sensor de glicose: fosforila a glicose a G6P e, assim, acopla a glicemia à produção de ATP e à secreção de insulina.",""],
[4,"O que é a secreção bifásica de insulina?","1ª fase: liberação rápida de grânulos pré-formados. 2ª fase: secreção sustentada. No DM2, a 1ª fase se perde primeiro.",""],
[5,"Qual a via de ação do receptor androgênico?","Esteroide atravessa a membrana, liga-se ao receptor citoplasmático, migra ao núcleo e induz transcrição e tradução.",""],
[5,"Por que anabolizantes causam infertilidade?","Suprimem o LH, caindo a testosterona intratesticular (≈100× o sérico) necessária à espermatogênese.",""],
[6,"O que a barreira hematotesticular separa e por quê?","As junções oclusivas das células de Sertoli separam o compartimento basal do adluminal, protegendo células meióticas e haploides do sistema imune.",""],
[6,"Qual a via do óxido nítrico na ereção?","NO → guanilil ciclase → GMPc → relaxamento da musculatura lisa vascular; a PDE5 degrada o GMPc e é inibida pelo sildenafil.",""],
[6,"FSH alto, inibina B baixa e testosterona normal-baixa: qual o diagnóstico fisiológico?","Falência testicular primária com dano tubular (Sertoli) e Leydig parcialmente preservada.",""],
[7,"Qual célula do folículo expressa aromatase e sob qual hormônio?","A granulosa, sob estímulo do FSH; converte androgênios da teca em estrogênios.",""],
[7,"Por que a progesterona depende do estrogênio?","O estrogênio induz receptores de progesterona (priming).",""],
[7,"Qual o achado hormonal na menopausa?","Estradiol e inibina baixos, com FSH (e LH) altos por perda do feedback negativo.",""],
[8,"O que provoca o pico de LH pré-ovulatório?","Feedback positivo do estradiol alto e sustentado (~48 h).",""],
[8,"Quais hormônios o corpo lúteo secreta e o que acontece se não há gravidez?","Progesterona, estradiol e inibina; regride em corpo albicans, e a queda hormonal causa a menstruação.",""],
[8,"O que é um ciclo anovulatório?","Ciclo sem pico de LH e sem corpo lúteo; há estradiol sem progesterona, com endométrio proliferativo contínuo.",""],
[9,"Quais são as três ações do PTH nos rins?","↑ reabsorção de Ca²⁺ (distal), ↓ reabsorção de fosfato e ↑ 1α-hidroxilase (calcitriol).",""],
[9,"Qual a forma ativa da vitamina D e onde é formada?","Calcitriol (1,25-di-hidroxivitamina D), pela 1α-hidroxilase nos túbulos proximais renais.",""],

[2,"Qual a diferença entre GH e IGF-1 na síndrome de Laron?","GH alto e IGF-1 baixo: o receptor de GH é defeituoso, então o fígado não produz IGF-1.",""],

[3,"O que é o escape da aldosterona?","No excesso crônico, a expansão de volume e o peptídeo natriurético atrial aumentam a natriurese; o paciente não fica edemaciado, mas segue com hipocalemia.",""],
[3,"Quais as zonas do córtex adrenal e seus produtos?","Glomerulosa: aldosterona. Fasciculada: cortisol. Reticular: androgênios fracos (DHEA e androstenediona).",""]];
const Q=[
[0,1,"Um hormônio cuja ação demora horas e não atua por segundo mensageiro de membrana provavelmente:",["É um peptídeo hidrossolúvel","Liga-se a receptor intracelular e altera a transcrição","Atua por canais iônicos","Tem meia-vida de segundos","Depende de adenilil ciclase"],1,"Hormônios esteroides e tireoidianos atravessam a membrana e ativam receptores nucleares/citoplasmáticos, modulando transcrição: efeito lento e duradouro."],
[0,2,"A ativação de Gq resulta diretamente em:",["↑ AMPc","↓ AMPc","↑ IP3 e DAG","Fosforilação de JAK2","Abertura de canal de Na⁺"],2,"Gq ativa fosfolipase C, que cliva PIP2 em IP3 e DAG."],
[0,2,"Exposição contínua (não pulsátil) a um agonista de GnRH leva a:",["Up-regulation de receptores","Dessensibilização e queda de LH/FSH","Aumento sustentado de testosterona","Feedback positivo","Nenhuma alteração"],1,"A dessensibilização (down-regulation) dos receptores de GnRH reduz gonadotrofinas; base do uso terapêutico de análogos."],

[1,2,"Paciente com cortisol alto, ACTH alto e CRH baixo. A alteração é:",["Primária adrenal","Secundária hipofisária","Terciária hipotalâmica","Deficiência de 21-hidroxilase","Normal"],1,"ACTH elevado de origem hipofisária aumenta cortisol, que inibe o CRH. Na doença adrenal primária o ACTH estaria baixo."],
[4,2,"Em um teste oral de glicose, ausência da 1ª fase de secreção de insulina sugere:",["Fisiologia normal","Perda precoce de função da célula β (DM2)","Hiperglucagonemia isolada","Excesso de somatostatina","Hipoglicemia reativa"],1,"A perda da fase rápida é achado precoce no DM2; a segunda fase pode permanecer parcialmente."],
[4,1,"Qual ação NÃO é da insulina no fígado?",["Ativar glicogênio sintase","Inibir gliconeogênese","Estimular lipogênese","Inibir glicogênio fosforilase","Estimular a PEPCK"],4,"A insulina inibe a PEPCK e a glicose-6-fosfatase, reduzindo a gliconeogênese."],
[6,3,"João, 32 anos, azoospermia, testículos de 10 mL, FSH 15, LH 8, inibina B 38, testosterona total 260. Interpretação:",["Hipogonadismo secundário","Falência testicular primária predominantemente germinativa","Hiperprolactinemia","Deficiência de 5α-redutase","Síndrome de Kallmann"],1,"FSH alto e inibina B baixa indicam lesão dos túbulos/Sertoli (pós-orquite caxumbosa). Leydig parcialmente preservada: LH no limite e testosterona baixa-normal."],
[7,2,"A enzima induzida pelo FSH nas células da granulosa é:",["5α-redutase","CYP17","Aromatase","3β-HSD","StAR"],2,"A aromatase converte androstenediona e testosterona (da teca) em estrona e estradiol."],
[8,2,"A temperatura basal sobe após a ovulação por ação de:",["Estradiol","Progesterona","LH","FSH","Inibina"],1,"A progesterona tem efeito termogênico, mantendo a elevação na fase lútea."],
[4,2,"Qual evento acopla diretamente o aumento do ATP à exocitose de insulina na célula B?",["Abertura do GLUT4","Fechamento do canal K-ATP e despolarização","Ativação de Gi","Inibição da glicocinase","Fosforilação do IRS"],1,"O ATP fecha o canal K-ATP, a célula despolariza, canais de Ca²⁺ abrem e o Ca²⁺ dispara a exocitose."],

[5,2,"A genitália externa masculina depende principalmente de qual hormônio?",["Testosterona circulante","DHT","Estradiol","AMH","LH"],1,"A 5α-redutase converte testosterona em DHT, que forma pênis, escroto e próstata."],

[6,2,"Um inibidor de PDE5 provoca ereção por:",["Liberar NO diretamente","Prolongar a ação do GMPc","Ativar o simpático","Aumentar a testosterona","Bloquear a guanilil ciclase"],1,"A PDE5 degrada o GMPc; sua inibição mantém o relaxamento da musculatura lisa, desde que haja estímulo sexual para liberar NO."],

const AP1=`<h2 id="s1">1. O que é um hormônio</h2><p>Hormônio é um mensageiro químico produzido por células endócrinas, lançado no líquido extracelular e levado pelo sangue a células-alvo que expressam o receptor específico. A <b>especificidade</b> não vem do hormônio, mas do receptor: células sem receptor não respondem. A comunicação pode ser <b>endócrina</b> (via sangue), <b>parácrina</b> (difusão a células vizinhas) ou <b>autócrina</b> (a própria célula secretora é alvo).</p>
<div class="box k">💡 <b>CONCEITO-CHAVE</b><br>Efeito hormonal = concentração do hormônio × número e sensibilidade dos receptores × eficiência da via de sinalização pós-receptor.</div>
<h2 id="s2">2. Classificação química e biossíntese</h2><p><b>Peptídeos e proteínas</b> (insulina, GH, ADH, PTH): o gene é transcrito e o RNAm traduzido no retículo endoplasmático rugoso como <i>pré-pró-hormônio</i>. A sequência-sinal é removida (pró-hormônio) e, no Golgi, enzimas clivam o pró-hormônio, gerando hormônio ativo e fragmentos, empacotados em vesículas secretoras. Há <b>armazenamento prévio</b>: o estímulo (↑Ca²⁺ ou ↑AMPc) dispara exocitose imediata. Ex.: a pró-insulina libera insulina e peptídeo C em quantidades equimolares.</p>
<p><b>Esteroides</b> (cortisol, aldosterona, estrogênio, progesterona, testosterona) derivam do <b>colesterol</b> por enzimas específicas de cada tecido. Não são estocados: são sintetizados sob demanda e difundem pela membrana. <b>Derivados da tirosina</b>: catecolaminas (síntese prévia, vesículas, receptor de membrana) e hormônios tireoidianos (iodados, ligados a carreadores, receptor nuclear).</p>
<div class="sc"><table><tr><th></th><th>Peptídeos</th><th>Esteroides</th><th>Catecolaminas</th><th>Tireoidianos</th></tr><tr><td>Armazenamento</td><td>Vesículas</td><td>Não (sob demanda)</td><td>Vesículas</td><td>Precursor estocado</td></tr><tr><td>Liberação</td><td>Exocitose</td><td>Difusão</td><td>Exocitose</td><td>Difusão</td></tr><tr><td>Transporte</td><td>Livres</td><td>Proteínas carreadoras</td><td>Livres</td><td>Proteínas carreadoras</td></tr><tr><td>Meia-vida</td><td>Curta</td><td>Longa</td><td>Curta</td><td>Longa</td></tr><tr><td>Receptor</td><td>Membrana</td><td>Intracelular*</td><td>Membrana</td><td>Núcleo</td></tr><tr><td>Resposta</td><td>Rápida: modifica proteínas existentes</td><td>Lenta: nova síntese proteica</td><td>Rápida</td><td>Lenta</td></tr></table></div><p class="sm">*Alguns esteroides também têm receptores de membrana com efeitos rápidos não genômicos.</p>
<div class="box w">⚠️ <b>PEGADINHA DE PROVA</b><br>Só a fração <i>livre</i> do hormônio é ativa. Aumento de proteína carreadora eleva o hormônio <i>total</i> sem alterar a fração livre; o feedback ajusta a produção e o paciente segue eutireoideo ou eucortisólico.</div>
<h2 id="s3">3. Receptores e transdução de sinal</h2><p><b>Canais iônicos</b>: a ligação abre o canal (efeito em milissegundos). <b>Receptores acoplados à proteína G (GPCR)</b>: ligação → troca de GDP por GTP na subunidade α → α dissocia de βγ e modula um efetor. <b>Gs</b> ativa adenilil ciclase (↑AMPc → PKA); <b>Gi</b> inibe; <b>Gq</b> ativa fosfolipase C (PIP2 → IP3 + DAG → ↑Ca²⁺ e PKC). <b>Receptores com atividade enzimática</b>: tirosina-quinase (insulina: autofosforilação → IRS → PI3K/Akt e MAPK) ou associados a JAK/STAT (GH, leptina, prolactina).</p>
<div id="fig1"></div>
<h2 id="s4">4. Regulação de receptores e feedback</h2><p><b>Down-regulation</b>: exposição prolongada reduz número e sensibilidade (ex.: GnRH contínuo). <b>Up-regulation</b>: baixa exposição aumenta receptores (ex.: estrogênio induz receptores de progesterona). O controle principal é por <b>feedback negativo</b>: o produto final inibe hipotálamo e hipófise (alça longa) ou a hipófise inibe o hipotálamo (alça curta). O <b>feedback positivo</b> é raro e explica o pico de LH pré-ovulatório e a ocitocina no parto.</p>
<div class="box b">🧠 <b>RACIOCÍNIO FISIOLÓGICO</b><br>Para localizar a lesão, observe o par hormônio trófico/hormônio periférico: ambos baixos → falha hipotálamo-hipofisária (secundária/terciária); trófico alto e periférico baixo → falha da glândula (primária).</div>
<div class="box">🩺 <b>CORRELAÇÃO CLÍNICA</b><br>Hipotireoidismo primário: T4 livre ↓, TSH ↑ (perda do feedback). Secundário: T4 ↓ com TSH baixo ou inapropriadamente normal.</div>
<details class="box"><summary><b>Aprofundamento (Guyton & Hall)</b></summary>A ação de segundos mensageiros é amplificada em cascata: uma molécula de hormônio ativa várias proteínas G, cada uma ativando adenilil ciclase, que gera muitas moléculas de AMPc. Isso explica a alta sensibilidade a concentrações hormonais muito baixas.</details>
<div class="box k">📌 <b>PARA MEMORIZAR</b><br>Gs = AMPc↑ · Gi = AMPc↓ · Gq = IP3/DAG/Ca²⁺ · Insulina = tirosina-quinase · GH/leptina = JAK-STAT · Esteroides = receptor intracelular.</div>`;
let EXT0=`<h2 id='s5'>5. Sinalização em detalhe</h2><p><b>Ciclo da proteína G.</b> Inativa, a subunidade α está ligada a GDP e acoplada a βγ. A ligação do hormônio ao receptor troca GDP por GTP; α-GTP e βγ modulam efetores. O sinal termina quando a atividade GTPásica da α hidrolisa o GTP e o complexo se reassocia. O receptor ativado é fosforilado e ligado pela β-arrestina, que o internaliza: é a base da <b>dessensibilização</b> e da down-regulation. A toxina colérica mantém a Gs ativa e a toxina pertussis bloqueia a Gi.</p><p><b>Via do AMPc.</b> A adenilil ciclase converte ATP em AMPc, que ativa a <b>PKA</b>; a PKA fosforila enzimas (resposta rápida) e fatores de transcrição como o CREB (efeito gênico). A <b>fosfodiesterase (PDE)</b> degrada o AMPc, e as metilxantinas (cafeína, teofilina) inibem a PDE. A cascata amplifica o sinal: uma molécula de hormônio ativa várias proteínas G, e cada ciclase produz muito AMPc.</p><p><b>Via IP3/DAG/Ca²⁺.</b> A fosfolipase C cliva o PIP2 em IP3 (abre canais de Ca²⁺ do retículo endoplasmático) e DAG (ativa a PKC). O Ca²⁺ liga-se à calmodulina e ativa quinases dependentes de Ca²⁺-calmodulina. Exemplos: TRH, GnRH e angiotensina II.</p><p><b>Receptores enzimáticos.</b> O receptor de <b>insulina</b> e o de IGF-1 têm domínio tirosina-quinase próprio: dimerizam, autofosforilam e fosforilam o IRS (vias PI3K/Akt e MAPK). Os receptores de GH, prolactina e leptina não têm atividade enzimática: recrutam a <b>JAK2</b>, que fosforila o receptor e as proteínas <b>STAT</b>, que dimerizam, vão ao núcleo e ativam genes.</p><p><b>Receptores intracelulares.</b> Esteroides, hormônios tireoidianos e vitamina D ligam-se a receptores no citoplasma (associados a chaperonas, como a HSP90) ou no núcleo. O complexo dimeriza, liga-se ao <b>elemento responsivo ao hormônio (HRE)</b> no DNA e recruta coativadores, alterando a transcrição. A latência é de horas, e o efeito dura enquanto as proteínas induzidas persistirem.</p><div class='sc'><table><tr><th>Receptor</th><th>Mecanismo</th><th>Exemplos</th><th>Latência</th></tr><tr><td>Canal iônico</td><td>Abertura do canal</td><td>ACh nicotínico</td><td>ms</td></tr><tr><td>GPCR</td><td>Proteína G → AMPc ou IP3/DAG</td><td>Glucagon, TSH, ACTH, PTH, TRH, GnRH</td><td>segundos a minutos</td></tr><tr><td>Tirosina-quinase</td><td>Autofosforilação → IRS</td><td>Insulina, IGF-1</td><td>minutos a horas</td></tr><tr><td>JAK/STAT</td><td>JAK2 → STAT</td><td>GH, prolactina, leptina</td><td>horas</td></tr><tr><td>Intracelular</td><td>Fator de transcrição</td><td>Cortisol, estrogênio, T3, calcitriol</td><td>horas a dias</td></tr></table></div><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br><b>Doença de Graves:</b> anticorpos estimulam o receptor de TSH (GPCR-Gs), mantendo o AMPc alto: hipertireoidismo com TSH suprimido. <b>Pseudohipoparatireoidismo 1a:</b> mutação da Gsα causa resistência ao PTH (PTH alto, Ca baixo, fosfato alto). <b>DM2:</b> resistência à insulina por down-regulation do receptor e defeitos pós-receptor.</div><h2 id='s6'>6. Dinâmica hormonal e interações</h2><p>A concentração de um hormônio depende da secreção, da ligação a proteínas e da depuração. As principais carreadoras são a <b>SHBG</b> (testosterona e estradiol), a <b>CBG</b> (cortisol e progesterona) e a <b>TBG</b> (T4 e T3). Só a fração <b>livre</b> é ativa e é ela que o feedback regula. Na gravidez, o estrogênio aumenta a TBG, a CBG e a SHBG: os valores <b>totais</b> sobem e os livres permanecem normais. A <b>meia-vida</b> dos peptídeos é de minutos; a do cortisol, de 60 a 90 min; a do T3, de cerca de 1 dia, e a do T4, de cerca de 7 dias. A depuração ocorre por metabolismo hepático (inativação e conjugação) e excreção renal.</p><p>A secreção pode ser <b>pulsátil</b> (GnRH, GH), <b>circadiana</b> (cortisol) ou <b>cíclica</b> (ciclo menstrual). Os estímulos podem ser <b>humorais</b> (glicose → insulina; Ca²⁺ → PTH; osmolaridade → ADH), <b>neurais</b> (acetilcolina → medula adrenal) ou <b>hormonais</b> (hormônios tróficos). O feedback pode ser de alça <b>longa</b> (hormônio final), <b>curta</b> (hormônio hipofisário) ou <b>ultracurta</b> (hormônio hipotalâmico sobre o próprio neurônio). Os hormônios interagem por <b>sinergismo</b> (FSH + testosterona), <b>permissividade</b> (cortisol permite a ação das catecolaminas) e <b>antagonismo</b> (insulina × glucagon).</p><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>Esteroides liberados por difusão não ficam estocados; peptídeos ficam. Por isso, uma queda aguda de síntese de esteroide reduz a secreção em horas, e a de peptídeo é tamponada pelo estoque.</div><h2 id='s7'>7. Revisão final</h2><p><b>Dez conceitos essenciais</b></p><ol><li>A especificidade da resposta está no receptor.</li><li>Peptídeos: estocados em vesículas e liberados por exocitose; esteroides: sintetizados sob demanda.</li><li>Esteroides circulam ligados a proteínas e têm meia-vida longa.</li><li>Só a fração livre é ativa.</li><li>Gs ↑ AMPc, Gi ↓ AMPc, Gq → IP3/DAG/Ca²⁺.</li><li>Insulina usa tirosina-quinase; GH e leptina usam JAK/STAT.</li><li>Receptores intracelulares alteram a transcrição.</li><li>Down-regulation reduz a resposta à exposição prolongada.</li><li>O feedback negativo domina o controle dos eixos.</li><li>O feedback positivo é raro (pico de LH, parto).</li></ol><p><b>Cinco relações de causa e efeito</b></p><ul><li>Exposição contínua a GnRH → dessensibilização → ↓ LH e FSH.</li><li>↑ TBG na gravidez → ↑ T4 total, T4 livre normal.</li><li>Anticorpo ativador do receptor de TSH → ↑ AMPc → hipertireoidismo.</li><li>Cafeína inibe a PDE → ↑ AMPc.</li><li>Falha da glândula → hormônio periférico baixo → perda do feedback → hormônio trófico alto.</li></ul><p><b>Cinco perguntas de revisão ativa</b></p><ol><li>Por que esteroides atuam mais devagar que peptídeos?</li><li>Quais segundos mensageiros Gs, Gi e Gq geram?</li><li>Como a insulina e o GH sinalizam diferentemente?</li><li>Como interpretar TSH alto com T4 livre baixo?</li><li>Em que situações o feedback é positivo?</li></ol><div class='sc'><table><tr><th>Classe</th><th>Receptor</th><th>Sinal</th><th>Velocidade</th></tr><tr><td>Peptídeo</td><td>Membrana</td><td>AMPc, IP3/DAG, quinases</td><td>Rápida</td></tr><tr><td>Esteroide</td><td>Intracelular</td><td>Transcrição</td><td>Lenta</td></tr><tr><td>Catecolamina</td><td>Membrana</td><td>AMPc, IP3/DAG</td><td>Rápida</td></tr><tr><td>Tireoidiano</td><td>Nuclear</td><td>Transcrição</td><td>Lenta</td></tr></table></div>`;
let EXT1=`<h2 id='t5'>5. Hormônios e tipos celulares em detalhe</h2><p>A adeno-hipófise tem cinco linhagens: <b>somatotrofos</b> (GH), <b>lactotrofos</b> (prolactina), <b>tireotrofos</b> (TSH), <b>corticotrofos</b> (ACTH) e <b>gonadotrofos</b> (FSH e LH). TSH, FSH e LH são glicoproteínas com a mesma subunidade α e subunidade β específica. O ACTH deriva da POMC, que também origina o MSH (por isso o excesso de ACTH escurece a pele). GH e prolactina são da mesma família de peptídeos.</p><div class='sc'><table><tr><th>Hormônio hipotalâmico</th><th>Alvo hipofisário</th><th>Via</th><th>Feedback do produto final</th></tr><tr><td>TRH</td><td>Tireotrofos (TSH) e lactotrofos</td><td>Gq</td><td>T3/T4</td></tr><tr><td>CRH</td><td>Corticotrofos (ACTH)</td><td>Gs</td><td>Cortisol</td></tr><tr><td>GHRH</td><td>Somatotrofos (GH)</td><td>Gs</td><td>IGF-1</td></tr><tr><td>Somatostatina</td><td>Inibe GH e TSH</td><td>Gi</td><td>IGF-1 a estimula</td></tr><tr><td>GnRH</td><td>Gonadotrofos (LH e FSH)</td><td>Gq</td><td>Esteroides sexuais e inibina</td></tr><tr><td>Dopamina</td><td>Inibe a prolactina</td><td>Gi (D2)</td><td>Prolactina (alça curta)</td></tr></table></div><p>Os núcleos hipotalâmicos têm funções distintas: <b>supraóptico e paraventricular</b> (magnocelulares: ADH e ocitocina; o paraventricular também tem neurônios parvocelulares com CRH e TRH), <b>arqueado</b> (GHRH e dopamina), <b>pré-óptico</b> (GnRH) e <b>supraquiasmático</b> (relógio circadiano). A <b>prolactina</b> estimula a lactogênese; seu controle é predominantemente inibitório (dopamina). A hiperprolactinemia inibe o GnRH, causando hipogonadismo (amenorreia e infertilidade) e galactorreia.</p><h2 id='t6'>6. Neuro-hipófise em detalhe: ADH e ocitocina</h2><p>O <b>ADH</b> é liberado principalmente pelo aumento da <b>osmolaridade</b> plasmática (osmorreceptores sensíveis a variações de 1 a 2%) e, com limiar maior, pela <b>hipovolemia</b> (barorreceptores). No ducto coletor, o receptor <b>V2</b> (Gs/AMPc) insere <b>aquaporina-2</b> na membrana luminal, aumentando a reabsorção de água; o receptor V1 (Gq) causa vasoconstrição. A deficiência de ADH (<b>diabetes insípido central</b>) ou a resistência renal ao ADH (<b>nefrogênico</b>) causa poliúria com urina diluída e hiperosmolaridade; o excesso (<b>SIADH</b>) causa hiponatremia por diluição com urina concentrada.</p><p>A <b>ocitocina</b> é liberada pela sucção (reflexo de ejeção do leite) e pela distensão do colo uterino no parto, em <b>feedback positivo</b>: a contração empurra o feto, a distensão estimula mais ocitocina, e assim sucessivamente até o parto.</p><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>No diabetes insípido central, o ADH baixo responde à desmopressina; no nefrogênico, o rim não responde. Na SIADH há <b>hiponatremia</b>, e não desidratação.</div><h2 id='t7'>7. Hipopituitarismo e tumores</h2><p>Tumores hipofisários (o mais comum é o <b>prolactinoma</b>) causam efeito de massa e alterações hormonais. A expansão para cima comprime o <b>quiasma óptico</b>, produzindo <b>hemianopsia bitemporal</b>. A compressão da haste aumenta a prolactina e reduz os demais hormônios. Em geral, a deficiência progride na ordem GH e gonadotrofinas → TSH → ACTH. Na síndrome de Sheehan, a necrose hipofisária pós-parto causa pan-hipopituitarismo (falha da lactação, amenorreia e insuficiência adrenal e tireoidiana secundárias).</p><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br>Mulher com amenorreia e galactorreia: dose a prolactina. Se alta, o mecanismo é a inibição do GnRH pela prolactina; um agonista dopaminérgico reduz o tumor e a prolactina.</div><h2 id='t8'>8. Revisão final</h2><p><b>Dez conceitos essenciais</b></p><ol><li>Adeno-hipófise é glandular; neuro-hipófise é neural.</li><li>O sistema porta leva hormônios hipotalâmicos à adeno-hipófise.</li><li>Neurônios magnocelulares sintetizam ADH e ocitocina.</li><li>Neurônios parvocelulares secretam hormônios hipofisiotróficos.</li><li>Dopamina inibe a prolactina.</li><li>GnRH deve ser pulsátil.</li><li>Cada eixo tem feedback negativo de alça longa.</li><li>TSH, FSH e LH compartilham a subunidade α.</li><li>ADH age em V2 (aquaporina-2) e V1 (vasoconstrição).</li><li>Tumores hipofisários podem causar hemianopsia bitemporal.</li></ol><p><b>Cinco relações de causa e efeito</b></p><ul><li>Compressão da haste → ↓ dopamina → ↑ prolactina.</li><li>↑ osmolaridade → ↑ ADH → ↑ aquaporina-2 → urina concentrada.</li><li>Lesão adrenal primária → ↓ cortisol → ↑ ACTH.</li><li>Sucção → ↑ ocitocina → ejeção do leite.</li><li>Prolactina alta → ↓ GnRH → hipogonadismo.</li></ul><p><b>Cinco perguntas de revisão ativa</b></p><ol><li>Por que a hipofisectomia não elimina totalmente o ADH?</li><li>Como diferenciar hipercortisolismo hipofisário de adrenal pelo ACTH?</li><li>Por que a prolactina sobe quando a haste é seccionada?</li><li>Qual o efeito da infusão contínua de GnRH?</li><li>Qual a diferença entre diabetes insípido central e nefrogênico?</li></ol><div class='sc'><table><tr><th>Eixo</th><th>Trófico hipotalâmico</th><th>Hipofisário</th><th>Alvo e produto</th></tr><tr><td>Tireóideo</td><td>TRH</td><td>TSH</td><td>Tireoide: T3/T4</td></tr><tr><td>Adrenal</td><td>CRH</td><td>ACTH</td><td>Adrenal: cortisol</td></tr><tr><td>Somatotrófico</td><td>GHRH / SS</td><td>GH</td><td>Fígado: IGF-1</td></tr><tr><td>Gonadal</td><td>GnRH</td><td>FSH / LH</td><td>Gônadas: esteroides e inibina</td></tr><tr><td>Prolactina</td><td>Dopamina (−)</td><td>Prolactina</td><td>Mama: leite</td></tr></table></div>`;

const AP2=`<h2 id="t1">1. Anatomia funcional</h2><p>A hipófise ocupa a sela túrcica do esfenoide e liga-se ao hipotálamo pela haste (infundíbulo), cuja base é a <b>eminência média</b>. São duas glândulas de origem distinta: a <b>adeno-hipófise</b> (epitélio glandular, derivado da bolsa de Rathke) e a <b>neuro-hipófise</b> (tecido nervoso, extensão do hipotálamo). Essa diferença embrionária determina tudo: a adeno-hipófise <i>sintetiza</i> hormônios sob comando de hormônios hipotalâmicos; a neuro-hipófise apenas <i>armazena e libera</i> hormônios produzidos no hipotálamo.</p>
<div class="sc"><table><tr><th></th><th>Adeno-hipófise</th><th>Neuro-hipófise</th></tr><tr><td>Origem</td><td>Epitelial (bolsa de Rathke)</td><td>Neural (hipotálamo)</td></tr><tr><td>Conexão</td><td>Sistema porta hipotalâmico-hipofisário (vascular)</td><td>Axônios (trato hipotálamo-hipofisário)</td></tr><tr><td>Neurônios de origem</td><td>Parvocelulares</td><td>Magnocelulares (supraóptico e paraventricular)</td></tr><tr><td>Hormônios</td><td>TSH, ACTH, GH, FSH, LH, prolactina</td><td>ADH e ocitocina</td></tr><tr><td>Controle</td><td>Hormônios liberadores/inibidores + feedback</td><td>Reflexos neurais e osmolaridade</td></tr></table></div>
<h2 id="t2">2. Neuro-hipófise: neurônios magnocelulares</h2><p>Os corpos celulares dos neurônios magnocelulares sintetizam ADH e ocitocina como pró-hormônios. As vesículas descem pelo axônio, são <b>armazenadas nos terminais da neuro-hipófise</b> e liberadas na circulação por exocitose quando o potencial de ação chega ao terminal (Ca²⁺-dependente). Por isso, a hipofisectomia ou a secção da haste reduz a liberação, mas o hipotálamo continua sintetizando: o ADH ainda pode ser liberado por terminais na eminência média (diabetes insípido, frequentemente transitório).</p>
<div class="box k">💡 <b>CONCEITO-CHAVE</b><br>ADH e ocitocina não são hormônios hipofisários na origem: são hormônios hipotalâmicos liberados pela hipófise posterior.</div>
<h2 id="t3">3. Adeno-hipófise: neurônios parvocelulares e sistema porta</h2><p>Neurônios parvocelulares liberam hormônios <b>hipofisiotróficos</b> na eminência média, em um primeiro leito capilar. Os vasos portais carregam esses hormônios diretamente ao segundo leito capilar, entre as células da adeno-hipófise, em concentrações altas e sem diluição sistêmica. Cada hormônio hipotalâmico estimula ou inibe um tipo celular: TRH → TSH (e prolactina); CRH → ACTH; GHRH → GH (somatostatina inibe); GnRH → FSH e LH; <b>dopamina inibe a prolactina</b>, de modo que a prolactina é o único eixo com controle predominantemente inibitório.</p>
<div id="fig2"></div>
<div class="box w">⚠️ <b>PEGADINHA DE PROVA</b><br>Compressão da haste hipofisária reduz todos os hormônios da adeno-hipófise, exceto a <b>prolactina, que aumenta</b> (perde a inibição dopaminérgica). O GnRH precisa ser <b>pulsátil</b>: a infusão contínua dessensibiliza o gonadotrofo.</div>
<h2 id="t4">4. Feedback e níveis de disfunção</h2><p>Cada eixo tem feedback negativo de <b>alça longa</b> (hormônio periférico inibe hipotálamo e hipófise) e de <b>alça curta</b> (hormônio hipofisário inibe o hipotálamo). Para interpretar uma disfunção, compare os três níveis do eixo, usando o eixo do cortisol como modelo:</p>
<div class="sc"><table><tr><th>Nível da lesão</th><th>CRH</th><th>ACTH</th><th>Cortisol</th></tr><tr><td>Primária (adrenal) com excesso</td><td>↓</td><td>↓</td><td>↑</td></tr><tr><td>Secundária (hipófise) com excesso</td><td>↓</td><td>↑</td><td>↑</td></tr><tr><td>Terciária (hipotálamo) com excesso</td><td>↑</td><td>↑</td><td>↑ (feedback falha)</td></tr></table></div>
<p>Na hipersecreção primária, o cortisol alto suprime CRH e ACTH. Na secundária, o ACTH autônomo mantém o cortisol alto, que ainda suprime o CRH. Na terciária, o hipotálamo não responde ao feedback. No hipofuncionamento vale a lógica inversa: trófico alto com periférico baixo indica falha da glândula-alvo.</p>
<div class="box">🩺 <b>CORRELAÇÃO CLÍNICA</b><br>Cortisol e ACTH elevados com CRH baixo apontam para fonte hipofisária de ACTH (doença de Cushing). Cortisol elevado com ACTH suprimido aponta para tumor adrenal. O teste ajuda a decidir se a lesão está acima ou dentro da glândula.</div>
<div class="box b">🧠 <b>RACIOCÍNIO FISIOLÓGICO</b><br>Pergunte sempre: o hormônio de cima está alto ou baixo? Se o feedback é negativo, o trófico responde de forma oposta ao hormônio periférico, a menos que a lesão esteja no próprio nível trófico.</div>
<div class="box k">📌 <b>PARA MEMORIZAR</b><br>Parvocelular = adeno (porta) · Magnocelular = neuro (axônio) · Dopamina inibe prolactina · GnRH pulsátil · Haste comprimida → prolactina ↑, demais ↓.</div>`;

const APX={8:{t:['Foliculogênese','Fase folicular e proliferativa','Ovulação e pico de LH','Fase lútea e secretora','Menstruação e ciclos anovulatórios','Minhas anotações'],mins:12,f:()=>{const X=d=>20+d*18.57,P=a=>a.map(([d,v])=>`${X(d)},${190-v*1.5}`).join(' '),L=(a,c,w)=>`<polyline fill='none' stroke='${c}' stroke-width='${w||2.5}' points='${P(a)}'/>`;return `<svg viewBox='0 0 560 265' width='100%' role='img' aria-label='Ciclo menstrual'>${L([[0,10],[11,12],[13,35],[14,100],[15,30],[17,12],[28,10]],O)}${L([[0,28],[6,30],[10,20],[13,28],[14,45],[15,16],[24,8],[28,25]],B)}${L([[0,15],[5,22],[9,50],[13,90],[14,80],[16,40],[21,60],[25,30],[28,15]],G)}${L([[0,5],[13,6],[15,20],[21,100],[25,55],[28,8]],'#6B4F3A')}<path d='M${X(14)} 30V200' stroke='#C0392B' stroke-dasharray='4' fill='none'/><g font-size='10' text-anchor='middle'><text x='${X(14)}' y='24' fill='#C0392B'>ovulação (dia 14)</text><text x='80' y='60' fill='#C96B3C'>LH</text><text x='80' y='72' fill='#3B6FB6'>FSH</text><text x='80' y='84' fill='#3E8E5A'>Estradiol</text><text x='80' y='96' fill='#6B4F3A'>Progesterona</text><rect x='${X(0)}' y='205' width='${X(5)-X(0)}' height='22' fill='#C0392B' opacity='.6'/><rect x='${X(5)}' y='205' width='${X(14)-X(5)}' height='22' fill='#3B6FB6' opacity='.6'/><rect x='${X(14)}' y='205' width='${X(28)-X(14)}' height='22' fill='#C96B3C' opacity='.6'/><text x='${X(2.5)}' y='220' fill='#fff'>Mens.</text><text x='${X(9.5)}' y='220' fill='#fff'>Proliferativa</text><text x='${X(21)}' y='220' fill='#fff'>Secretora</text>${[0,7,14,21,28].map(d=>`<text x='${X(d)}' y='250' fill='#776B63'>${d}</text>`).join('')}</g></svg><div class='sm'>Curvas esquemáticas: mostram a relação entre os picos, e não valores absolutos. Eixo: dias do ciclo.</div>`},h:`<h2 id='u8_1'>1. Foliculogênese</h2><p>A fase <b>independente de gonadotrofinas</b> inclui o folículo <b>primordial</b> (&lt;20 µm; uma camada de células achatadas precursoras da granulosa) e o <b>primário</b> (&lt;120 µm; granulosa cuboide, zona pelúcida em formação). Após a puberdade, ondas foliculares recrutam folículos para a fase <b>tônica dependente de FSH</b>: o <b>secundário/pré-antral</b> (várias camadas de granulosa; as células intersticiais formam a teca interna), o <b>antral</b> (2ª a 5ª ordem; líquido folicular, antro e teca externa) e, na fase rápida dependente de gonadotrofinas (seleção, dominância, maturação), o folículo <b>de Graaf</b> (6ª a 8ª ordem, ~20 mm), com oócito excêntrico preso por pedúnculo (disco prolígero).</p><div class='sc'><table><tr><th>Estágio</th><th>Granulosa e teca</th><th>Dependência</th></tr><tr><td>Primordial → primário</td><td>Uma camada; zona pelúcida</td><td>Independente de gonadotrofinas</td></tr><tr><td>Secundário (1ª ordem)</td><td>Várias camadas; teca interna</td><td>FSH (tônico)</td></tr><tr><td>Antral (2ª–5ª ordem)</td><td>Antro; teca externa; coorte para recrutamento (~85 dias no total)</td><td>FSH (tônico)</td></tr><tr><td>Graaf (6ª–8ª ordem)</td><td>Antro grande; cumulus oophorus</td><td>FSH e LH (rápido)</td></tr></table></div><p>O recrutamento ocorre no fim da fase lútea, quando a queda de estradiol, progesterona e inibina libera o FSH. Entre os recrutados, <b>o folículo com mais receptores de FSH e maior aromatase</b> produz mais estradiol e inibina, que suprimem o FSH e levam os demais à atresia. Ele se torna o <b>folículo dominante</b>.</p><h2 id='u8_2'>2. Fase folicular e proliferativa</h2><p>O FSH, auxiliado pelo LH, estimula o modelo das duas células e o <b>estradiol</b> sobe progressivamente. Em níveis baixos a moderados, ele faz <b>feedback negativo</b> sobre FSH e LH. No útero, o estradiol promove a <b>fase proliferativa</b>: crescimento do endométrio funcional, glândulas e artérias espiraladas; no colo, muco abundante e filante.</p><div id='figx'></div><h2 id='u8_3'>3. Ovulação e pico de LH</h2><p>Quando o estradiol permanece alto por cerca de 48 h, o feedback torna-se <b>positivo</b>, gerando o <b>pico de LH</b> (com pico menor de FSH). O LH retoma a meiose do oócito (1º corpo polar; fica em metáfase II), luteiniza a granulosa e ativa enzimas proteolíticas e prostaglandinas que rompem o antro e a parede folicular. O oócito sai com o cumulus expandido. A ovulação ocorre cerca de 10 a 12 h após o pico de LH. A temperatura basal sobe por ação da progesterona.</p><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>O pico de LH vem do feedback <b>positivo do estradiol</b>, e não da progesterona. O oócito só completa a meiose II se for fecundado.</div><h2 id='u8_4'>4. Fase lútea e secretora</h2><p>Após a ovulação, a granulosa e a teca luteinizam-se e formam o <b>corpo lúteo</b>, vascularizado e rico em colesterol. Ele secreta <b>progesterona</b> (pico por volta do dia 21), estradiol e inibina. Esses hormônios exercem feedback negativo sobre o hipotálamo e a hipófise (FSH e LH baixos). A progesterona transforma o endométrio em <b>secretor</b>: glândulas tortuosas com glicogênio e gordura, estroma edemaciado, preparado para a implantação, e reduz a contratilidade uterina. A duração da fase lútea é relativamente constante (~14 dias). Se houver gravidez, o hCG mantém o corpo lúteo; se não, ele regride em <b>corpo albicans</b>, e estradiol, progesterona e inibina caem, retomando o FSH e um novo ciclo.</p><div class='sc'><table><tr><th>Fase</th><th>Ovário</th><th>Hormônios</th><th>Endométrio</th></tr><tr><td>Menstruação</td><td>Recrutamento (FSH ↑)</td><td>E e P baixos</td><td>Descamação</td></tr><tr><td>Proliferativa</td><td>Folicular</td><td>E ↑</td><td>Prolifera</td></tr><tr><td>Ovulação</td><td>Ruptura</td><td>Pico de LH</td><td>Proliferativo tardio</td></tr><tr><td>Secretora</td><td>Corpo lúteo</td><td>P ↑ e E ↑</td><td>Secretor</td></tr></table></div><h2 id='u8_5'>5. Menstruação e ciclos anovulatórios</h2><p>A regressão do corpo lúteo reduz a progesterona e o estradiol. As artérias espiraladas sofrem vasoespasmo e isquemia, com liberação de prostaglandinas, e a <b>camada funcional se descama</b> (menstruação). No <b>ciclo anovulatório</b> não há pico de LH, corpo lúteo nem progesterona: o estradiol atua sem oposição, mantendo um endométrio proliferativo contínuo, com sangramentos irregulares e risco de hiperplasia. Pode ocorrer por estresse, síndrome dos ovários policísticos, hiperprolactinemia ou proximidade da menopausa.</p><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br>Paciente com ciclos irregulares e progesterona sérica baixa na fase lútea (dia 21): sugere ausência de ovulação. Temperatura basal sem elevação bifásica apoia o diagnóstico.</div><div class='box k'>📌 <b>PARA MEMORIZAR</b><br>E ↑ → proliferativa · Pico de LH → ovulação · P ↑ → secretora · Queda de P → menstruação · Anovulação = E sem P.</div>`},9:{t:['Distribuição e funções','Osso e remodelação','PTH','Vitamina D','Calcitonina e FGF23','Integração e clínica','Minhas anotações'],mins:12,f:()=>`<svg viewBox='0 0 560 200' width='100%' role='img' aria-label='Homeostase do cálcio'>${bxs([[10,10,120,'Ca²⁺ plasmático ↓',O],[170,10,150,'Paratireoides: PTH ↑',B],[10,80,140,'Osso: libera Ca e P',G],[190,80,150,'Rim: ↑ Ca, ↓ P reabs.',G],[380,80,160,'Rim: calcitriol (1α-OH)',G],[380,140,160,'Intestino: ↑ Ca e P',G],[130,140,140,'Ca²⁺ plasmático ↑',G]])}${lns([['M130 24H170'],['M245 38V62H80V80'],['M245 62H265V80'],['M245 62H460V80'],['M460 108V140'],['M80 108V154H130'],['M265 108V140'],['M380 154H270'],['M200 168H4V24H10',R]])}${txs([[300,185,'Ca²⁺ alto inibe o PTH (receptor sensor de cálcio)']])}</svg><div class='sm'>Laranja: estímulo · Azul: regulação · Verde: resposta · Tracejado vermelho: feedback negativo.</div>`,h:`<h2 id='u9_1'>1. Distribuição e funções</h2><p>O <b>cálcio</b> está 98,9% nos ossos, 1% nas células e 0,1% no líquido extracelular; o <b>fosfato</b>, 85% nos ossos, 14 a 15% nas células e menos de 1% no extracelular. O osso é, portanto, o grande reservatório. O cálcio participa da exocitose, da sinalização intracelular, do potencial de membrana, da contração muscular, da coagulação e do esqueleto. O fósforo compõe o ATP, tampões, membranas, enzimas e proteínas. No plasma, o cálcio (~9–10,5 mg/dL) circula <b>ionizado (livre, ativo, ≈50%)</b>, <b>ligado à albumina (≈40%)</b> e complexado a ânions. O fosfato (~4 mg/dL) circula como HPO₄²⁻ e H₂PO₄⁻.</p><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>Hipoalbuminemia reduz o cálcio <b>total</b>, mas o <b>ionizado</b> pode estar normal. A alcalose aumenta a ligação à albumina e reduz o cálcio ionizado, podendo causar tetania mesmo com cálcio total normal.</div><h2 id='u9_2'>2. Osso e remodelação</h2><p>O osso é remodelado continuamente. Os <b>osteoblastos</b> formam matriz e a mineralizam; os <b>osteoclastos</b> a reabsorvem, liberando cálcio e fosfato. Os osteoblastos expressam RANKL, que ativa os osteoclastos (a osteoprotegerina o neutraliza). O PTH age nos osteoblastos e aumenta esse sinal.</p><h2 id='u9_3'>3. PTH</h2><p>O PTH é secretado pelas <b>paratireoides</b>; sua função é <b>evitar a hipocalcemia</b>. As células principais detectam o cálcio pelo <b>receptor sensor de cálcio</b>: cálcio baixo estimula e cálcio alto inibe a secreção. O PTH atua via receptor acoplado à proteína G, <b>adenilil ciclase → AMPc → proteínas quinases</b>. No <b>osso</b>, ativa osteoclastos existentes e promove sua proliferação; nos <b>rins</b>, aumenta a reabsorção de cálcio (túbulos distais e ductos coletores), <b>reduz a reabsorção de fosfato</b> e aumenta a formação de calcitriol (1α-hidroxilase). O efeito líquido é <b>↑ cálcio e ↓ fosfato</b> plasmáticos.</p><div id='figx'></div><h2 id='u9_4'>4. Vitamina D</h2><p>É um esteroide (calciferol), obtido da dieta e da <b>pele</b> (UVB converte o 7-desidrocolesterol em colecalciferol). No <b>fígado</b> é hidroxilada em 25(OH)D (forma de armazenamento e dosagem) e nos <b>túbulos proximais renais</b> a 1α-hidroxilase forma o <b>calcitriol</b>, a forma ativa. Essa enzima é estimulada por PTH, hipocalcemia e hipofosfatemia. O calcitriol aumenta a <b>absorção intestinal de cálcio e fosfato</b>, potencializa o efeito do PTH no osso e favorece a reabsorção renal. Seu principal efeito é evitar a hipocalcemia.</p><h2 id='u9_5'>5. Calcitonina e FGF23</h2><p>A <b>calcitonina</b> (células parafoliculares C da tireoide; AMPc) <b>evita a hipercalcemia</b>: reduz a atividade e a formação de osteoclastos e diminui a reabsorção. Tem papel secundário no adulto. Como aprofundamento, o <b>FGF23</b>, produzido por osteócitos, aumenta a excreção renal de fosfato e inibe a 1α-hidroxilase, reduzindo o calcitriol.</p><div class='sc'><table><tr><th></th><th>PTH</th><th>Calcitriol</th><th>Calcitonina</th></tr><tr><td>Origem</td><td>Paratireoides</td><td>Pele, fígado, rim</td><td>Células C da tireoide</td></tr><tr><td>Estímulo</td><td>Ca²⁺ baixo</td><td>PTH, Ca e P baixos</td><td>Ca²⁺ alto</td></tr><tr><td>Osso</td><td>Reabsorção ↑</td><td>Potencializa PTH</td><td>Reabsorção ↓</td></tr><tr><td>Rim</td><td>↑ Ca, ↓ fosfato reabsorvidos</td><td>↑ reabsorção</td><td>Ação menor</td></tr><tr><td>Intestino</td><td>Indireto (calcitriol)</td><td>↑ absorção de Ca e P</td><td>—</td></tr></table></div><h2 id='u9_6'>6. Integração e clínica</h2><div class='sc'><table><tr><th>Condição</th><th>Ca²⁺</th><th>Fosfato</th><th>PTH</th></tr><tr><td>Hiperparatireoidismo primário</td><td>↑</td><td>↓</td><td>↑</td></tr><tr><td>Hipoparatireoidismo</td><td>↓</td><td>↑</td><td>↓</td></tr><tr><td>Deficiência de vitamina D (hiperparatireoidismo secundário)</td><td>↓ ou normal</td><td>↓</td><td>↑</td></tr><tr><td>Hipercalcemia da malignidade (PTHrP)</td><td>↑</td><td>↓</td><td>↓</td></tr></table></div><p><b>Hipocalcemia</b>: o cálcio baixo aumenta a excitabilidade neuromuscular (menos bloqueio dos canais de Na⁺): parestesias, tetania (sinais de Chvostek e Trousseau), QT longo e convulsões. <b>Hipercalcemia</b>: litíase renal, dor óssea, constipação, poliúria e alterações neuropsiquiátricas. A deficiência de vitamina D causa raquitismo na criança e osteomalácia no adulto.</p><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br>Cálcio alto, fosfato baixo e PTH alto: hiperparatireoidismo primário (o PTH reduz a reabsorção de fosfato). Cálcio alto com PTH suprimido: pense em causa não paratireoidiana.</div><div class='box k'>📌 <b>PARA MEMORIZAR</b><br>PTH: ↑Ca, ↓P · Calcitriol: ↑ absorção intestinal · Calcitonina: ↓Ca · FGF23: ↓P e ↓ calcitriol · Ca baixo estimula PTH pelo receptor sensor.</div>`},6:{t:['Organização testicular e trajeto','Espermatogênese','Sertoli e Leydig','Controle hormonal','Ereção e óxido nítrico','Caso clínico: infertilidade','Minhas anotações'],mins:12,f:()=>`<svg viewBox='0 0 560 200' width='100%' role='img' aria-label='Eixo hipotálamo-hipófise-testículo'>${bxs([[10,10,130,'Hipotálamo: GnRH',O],[200,10,140,'Hipófise: FSH e LH',B],[120,80,110,'Sertoli (FSH)',G],[330,80,110,'Leydig (LH)',G],[120,150,120,'Inibina B + ABP',G],[330,150,110,'Testosterona',G]])}${lns([['M140 24H200'],['M225 38V60H175V80'],['M315 38V60H385V80'],['M175 108V150'],['M385 108V150'],['M240 164H270V38',R],['M440 164H520V24H340',R]])}${txs([[300,125,'T local sustenta Sertoli'],[455,178,'T, DHT e E2 inibem GnRH e LH'],[200,190,'inibina B inibe só o FSH']])}</svg><div class='sm'>Laranja: estímulo · Azul: hipófise · Verde: resposta · Tracejado vermelho: feedback negativo.</div>`,h:`<h2 id='u6_1'>1. Organização testicular e trajeto</h2><p>O testículo contém os <b>túbulos seminíferos</b> (compartimento germinativo, com células de Sertoli) e o <b>interstício</b> (células de Leydig, vasos e fibroblastos). Os espermatozoides seguem: túbulos seminíferos → rede testicular → ductos eferentes → <b>epidídimo</b> → ducto deferente → ducto ejaculatório → uretra. O escroto mantém os testículos abaixo da temperatura corporal, condição necessária à espermatogênese. As glândulas acessórias (vesículas seminais, próstata e bulbouretrais) formam a maior parte do sêmen.</p><div class='sc'><table><tr><th>Componente do sêmen</th><th>Origem</th><th>Função</th></tr><tr><td>Espermatozoides</td><td>Túbulos seminíferos</td><td>Gameta</td></tr><tr><td>Frutose, vitamina C, prostaglandinas</td><td>Vesículas seminais</td><td>Nutrição; contração da musculatura lisa</td></tr><tr><td>Ácido cítrico, tampões</td><td>Próstata</td><td>Nutrição; neutralizam a acidez vaginal</td></tr><tr><td>Muco</td><td>Bulbouretrais</td><td>Lubrificante</td></tr><tr><td>Carnitina</td><td>Epidídimo</td><td>Nutrição</td></tr><tr><td>Enzimas</td><td>Vesículas e próstata</td><td>Coagulam o sêmen na vagina e depois o liquefazem</td></tr></table></div><h2 id='u6_2'>2. Espermatogênese</h2><p>As células germinativas existem desde a vida fetal, mas as <b>espermatogônias iniciam a diferenciação na puberdade</b>, quando o eixo hipotálamo-hipófise-gônada é ativado (FSH e testosterona). A espermatogônia divide-se por mitose (renovação e produção de espermatócitos); o <b>espermatócito primário</b> faz a meiose I e origina espermatócitos secundários; a meiose II gera as <b>espermátides</b> haploides. Na <b>espermiogênese</b> a espermátide não se divide, mas se transforma: o núcleo condensa, forma-se o acrossoma, desenvolve-se o flagelo e o excesso de citoplasma é eliminado e fagocitado pela célula de Sertoli. O processo todo dura cerca de 70 dias. No epidídimo os espermatozoides amadurecem (motilidade e capacidade fertilizante).</p><h2 id='u6_3'>3. Células de Sertoli e de Leydig</h2><div class='sc'><table><tr><th>Sertoli (receptores de FSH e de testosterona)</th><th>Leydig (receptor de LH)</th></tr><tr><td>ABP (retém testosterona no túbulo) · barreira hematotesticular · fagocitose de resíduos · aromatase · inibina B · AMH (feto)</td><td>Testosterona · DHT · pequena produção de estrógeno · ação parácrina sobre Sertoli</td></tr></table></div><p>A <b>barreira hematotesticular</b> é formada por junções oclusivas entre células de Sertoli e separa o compartimento basal (espermatogônias) do adluminal (células meióticas e haploides), protegendo-as do sistema imune e criando um ambiente rico em K⁺ e esteroides.</p><h2 id='u6_4'>4. Controle hormonal</h2><p>O GnRH hipotalâmico, pulsátil, estimula a hipófise a secretar <b>FSH</b> (age na Sertoli: sustento da espermatogênese, ABP, inibina B) e <b>LH</b> (age na Leydig: testosterona). A testosterona, o DHT e o estradiol inibem o hipotálamo e o LH; a <b>inibina B</b> inibe seletivamente o FSH. A espermatogênese exige FSH e a testosterona intratesticular alta.</p><div id='figx'></div><div class='sc'><table><tr><th></th><th>Hipogonadismo primário</th><th>Hipogonadismo secundário</th></tr><tr><td>Local</td><td>Testículo</td><td>Hipotálamo ou hipófise</td></tr><tr><td>LH e FSH</td><td>Altos</td><td>Baixos ou inapropriadamente normais</td></tr><tr><td>Testosterona</td><td>Baixa</td><td>Baixa</td></tr><tr><td>Inibina B</td><td>Baixa (dano tubular)</td><td>Baixa ou normal-baixa</td></tr></table></div><h2 id='u6_5'>5. Ereção e óxido nítrico</h2><p>Estímulos táteis e eróticos ativam centros medulares e encefálicos: o parassimpático é ativado e o simpático inibido. O nervo cavernoso libera <b>óxido nítrico (NO)</b> (e a acetilcolina ativa a eNOS no endotélio). O NO ativa a <b>guanilil ciclase</b>, que forma <b>GMPc</b>, ativa a proteína quinase G, reduz o Ca²⁺ intracelular e <b>relaxa a musculatura lisa</b> das arteríolas e dos corpos cavernosos: vasodilatação e ereção. A <b>fosfodiesterase 5 (PDE5)</b> degrada o GMPc. Sildenafila, vardenafila e tadalafila inibem a PDE5 e prolongam o efeito do GMPc.</p><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>Os inibidores de PDE5 não geram ereção sozinhos: dependem do estímulo sexual, que libera o NO. A ereção é parassimpática; a ejaculação é simpática.</div><h2 id='u6_6'>6. Caso clínico: infertilidade</h2><p>João, 32 anos, tenta engravidar a esposa há mais de 1 ano. Teve <b>orquite bilateral por caxumba aos 16 anos</b>. Testículos de 10 mL, <b>azoospermia</b>, atrofia testicular bilateral. Testosterona total 260 ng/dL (ref. 249–836), <b>FSH 15</b> (ref. 1,5–12,4), LH 8 (ref. 1,7–8,6), <b>inibina B 38</b> (ref. &gt;80).</p><p><b>1. Primária ou secundária?</b> Primária (testicular): o FSH está alto, e não baixo. <b>2. Inibina B e FSH:</b> a lesão das células de Sertoli e dos túbulos reduz a inibina B; sem seu feedback seletivo, o FSH sobe. <b>3. Testosterona:</b> no limite inferior da referência: as células de Leydig estão parcialmente preservadas e o LH no limite superior compensa, caracterizando falência testicular compensada. <b>4. Diferença FSH × LH:</b> o FSH reflete o dano tubular (inibina B), e o LH reflete a função de Leydig, menos comprometida. <b>5. Infertilidade:</b> a atrofia pós-orquite destrói o epitélio germinativo, causando azoospermia, sem espermatozoides para fecundar.</p><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br>FSH alto + inibina B baixa = dano tubular. Em hipogonadismo secundário o FSH e o LH estariam baixos.</div><div class='box k'>📌 <b>PARA MEMORIZAR</b><br>Sertoli: FSH, ABP, inibina B, barreira · Leydig: LH, testosterona · NO → GMPc → relaxamento · PDE5 degrada GMPc.</div>`},7:{t:['Modelo das duas células','Transporte','Ações de estrogênio e progesterona','Feedback','Climatério e menopausa','Minhas anotações'],mins:11,f:()=>`<svg viewBox='0 0 560 175' width='100%' role='img' aria-label='Modelo de duas células'>${bxs([[10,10,190,'Teca interna · LH',O],[10,70,190,'Androstenediona e testosterona',B],[330,10,190,'Granulosa · FSH',O],[330,70,190,'Aromatase (CYP19)',B],[330,130,190,'Estradiol e estrona',G]])}${lns([['M105 38V70'],['M200 84H330'],['M425 38V70'],['M425 98V130']])}${txs([[265,78,'lâmina basal'],[105,56,'colesterol → CYP17'],[425,60,'sem CYP17']])}</svg><div class='sm'>Laranja: estímulo · Azul: enzimas e substratos · Verde: produto.</div>`,h:`<h2 id='u7_1'>1. Modelo das duas células e duas gonadotrofinas</h2><p>Na <b>teca interna</b>, o <b>LH</b> (via AMPc) aumenta a entrada de colesterol (StAR) e as enzimas (CYP11A1, CYP17) que formam <b>androstenediona e testosterona</b>. Esses androgênios atravessam a lâmina basal e chegam à <b>granulosa</b>, que não expressa CYP17. Sob o estímulo do <b>FSH</b> (AMPc), a granulosa transcreve o gene da <b>aromatase</b> e converte androstenediona em estrona e testosterona em <b>estradiol</b>. Assim, o estrogênio depende da cooperação das duas células e das duas gonadotrofinas. O FSH também aumenta a produção de inibina e o número de receptores de LH na granulosa; após a ovulação, o corpo lúteo produz sobretudo progesterona.</p><div id='figx'></div><div class='box k'>💡 <b>CONCEITO-CHAVE</b><br>Teca (LH) → androgênios. Granulosa (FSH) → aromatase → estrogênios. Sem LH ou sem FSH, não há estradiol.</div><h2 id='u7_2'>2. Transporte</h2><p>O estrogênio circula 60% ligado à SHBG, 20% à albumina e 20% livre. A progesterona circula ligada à globulina ligadora de cortisol e à albumina, com baixa afinidade.</p><h2 id='u7_3'>3. Ações de estrogênio e progesterona</h2><div class='sc'><table><tr><th>Tecido</th><th>Estrogênio</th><th>Progesterona</th></tr><tr><td>Muco cervical</td><td>↑ água, mais distensível (periovulatório)</td><td>Menor volume, espesso e turvo</td></tr><tr><td>Colo uterino</td><td>Aberto</td><td>Fechado</td></tr><tr><td>Epitélio vaginal</td><td>Estratificação e cornificação; ↑ glicogênio</td><td>Descamação em blocos</td></tr><tr><td>Tubas uterinas</td><td>↑ contrações, proliferação e secreção</td><td>↓ cílios, secreção e contratilidade</td></tr><tr><td>Útero e endométrio</td><td>Proliferação; ↑ receptores de progesterona e de ocitocina; ↑ motilidade</td><td>Endométrio secretor (gordura e glicogênio, células deciduais); ↓ contratilidade; ↑ fluxo sanguíneo</td></tr><tr><td>Mamas</td><td>Crescimento dos ductos, gordura, pigmentação da aréola</td><td>Desenvolvimento glandular e arborização dos ductos; retenção de água</td></tr><tr><td>Osso</td><td>↑ osteoblastos, ↓ osteoclastos; fechamento das epífises</td><td>—</td></tr><tr><td>SNC e temperatura</td><td>Efeito antidepressivo e antinociceptivo</td><td>Ansiolítico; ↑ temperatura basal</td></tr><tr><td>Metabolismo</td><td>↑ HDL; deposição de gordura feminina (mamas, quadril); retenção de sal e água</td><td>Retenção de sal e água</td></tr></table></div><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>O estrogênio induz receptores de progesterona (priming) e a progesterona reduz os receptores de estrogênio. A progesterona só age bem em tecido previamente preparado pelo estrogênio. Temperatura basal sobe com progesterona, e não com estrogênio.</div><h2 id='u7_4'>4. Feedback</h2><p>O GnRH é pulsátil: pulsos rápidos favorecem a síntese de LH e pulsos lentos favorecem a de FSH. O <b>estrogênio em níveis baixos a moderados faz feedback negativo</b> no hipotálamo e na hipófise; em níveis <b>altos e sustentados</b> torna-se <b>positivo</b> e gera o pico de LH. A <b>inibina</b> (granulosa) inibe seletivamente o FSH.</p><h2 id='u7_5'>5. Climatério e menopausa</h2><p>Os níveis de estrogênio sobem na puberdade, oscilam durante a vida reprodutiva e caem na <b>menopausa</b>, por esgotamento dos folículos. Sem estradiol e inibina, o feedback negativo cessa e <b>FSH e LH sobem</b> (o FSH, primeiro). Consequências: ondas de calor (alteração da termorregulação), atrofia urogenital, perda óssea acelerada (osteoporose) e perfil lipídico menos favorável. Após a menopausa, a principal fonte de estrogênio é a estrona, formada pela aromatização periférica de androgênios no tecido adiposo.</p><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br>Mulher de 52 anos, amenorreia e ondas de calor: FSH elevado e estradiol baixo, indicando falência ovariana primária fisiológica.</div><div class='box k'>📌 <b>PARA MEMORIZAR</b><br>Teca = LH = androgênios · Granulosa = FSH = aromatase · E ↑ por tempo = pico de LH · Menopausa: FSH ↑ e estradiol ↓.</div>`},4:{t:['Ilhotas e síntese da insulina','Secreção de insulina','Ação da insulina','Glucagon e somatostatina','Clínica','Minhas anotações'],mins:12,f:()=>`<svg viewBox='0 0 560 200' width='100%' role='img' aria-label='Secreção de insulina'>${bxs([[10,20,70,'Glicose',O],[105,20,130,'GLUT2 + glicocinase',B],[255,20,70,'ATP ↑',B],[350,20,90,'K-ATP fecha',R],[350,100,90,'Despolariza',B],[235,100,90,'Ca²⁺ entra',B],[120,100,90,'Exocitose',G],[10,100,80,'Insulina ↑',G],[235,165,170,'GLP-1/GIP (AMPc), ACh (IP3)',G,10],[420,165,130,'Adrenalina (α2/Gi) inibe',R,10]])}${lns([['M80 34H105'],['M235 34H255'],['M325 34H350'],['M395 48V100'],['M350 114H325'],['M235 114H210'],['M120 114H90'],['M320 165V128'],['M485 165V128H440',R]])}${txs([[395,14,'sulfonilureias fecham este canal'],[280,155,'potencializam']])}</svg><div class='sm'>Laranja: estímulo · Azul: etapas · Verde: resposta · Vermelho: inibição.</div>`,h:`<h2 id='u4_1'>1. Ilhotas e síntese da insulina</h2><p>As ilhotas de Langerhans (ilha = ínsula) contêm células <b>B (≈60%, insulina)</b>, <b>A (≈25%, glucagon)</b>, <b>D (≈10%, somatostatina)</b> e <b>PP (≈5%, polipeptídeo pancreático)</b>. A insulina nasce de um gene cujo RNAm é traduzido no retículo rugoso como <b>pré-pró-insulina</b> (sinal, cadeia B, peptídeo C, cadeia A). O sinal é removido, a <b>pró-insulina</b> dobra-se e forma pontes dissulfeto entre A e B, e no Golgi enzimas de conversão excisam o <b>peptídeo C</b>. Os grânulos armazenam insulina e peptídeo C em quantidades equimolares.</p><div class='box k'>💡 <b>CONCEITO-CHAVE</b><br>O peptídeo C é marcador de secreção endógena: baixo no DM1, normal ou alto no DM2, e baixo em quem usa insulina exógena.</div><h2 id='u4_2'>2. Secreção de insulina</h2><p>A glicose entra na célula B pelo <b>GLUT2</b> (Km alto, ≈15–20 mM, por isso o fluxo acompanha a glicemia) e é fosforilada pela <b>glicocinase</b>, o sensor de glicose. Sua oxidação aumenta o <b>ATP</b>, que fecha o canal de K⁺ sensível ao ATP (subunidade SUR). A queda da saída de K⁺ <b>despolariza</b> a célula, abre canais de Ca²⁺ dependentes de voltagem, e o <b>Ca²⁺ intracelular</b> dispara a exocitose dos grânulos. Aminoácidos e ácidos graxos também são oxidados e estimulam; as <b>incretinas (GLP-1 e GIP)</b> atuam via Gs/AMPc/PKA, a acetilcolina via Gq/IP3, e gastrina, secretina, CCK, GH, cortisol e glucagon também estimulam. A adrenalina e a noradrenalina inibem pelo receptor α2 (Gi). As <b>sulfonilureias</b> fecham o canal K-ATP.</p><p>A resposta é <b>bifásica</b>: a 1ª fase (rápida) libera grânulos pré-formados; a 2ª fase (sustentada) depende de nova mobilização. No DM2 a 1ª fase se perde precocemente; no DM1 não há resposta.</p><div id='figx'></div><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>Sulfonilureias estimulam a secreção independentemente da glicose, por isso causam hipoglicemia. Já o GLP-1 só potencializa a secreção quando há glicose elevada.</div><h2 id='u4_3'>3. Ação da insulina</h2><p>O receptor é uma <b>tirosina-quinase</b> (subunidades α e β). A ligação causa autofosforilação, fosforila os substratos <b>IRS</b> e ativa duas vias: <b>PI3K → Akt</b> (translocação do GLUT4, metabolismo da glicose, síntese de glicogênio, lipídeos e proteínas via GSK3) e <b>Ras → MAPK</b> (crescimento, diferenciação e expressão gênica). O transporte de aminoácidos e íons aumenta em segundos, as enzimas mudam de atividade em 10–15 min e novas proteínas surgem em horas a dias.</p><div class='sc'><table><tr><th>Transportador</th><th>Tecidos</th><th>Km (mM)</th><th>Função</th></tr><tr><td>GLUT1</td><td>Eritrócitos, cérebro</td><td>1–2</td><td>Captação basal</td></tr><tr><td>GLUT2</td><td>Célula B, fígado, rim, intestino</td><td>15–20</td><td>Sensor de glicose</td></tr><tr><td>GLUT3</td><td>Neurônios, placenta</td><td>&lt;1</td><td>Captação neuronal</td></tr><tr><td>GLUT4</td><td>Músculo, adiposo</td><td>≈5</td><td>Dependente de insulina</td></tr><tr><td>GLUT5</td><td>Intestino, rim</td><td>1–2</td><td>Frutose</td></tr></table></div><p><b>Fígado:</b> ativa a glicogênio sintase e inibe a fosforilase, aumenta a glicólise (glicocinase, fosfofrutoquinase, piruvato quinase, piruvato desidrogenase), a lipogênese (citrato liase, acetil-CoA carboxilase), forma VLDL e inibe a gliconeogênese (PEPCK e glicose-6-fosfatase). <b>Músculo:</b> ↑ captação de glicose, glicogênio, transporte de aminoácidos e síntese proteica. <b>Tecido adiposo:</b> ↑ captação de glicose, ativa a lipoproteína lipase, armazena triglicerídeos e inibe a lipólise. Na ausência de insulina, o GLUT4 permanece em vesículas intracelulares.</p><h2 id='u4_4'>4. Glucagon e somatostatina</h2><p>O glucagon (29 aminoácidos) é estimulado por <b>aminoácidos, estresse, cortisol, exercício e hipoglicemia</b> e inibido pela <b>glicose, insulina e somatostatina</b>. No fígado aumenta a glicogenólise (via AMPc) e a gliconeogênese e inibe o armazenamento de triglicerídeos; no adiposo ativa a lipase; na hipoglicemia prolongada favorece a formação de cetonas. A <b>somatostatina</b> (célula D) inibe insulina e glucagon e prolonga o tempo de absorção dos nutrientes.</p><div class='sc'><table><tr><th>Hormônio</th><th>Principais ações</th><th>Estímulo</th><th>Efeito</th></tr><tr><td>Insulina</td><td>↑ captação de glicose, ↑ glicogênio, ↓ glicogenólise, ↓ gliconeogênese</td><td>Glicemia ↑, incretinas</td><td>↓ glicemia</td></tr><tr><td>Glucagon</td><td>↑ glicogenólise, ↑ gliconeogênese</td><td>Hipoglicemia, aminoácidos</td><td>↑ glicemia</td></tr><tr><td>Adrenalina</td><td>↑ glicogenólise, ↑ lipólise</td><td>Hipoglicemia, estresse</td><td>↑ glicemia</td></tr><tr><td>Cortisol</td><td>↑ gliconeogênese, ↓ captação de glicose</td><td>Estresse</td><td>↑ glicemia</td></tr><tr><td>GH</td><td>↓ captação de glicose</td><td>Hipoglicemia, jejum</td><td>↑ glicemia</td></tr></table></div><p><b>Hiperglicemia:</b> ↑ glicose → ↑ insulina e ↓ glucagon → ↑ glicólise, glicogênese, lipogênese e captação → ↓ glicemia. <b>Hipoglicemia:</b> ↓ glicose → ↑ glucagon e ↓ insulina → glicogenólise e gliconeogênese (a queda da insulina libera lactato, aminoácidos e ácidos graxos para o fígado).</p><h2 id='u4_5'>5. Clínica</h2><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br><b>DM1:</b> destruição autoimune das células B; insulina e peptídeo C baixos; sem insulina há hiperglicemia, lipólise sem freio e cetoacidose. <b>DM2:</b> resistência à insulina com falha progressiva da célula B e perda da 1ª fase; peptídeo C normal ou alto no início. <b>Hipoglicemia:</b> sintomas adrenérgicos (tremor, sudorese) e neuroglicopênicos (confusão); causas incluem excesso de insulina ou sulfonilureia (peptídeo C alto com sulfonilureia, baixo com insulina exógena).</div><div class='box b'>🧠 <b>RACIOCÍNIO FISIOLÓGICO</b><br>Insulina é o único hormônio hipoglicemiante; todos os outros (glucagon, adrenalina, cortisol, GH) elevam a glicemia. Em jejum, o equilíbrio desloca-se para glucagon e glicogenólise.</div><div class='box k'>📌 <b>PARA MEMORIZAR</b><br>GLUT2 → glicocinase → ATP ↑ → K-ATP fecha → despolariza → Ca²⁺ → exocitose · GLUT4 = insulina · Peptídeo C = secreção endógena.</div>`},5:{t:['Síntese de testosterona','Transporte e ativação','Mecanismo de ação','Ações dos androgênios','Feedback e testosterona intratesticular','Diferenciação sexual e clínica','Minhas anotações'],mins:10,f:()=>`<svg viewBox='0 0 560 150' width='100%' role='img' aria-label='Síntese de testosterona'>${bxs([[10,10,95,'Pregnenolona',B],[140,10,90,'Progesterona',B],[270,10,100,'17-OH-Prog',B],[10,70,110,'Androstenediona',B],[170,70,100,'Testosterona',G],[330,50,100,'DHT',G],[330,100,100,'Estradiol',G]])}${lns([['M105 24H140'],['M230 24H270'],['M320 38V52H65V70'],['M120 84H170'],['M270 78H300V64H330'],['M270 90H300V114H330']])}${txs([[122,20,'3β-HSD'],[250,20,'CYP17'],[145,66,'17β-HSD III'],[300,58,'5α-redutase'],[300,108,'aromatase']])}</svg><div class='sm'>Células de Leydig (LH → AMPc): vias azuis · Tecidos periféricos: DHT (pele genital, próstata) e estradiol (tecido adiposo).</div>`,h:`<h2 id='u5_1'>1. Síntese de testosterona</h2><p>A testosterona é produzida nas <b>células de Leydig</b> (interstício testicular) sob o estímulo do <b>LH</b>, que age via receptor acoplado a Gs/AMPc/PKA, aumenta a StAR (entrada de colesterol na mitocôndria) e as enzimas esteroidogênicas. A via é: colesterol → pregnenolona (CYP11A1) → progesterona (<b>3β-HSD</b>) → 17-OH-progesterona (<b>CYP17</b>, 17-hidroxilase) → androstenediona (CYP17, liase) → <b>testosterona</b> (17β-HSD tipo III). A testosterona vai aos túbulos seminíferos ligada à ABP e à circulação ligada à SHBG.</p><div id='figx'></div><h2 id='u5_2'>2. Transporte e ativação</h2><p>Na circulação, a maior parte da testosterona está ligada à SHBG e à albumina; só a fração livre é ativa. A testosterona é em parte um <b>pró-hormônio</b>: nos tecidos-alvo, a <b>5α-redutase</b> (pele genital e próstata) a converte em <b>di-hidrotestosterona (DHT)</b>, androgênio mais potente, e a <b>aromatase (CYP19)</b>, presente no tecido adiposo, a converte em <b>estradiol</b>.</p><h2 id='u5_3'>3. Mecanismo de ação</h2><p>Como esteroide, o hormônio atravessa a membrana e liga-se ao <b>receptor androgênico</b> no citoplasma. O complexo migra ao núcleo, liga-se ao DNA, induz a <b>transcrição</b> e a <b>tradução</b> de novas proteínas. O efeito é lento e prolongado.</p><h2 id='u5_4'>4. Ações dos androgênios</h2><div class='sc'><table><tr><th>Mediador</th><th>Efeitos</th></tr><tr><td>Testosterona</td><td>Diferenciação intrauterina de epidídimo, ducto deferente e vesículas seminais; ↑ massa muscular; ↑ eritrócitos; ↓ gordura visceral abdominal; hepático (↑ VLDL e LDL, ↓ HDL); laringe (voz masculina)</td></tr><tr><td>DHT</td><td>Diferenciação de pênis, escroto, uretra e próstata; crescimento da barba; sebo; próstata; desenvolvimento puberal de pênis e vesículas seminais; espermatogênese</td></tr><tr><td>Estradiol (da aromatização)</td><td>Esqueleto (maturação e fechamento das epífises), feedback sobre gonadotrofinas, imprinting masculino de gonadotrofinas e comportamento</td></tr></table></div><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>O fechamento das epífises e parte da proteção óssea no homem dependem do <b>estradiol</b> produzido por aromatização, e não só da testosterona. A genitália externa depende do <b>DHT</b>.</div><h2 id='u5_5'>5. Feedback e testosterona intratesticular</h2><p>GnRH pulsátil → LH → Leydig → testosterona. A testosterona, o DHT e o estradiol inibem o hipotálamo e a hipófise (feedback negativo); a inibina B (da célula de Sertoli) inibe seletivamente o FSH. A concentração de testosterona <b>dentro do testículo é cerca de 100 vezes maior</b> que a circulante, e é ela que sustenta a espermatogênese (com ABP). Androgênio <b>exógeno</b> (anabolizantes) suprime o LH, derruba a testosterona intratesticular e leva à espermatogênese insuficiente, com atrofia testicular e infertilidade apesar de testosterona sérica alta.</p><h2 id='u5_6'>6. Diferenciação sexual e clínica</h2><p>O gene <b>SRY</b> do cromossomo Y induz o testículo. As células de Leydig secretam testosterona (desenvolvimento dos ductos de Wolff) e as de Sertoli secretam o <b>hormônio antimülleriano</b> (regressão dos ductos de Müller); o DHT forma a genitália externa. Sem SRY, não há AMH nem testosterona: os ductos de Müller formam útero, tubas e vagina interna, os de Wolff regridem e surge a genitália feminina.</p><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br>Deficiência de 5α-redutase: testosterona normal, mas DHT baixo; ductos de Wolff normais e genitália externa pouco virilizada ao nascimento, com virilização puberal pelo aumento de testosterona. Uso de anabolizantes: LH e FSH suprimidos, testículos pequenos, HDL baixo e infertilidade.</div><div class='box k'>📌 <b>PARA MEMORIZAR</b><br>LH → Leydig · T → DHT (5α-redutase) · T → E2 (aromatase) · SRY → testículo · AMH (Sertoli) elimina Müller · T intratesticular ≈100× o sérico.</div>`},2:{t:['Síntese e secreção','GH e IGF-1','Efeitos e insulina','Fatores reguladores','Alterações e testes','Minhas anotações'],mins:9,f:()=>`<svg viewBox='0 0 560 220' width='100%' role='img' aria-label='Eixo GH-IGF-1'>${bxs([[10,10,90,'GHRH',O],[10,60,110,'Somatostatina (−)',R],[170,35,110,'Hipófise: GH',B],[330,35,80,'Fígado',G],[450,35,90,'IGF-1',G],[300,136,130,'Adiposo: lipólise ↑',G],[300,176,150,'Músculo: aa e proteína ↑',G],[440,100,110,'Osso e órgãos',G]])}${lns([['M100 24H140V45H170'],['M120 74H140V55H170',R],['M280 49H330'],['M410 49H450'],['M495 63V95H245V63',R],['M200 63V150H300'],['M200 150V190H300'],['M520 63V100']])}${txs([[370,90,'feedback negativo do IGF-1'],[500,125,'crescimento']])}</svg><div class='sm'>Laranja: estímulo · Azul: hipófise · Verde: resposta · Vermelho: inibição.</div>`,h:`<h2 id='u2_1'>1. Síntese e secreção</h2><p>O GH é um peptídeo sintetizado e armazenado pelos <b>somatotrofos</b> da adeno-hipófise. Sua secreção é <b>pulsátil</b> e controlada por dois hormônios hipotalâmicos antagonistas: o <b>GHRH</b> estimula (via Gs/AMPc) e a <b>somatostatina</b> inibe; a <b>grelina</b> também estimula. Os maiores pulsos ocorrem no <b>sono profundo</b>. A concentração varia com a idade (cerca de 6 ng/mL na criança e 1,6 a 3 ng/mL no adulto), com pico na puberdade e declínio no envelhecimento.</p><div class='box k'>💡 <b>CONCEITO-CHAVE</b><br>Como a secreção é pulsátil, uma dosagem isolada de GH tem pouco valor. Usam-se o IGF-1 (estável) e testes dinâmicos.</div><h2 id='u2_2'>2. GH e IGF-1</h2><p>O receptor de GH é da família das citocinas e usa a via <b>JAK2/STAT</b>. Há efeitos <b>diretos</b> (adiposo e músculo) e <b>indiretos</b>, mediados pelo <b>IGF-1</b>, produzido principalmente no fígado sob ação do GH (e também localmente, de forma parácrina). O IGF-1 promove maturação e divisão celular, sobretudo nos condrócitos, e faz <b>feedback negativo</b> sobre a hipófise (estimulando também a somatostatina).</p><div id='figx'></div><h2 id='u2_3'>3. Efeitos e relação com a insulina</h2><p><b>Crescimento:</b> ↑ proliferação de condrócitos e osteoblastos, com deposição de matriz e crescimento ósseo linear, e aumento do tamanho dos órgãos (síntese de proteínas, RNAm e DNA). <b>Proteínas:</b> ↑ captação de aminoácidos e ↑ síntese proteica no músculo (massa magra). <b>Lipídeos:</b> ↑ lipólise, com menor adiposidade e mais ácidos graxos livres como combustível. <b>Glicose:</b> o GH é contrarregulador: reduz a captação de glicose no músculo e no adiposo e eleva a glicemia (efeito <b>diabetogênico</b>).</p><p>A <b>insulina favorece a expressão do receptor de GH</b> no fígado. Por isso, no diabetes tipo 1 descompensado, o GH é alto e o IGF-1 é baixo. Em estado nutricional favorável (insulina presente) prevalecem anabolismo e crescimento. No jejum, o GH sobe e desvia o consumo para lipídeos, poupando glicose.</p><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>GH ↑ com hipoglicemia e jejum; GH ↓ com hiperglicemia e obesidade. O excesso de GH causa resistência à insulina, e a desnutrição cursa com GH alto e IGF-1 baixo.</div><h2 id='u2_4'>4. Fatores que regulam o GH</h2><div class='sc'><table><tr><th>Estimulam</th><th>Inibem</th></tr><tr><td>↓ glicemia · ↓ ácidos graxos livres · jejum · estresse · exercício · sono profundo</td><td>↑ glicemia · ↑ ácidos graxos livres · envelhecimento · obesidade (resistência à insulina e hiperglicemia) · somatostatina · IGF-1</td></tr></table></div><h2 id='u2_5'>5. Alterações e testes</h2><div class='sc'><table><tr><th>Condição</th><th>GH</th><th>IGF-1</th><th>Quadro</th></tr><tr><td>Excesso na infância</td><td>↑</td><td>↑</td><td>Gigantismo (cartilagens de crescimento abertas)</td></tr><tr><td>Excesso no adulto</td><td>↑</td><td>↑</td><td>Acromegalia: extremidades, face, vísceras; resistência à insulina</td></tr><tr><td>Deficiência na infância</td><td>↓</td><td>↓</td><td>Nanismo</td></tr><tr><td>Deficiência no adulto</td><td>↓</td><td>↓</td><td>Alterações metabólicas (↑ gordura, ↓ massa magra)</td></tr><tr><td>Síndrome de Laron</td><td>↑</td><td>↓</td><td>Receptor de GH defeituoso: nanismo por resistência ao GH</td></tr></table></div><p><b>Suspeita de deficiência:</b> teste de estímulo com insulina IV (hipoglicemia induzida) e dosagem de GH; resposta anormal = o GH <b>não sobe</b>. <b>Suspeita de excesso:</b> teste oral de tolerância à glicose com 75 g; normalmente a glicose suprime o GH, e na acromegalia ele <b>não suprime</b>. O IGF-1 acompanha ambos.</p><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br>Criança com baixa estatura, GH basal alto e IGF-1 baixo: pense em Laron. Na deficiência de GH, o GH não sobe no teste de hipoglicemia e o IGF-1 é baixo.</div><div class='box k'>📌 <b>PARA MEMORIZAR</b><br>GHRH + / SS − / grelina + · JAK2-STAT · IGF-1 hepático · GH sobe no jejum e no sono · diabetogênico · supressão pela glicose na acromegalia.</div>`},3:{t:['Anatomia e esteroidogênese','Cortisol: eixo e circadiano','Efeitos do cortisol','Aldosterona e escape','Medula adrenal','Clínica','Minhas anotações'],mins:12,f:()=>`<svg viewBox='0 0 560 230' width='100%' role='img' aria-label='Esteroidogênese adrenal'>${bxs([[10,8,95,'Colesterol',O],[10,60,95,'Pregnenolona',B],[150,60,90,'Progesterona',B],[285,60,60,'DOC',B],[375,60,90,'Corticosterona',B],[485,60,70,'Aldosterona',G],[10,120,95,'17-OH-Preg',B],[150,120,95,'17-OH-Prog',B],[270,120,115,'11-Desoxicortisol',B],[415,120,80,'Cortisol',G],[10,180,95,'DHEA',B],[150,180,110,'Androstenediona',B]])}${lns([['M57 36V60'],['M105 74H150'],['M240 74H285'],['M345 74H375'],['M465 74H485'],['M57 88V120'],['M195 88V120'],['M105 134H150'],['M245 134H270'],['M385 134H415'],['M57 148V180'],['M105 194H150']])}${txs([[57,50,'CYP11A1'],[128,70,'3β-HSD'],[262,70,'CYP21A2'],[360,56,'CYP11B1'],[475,56,'CYP11B2'],[35,106,'CYP17'],[170,106,'CYP17'],[258,130,'CYP21A2'],[400,116,'CYP11B1'],[33,166,'CYP17 liase']])}</svg><div class='sm'>Linha superior: via mineralocorticoide (zona glomerulosa) · linha do meio: via glicocorticoide (fasciculada) · linha inferior: androgênios (reticular).</div>`,h:`<h2 id='u3_1'>1. Anatomia e esteroidogênese</h2><p>A adrenal tem <b>córtex</b> (origem mesodérmica, esteroides) e <b>medula</b> (origem neural, catecolaminas). O córtex é dividido em três zonas, cada uma com seu perfil enzimático:</p><div class='sc'><table><tr><th>Zona</th><th>Posição</th><th>Produto</th><th>Controle principal</th></tr><tr><td>Glomerulosa</td><td>Externa</td><td>Aldosterona (tem CYP11B2, sem CYP17)</td><td>Angiotensina II e K⁺</td></tr><tr><td>Fasciculada</td><td>Média</td><td>Cortisol (CYP17 e CYP11B1)</td><td>ACTH</td></tr><tr><td>Reticular</td><td>Interna</td><td>Androgênios fracos (DHEA, androstenediona)</td><td>ACTH</td></tr></table></div><p>A síntese parte do <b>colesterol</b>: a proteína StAR o leva à mitocôndria (etapa limitante, estimulada pelo ACTH) e a CYP11A1 forma a pregnenolona. Como os esteroides não são estocados, a produção segue a demanda. Eles circulam ligados a proteínas, atravessam a membrana, ligam-se a receptores citoplasmáticos/nucleares e alteram a transcrição (efeito lento). Glicocorticoides sintéticos: cortisona, prednisona, metilprednisona e dexametasona; mineralocorticoide sintético: 9α-fludrocortisona.</p><div id='figx'></div><h2 id='u3_2'>2. Cortisol: eixo e ritmo circadiano</h2><p>Estresse e o relógio biológico estimulam o <b>CRH</b> hipotalâmico, que estimula o <b>ACTH</b> (corticotrofos, via AMPc), que estimula a fasciculada a produzir <b>cortisol</b>. O cortisol faz feedback negativo no hipotálamo e na hipófise. A secreção é pulsátil, com <b>pico ao despertar</b> e menor valor à noite. No sangue, 80% está ligado à <b>CBG</b>, 10 a 15% à albumina e só cerca de 5% está <b>livre</b> (ativo). O fígado o metaboliza pela 11β-hidroxiesteroide desidrogenase, que interconverte cortisol e <b>cortisona</b> (inativa).</p><h2 id='u3_3'>3. Efeitos do cortisol</h2><p><b>Metabolismo:</b> estimula a gliconeogênese hepática (induz enzimas como a glicose-6-fosfatase e mobiliza aminoácidos), reduz a captação e a utilização de glicose (resistência à insulina) e eleva a glicemia. Nos tecidos extra-hepáticos causa <b>catabolismo proteico</b> (menos síntese, menos transporte de aminoácidos), enquanto no fígado aumenta proteínas plasmáticas. Mobiliza ácidos graxos e favorece sua oxidação no jejum. <b>Estresse:</b> garante energia, mantém a glicemia para o cérebro e protege contra inflamação desregulada.</p><p><b>Anti-inflamatório e imunossupressor:</b> estabiliza membranas lisossômicas, reduz a permeabilidade capilar, a síntese de prostaglandinas e leucotrienos, a migração de leucócitos e a proliferação de linfócitos T, e reduz a liberação de interleucina 1 (atenua a febre). <b>Outros tecidos:</b> inibe osteoblastos e a absorção de cálcio (↑ reabsorção óssea), inibe a síntese de colágeno, e altera a excitabilidade do SNC (excesso: depressão e prejuízo de memória). Tem <b>efeito permissivo</b> sobre catecolaminas, GH e glucagon.</p><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>Cortisol alto causa hiperglicemia, mas <b>catabolismo</b> proteico (fraqueza e afinamento da pele) e deposição central de gordura. O uso prolongado de corticoide suprime o eixo CRH-ACTH, e a suspensão abrupta provoca insuficiência adrenal secundária.</div><h2 id='u3_4'>4. Aldosterona e escape</h2><p>A aldosterona é estimulada principalmente pela <b>angiotensina II</b> (sistema renina-angiotensina-aldosterona, ativado por hipovolemia) e pelo <b>aumento do K⁺ plasmático</b>; o ACTH tem papel menor. Circula livre, com meia-vida curta. Nas <b>células principais</b> do túbulo distal/coletor, liga-se ao receptor mineralocorticoide e induz proteínas que ↑ canais de Na⁺ (ENaC), a Na⁺/K⁺-ATPase e canais de K⁺: ↑ <b>reabsorção de Na⁺</b> (e água) e ↑ <b>secreção de K⁺</b>; nas intercaladas, ↑ secreção de H⁺. O receptor também liga cortisol, mas a 11β-HSD2 renal o converte em cortisona e protege o receptor. Há alvos extrarrenais: glândulas sudoríparas e salivares e células do cólon.</p><p><b>Escape da aldosterona:</b> no excesso crônico, a expansão do volume extracelular aumenta o peptídeo natriurético atrial e a natriurese pressórica, reduzindo a reabsorção de Na⁺ e restabelecendo o balanço. Por isso <b>não há edema</b>, mas a perda de K⁺ persiste (hipocalemia).</p><h2 id='u3_5'>5. Medula adrenal</h2><p>As células cromafins sintetizam catecolaminas a partir da tirosina (tirosina → L-DOPA → dopamina → noradrenalina → adrenalina). A conversão final pela PNMT é induzida pelo cortisol, que chega à medula pelo sistema portal intra-adrenal. A liberação ocorre por exocitose após estímulo colinérgico simpático, na resposta de luta ou fuga: ↑ frequência cardíaca, glicogenólise, lipólise e redistribuição do fluxo. As catecolaminas têm meia-vida de segundos a minutos.</p><h2 id='u3_6'>6. Clínica</h2><div class='sc'><table><tr><th>Condição</th><th>ACTH</th><th>Cortisol</th><th>Quadro</th></tr><tr><td>Cushing ACTH-dependente (hipófise)</td><td>↑</td><td>↑</td><td>Obesidade central, fácies em lua cheia, estrias violáceas, HAS, hiperglicemia, fraqueza proximal, osteoporose</td></tr><tr><td>Cushing adrenal (ACTH-independente)</td><td>↓</td><td>↑</td><td>Mesmo quadro, com atrofia da adrenal contralateral</td></tr><tr><td>Insuficiência primária (Addison)</td><td>↑</td><td>↓</td><td>Hipotensão, hiponatremia, hipercalemia, hipoglicemia, hiperpigmentação</td></tr><tr><td>Insuficiência secundária</td><td>↓</td><td>↓</td><td>Sem hiperpigmentação e sem hipercalemia (aldosterona preservada)</td></tr><tr><td>Hiperaldosteronismo primário</td><td>—</td><td>—</td><td>HAS, hipocalemia, renina ↓, alcalose metabólica, sem edema</td></tr></table></div><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br>A hiperpigmentação do Addison vem do excesso de ACTH, que deriva do mesmo precursor (POMC) que o MSH. Como a aldosterona está baixa, o paciente perde Na⁺ e retém K⁺.</div><div class='box k'>📌 <b>PARA MEMORIZAR</b><br>Glomerulosa = aldosterona (AngII e K⁺) · Fasciculada = cortisol (ACTH) · Reticular = androgênios · Escape = sem edema, mas com hipocalemia.</div>`}};
function tocL(i,a){const m=a.t.length-1,e=EXT[i]?EXT[i].t:[];return a.t.slice(0,m).map((t,k)=>[t,'u'+i+'_'+(k+1)]).concat(e.map((t,k)=>[t,'x'+i+'_'+(k+1)]),[[a.t[m],'u'+i+'_'+(m+1)]]).map(([t,id])=>`<a href='#' data-t='${id}' onclick='return scr(this.dataset.t)'>${t}</a>`).join('')}
