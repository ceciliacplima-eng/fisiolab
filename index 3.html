 2, "A elevação da osmolaridade estimula osmorreceptores e a secreção de vasopressina. A via V2–Gs–AMPc–PKA promove inserção de AQP2 na membrana apical, elevando reabsorção de água. Hipovolemia intensa também estimula ADH mesmo com osmolaridade baixa. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [1, 3, "Qual alternativa descreve corretamente prolactina?", ["ADH ativa receptores V2 e aumenta aquaporina-2 no ducto coletor.", "Dopamina hipotalâmica inibe tonicamente a secreção de prolactina.", "Falência glandular primária tende a elevar o hormônio trófico correspondente.", "Hormônios hipotalâmicos alcançam a adeno-hipófise pelo sistema porta.", "ADH e ocitocina são sintetizados no hipotálamo e liberados na neuro-hipófise."], 1, "A interrupção da haste hipofisária reduz o aporte de dopamina e pode elevar prolactina. TRH pode estimulá-la, e a sucção reduz a inibição dopaminérgica; prolactina favorece produção de leite, enquanto ocitocina promove ejeção. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [1, 3, "Qual alternativa descreve corretamente lesão primária?", ["Falência glandular primária tende a elevar o hormônio trófico correspondente.", "Hormônios hipotalâmicos alcançam a adeno-hipófise pelo sistema porta.", "ADH e ocitocina são sintetizados no hipotálamo e liberados na neuro-hipófise.", "ADH ativa receptores V2 e aumenta aquaporina-2 no ducto coletor.", "Dopamina hipotalâmica inibe tonicamente a secreção de prolactina."], 0, "No hipotireoidismo primário, T4 livre baixo retira o feedback negativo e eleva TSH. Na insuficiência hipofisária, TSH pode estar baixo ou inapropriadamente normal para T4 livre reduzido. Interpretar sempre o par hormonal e o contexto clínico. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [2, 3, "Qual alternativa descreve corretamente secreção pulsátil de gh?", ["GH reduz a utilização periférica de glicose e pode antagonizar a insulina.", "Excesso de GH após fechamento epifisário causa acromegalia.", "GH alto com IGF-1 baixo pode indicar resistência ao GH.", "GH é secretado em pulsos, sobretudo durante o sono de ondas lentas.", "GH estimula IGF-1 hepático e tecidual, que medeia parte do crescimento."], 3, "A secreção somatotrófica resulta da interação entre GHRH estimulatório, somatostatina inibitória e ghrelina. Por isso, uma medida isolada de GH basal pode ser pouco informativa; IGF-1 e testes dinâmicos têm maior utilidade conforme a hipótese clínica. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [2, 3, "Qual alternativa descreve corretamente eixo gh–igf-1?", ["GH alto com IGF-1 baixo pode indicar resistência ao GH.", "GH é secretado em pulsos, sobretudo durante o sono de ondas lentas.", "GH estimula IGF-1 hepático e tecidual, que medeia parte do crescimento.", "GH reduz a utilização periférica de glicose e pode antagonizar a insulina.", "Excesso de GH após fechamento epifisário causa acromegalia."], 2, "GH se liga ao receptor associado a JAK2, ativando STAT e transcrição gênica. IGF-1 age por receptor tirosina-quinase e estimula proliferação condrocitária e crescimento longitudinal enquanto placas epifisárias estão abertas. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [2, 3, "Qual alternativa descreve corretamente gh e glicose?", ["GH estimula IGF-1 hepático e tecidual, que medeia parte do crescimento.", "GH reduz a utilização periférica de glicose e pode antagonizar a insulina.", "Excesso de GH após fechamento epifisário causa acromegalia.", "GH alto com IGF-1 baixo pode indicar resistência ao GH.", "GH é secretado em pulsos, sobretudo durante o sono de ondas lentas."], 1, "Além do crescimento, GH aumenta lipólise e disponibilidade de ácidos graxos. Em excesso crônico, favorece resistência à insulina e hiperglicemia; seus efeitos metabólicos diretos diferem das ações promotoras de crescimento do IGF-1. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [2, 3, "Qual alternativa descreve corretamente acromegalia?", ["Excesso de GH após fechamento epifisário causa acromegalia.", "GH alto com IGF-1 baixo pode indicar resistência ao GH.", "GH é secretado em pulsos, sobretudo durante o sono de ondas lentas.", "GH estimula IGF-1 hepático e tecidual, que medeia parte do crescimento.", "GH reduz a utilização periférica de glicose e pode antagonizar a insulina."], 0, "Após a fusão das placas de crescimento, não ocorre gigantismo longitudinal; predominam crescimento acral, alterações de tecidos moles e efeitos cardiometabólicos. IGF-1 elevado e ausência de supressão apropriada do GH após glicose sustentam a investigação. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [2, 3, "Qual alternativa descreve corretamente resistência ao gh?", ["GH é secretado em pulsos, sobretudo durante o sono de ondas lentas.", "GH estimula IGF-1 hepático e tecidual, que medeia parte do crescimento.", "GH reduz a utilização periférica de glicose e pode antagonizar a insulina.", "Excesso de GH após fechamento epifisário causa acromegalia.", "GH alto com IGF-1 baixo pode indicar resistência ao GH."], 4, "Na síndrome de Laron, alterações do receptor de GH ou da via de sinalização comprometem geração de IGF-1. A redução do feedback pode elevar GH apesar de crescimento insuficiente. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [3, 3, "Qual alternativa descreve corretamente zonas do córtex?", ["Renina inicia a formação de angiotensina II, estimulando aldosterona.", "Excesso de cortisol e deficiência adrenal produzem perfis clínicos distintos.", "Glomerulosa produz aldosterona; fasciculada cortisol; reticular andrógenos.", "CRH estimula ACTH, que ativa produção de cortisol.", "Aldosterona aumenta reabsorção de sódio e secreção de potássio."], 2, "A zona glomerulosa expressa aldosterona sintase e responde sobretudo à angiotensina II e ao potássio. A fasciculada depende de ACTH para esteroidogênese de cortisol, enquanto a reticular contribui para DHEA e androstenediona. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [3, 3, "Qual alternativa descreve corretamente acth e cortisol?", ["Glomerulosa produz aldosterona; fasciculada cortisol; reticular andrógenos.", "CRH estimula ACTH, que ativa produção de cortisol.", "Aldosterona aumenta reabsorção de sódio e secreção de potássio.", "Renina inicia a formação de angiotensina II, estimulando aldosterona.", "Excesso de cortisol e deficiência adrenal produzem perfis clínicos distintos."], 1, "ACTH atua no receptor MC2R acoplado a Gs e aumenta AMPc/PKA, mobilizando colesterol e estimulando sua transferência mitocondrial por StAR. Cortisol circulante inibe CRH e ACTH; estresse pode elevar a atividade do eixo. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [3, 3, "Qual alternativa descreve corretamente aldosterona renal?", ["Aldosterona aumenta reabsorção de sódio e secreção de potássio.", "Renina inicia a formação de angiotensina II, estimulando aldosterona.", "Excesso de cortisol e deficiência adrenal produzem perfis clínicos distintos.", "Glomerulosa produz aldosterona; fasciculada cortisol; reticular andrógenos.", "CRH estimula ACTH, que ativa produção de cortisol."], 0, "O receptor mineralocorticoide induz expressão de ENaC e Na+/K+-ATPase nas células principais do néfron distal. O gradiente eletroquímico favorece secreção de potássio; o efeito sobre H+ nas células intercaladas contribui para alcalose metabólica em excesso. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [3, 3, "Qual alternativa descreve corretamente raas?", ["Excesso de cortisol e deficiência adrenal produzem perfis clínicos distintos.", "Glomerulosa produz aldosterona; fasciculada cortisol; reticular andrógenos.", "CRH estimula ACTH, que ativa produção de cortisol.", "Aldosterona aumenta reabsorção de sódio e secreção de potássio.", "Renina inicia a formação de angiotensina II, estimulando aldosterona."], 4, "A redução de perfusão renal, NaCl na mácula densa e ativação simpática beta-1 favorecem liberação de renina. Angiotensina II contrai vasos e estimula aldosterona; o potássio plasmático também regula diretamente a zona glomerulosa. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [3, 3, "Qual alternativa descreve corretamente cushing versus addison?", ["CRH estimula ACTH, que ativa produção de cortisol.", "Aldosterona aumenta reabsorção de sódio e secreção de potássio.", "Renina inicia a formação de angiotensina II, estimulando aldosterona.", "Excesso de cortisol e deficiência adrenal produzem perfis clínicos distintos.", "Glomerulosa produz aldosterona; fasciculada cortisol; reticular andrógenos."], 3, "Hipercortisolismo crônico favorece hiperglicemia, fraqueza proximal, redistribuição de gordura e fragilidade cutânea. Insuficiência adrenal primária pode cursar com hipotensão, hiponatremia, hipercalemia e ACTH elevado; hiperpigmentação decorre de aumento de derivados de POMC. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [4, 3, "Qual alternativa descreve corretamente acoplamento glicose–insulina?", ["Insulina domina no estado alimentado; glucagon aumenta no jejum.", "ATP fecha KATP, despolariza a célula beta e abre canais de Ca2+.", "Insulina ativa receptor tirosina-quinase e a via IRS–PI3K–Akt.", "Glucagon eleva produção hepática de glicose no jejum.", "Peptídeo C é liberado com insulina endógena na clivagem da pró-insulina."], 1, "Glicose entra na célula beta por transportadores como GLUT1 e GLUT3 em humanos; a glicocinase participa do sensoriamento metabólico. O aumento de ATP/ADP fecha canais KATP, reduz efluxo de K+, abre canais de Ca2+ voltagem-dependentes e induz exocitose dos grânulos de insulina. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [4, 3, "Qual alternativa descreve corretamente receptor de insulina?", ["Insulina ativa receptor tirosina-quinase e a via IRS–PI3K–Akt.", "Glucagon eleva produção hepática de glicose no jejum.", "Peptídeo C é liberado com insulina endógena na clivagem da pró-insulina.", "Insulina domina no estado alimentado; glucagon aumenta no jejum.", "ATP fecha KATP, despolariza a célula beta e abre canais de Ca2+."], 0, "A autofosforilação do receptor recruta proteínas IRS. PI3K/Akt promove translocação de GLUT4 em músculo e tecido adiposo, síntese de glicogênio e efeitos anabólicos. No fígado, a insulina reduz produção hepática de glicose sem depender de GLUT4. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [4, 3, "Qual alternativa descreve corretamente glucagon?", ["Peptídeo C é liberado com insulina endógena na clivagem da pró-insulina.", "Insulina domina no estado alimentado; glucagon aumenta no jejum.", "ATP fecha KATP, despolariza a célula beta e abre canais de Ca2+.", "Insulina ativa receptor tirosina-quinase e a via IRS–PI3K–Akt.", "Glucagon eleva produção hepática de glicose no jejum."], 4, "Produzido por células alfa, atua predominantemente em receptores hepáticos Gs–AMPc–PKA, favorecendo glicogenólise e gliconeogênese. A secreção aumenta quando glicose cai e é modulada por sinais paracrinos das ilhotas. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [4, 3, "Qual alternativa descreve corretamente peptídeo c?", ["ATP fecha KATP, despolariza a célula beta e abre canais de Ca2+.", "Insulina ativa receptor tirosina-quinase e a via IRS–PI3K–Akt.", "Glucagon eleva produção hepática de glicose no jejum.", "Peptídeo C é liberado com insulina endógena na clivagem da pró-insulina.", "Insulina domina no estado alimentado; glucagon aumenta no jejum."], 3, "A pró-insulina é processada em insulina e peptídeo C, liberados em quantidades equimolares. A dosagem de peptídeo C auxilia na avaliação da produção endógena, diferentemente da insulina administrada externamente. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [4, 3, "Qual alternativa descreve corretamente estado alimentado e jejum?", ["Glucagon eleva produção hepática de glicose no jejum.", "Peptídeo C é liberado com insulina endógena na clivagem da pró-insulina.", "Insulina domina no estado alimentado; glucagon aumenta no jejum.", "ATP fecha KATP, despolariza a célula beta e abre canais de Ca2+.", "Insulina ativa receptor tirosina-quinase e a via IRS–PI3K–Akt."], 2, "Após refeição, a insulina favorece armazenamento de glicogênio e lipídios e síntese proteica. No jejum, redução da razão insulina/glucagon facilita glicogenólise, gliconeogênese e mobilização de combustíveis; a adaptação depende da duração do jejum. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [5, 3, "Qual alternativa descreve corretamente síntese de testosterona?", ["LH estimula células de Leydig a produzir testosterona a partir de colesterol.", "5-alfa-redutase converte testosterona em DHT em tecidos-alvo.", "Aromatase converte andrógenos em estrógenos.", "Testosterona e DHT ativam receptor intracelular regulador de transcrição.", "Testosterona e estradiol inibem GnRH/LH; inibina B inibe FSH."], 0, "LH ativa receptor acoplado a Gs, elevando AMPc e facilitando a transferência de colesterol para a mitocôndria por StAR. Enzimas esteroidogênicas convertem intermediários em testosterona, que atua localmente e na circulação. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [5, 3, "Qual alternativa descreve corretamente dht?", ["Aromatase converte andrógenos em estrógenos.", "Testosterona e DHT ativam receptor intracelular regulador de transcrição.", "Testosterona e estradiol inibem GnRH/LH; inibina B inibe FSH.", "LH estimula células de Leydig a produzir testosterona a partir de colesterol.", "5-alfa-redutase converte testosterona em DHT em tecidos-alvo."], 4, "DHT se liga com alta afinidade ao receptor androgênico e participa da diferenciação de genitália externa masculina e crescimento prostático. A deficiência de 5-alfa-redutase altera virilização externa, apesar de produção de testosterona. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [5, 3, "Qual alternativa descreve corretamente aromatase?", ["Testosterona e estradiol inibem GnRH/LH; inibina B inibe FSH.", "LH estimula células de Leydig a produzir testosterona a partir de colesterol.", "5-alfa-redutase converte testosterona em DHT em tecidos-alvo.", "Aromatase converte andrógenos em estrógenos.", "Testosterona e DHT ativam receptor intracelular regulador de transcrição."], 3, "Parte da testosterona se transforma em estradiol no tecido adiposo, cérebro e outros locais. Estradiol contribui para maturação óssea e feedback do eixo masculino; não é um hormônio exclusivo da fisiologia feminina. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [5, 3, "Qual alternativa descreve corretamente receptor androgênico?", ["5-alfa-redutase converte testosterona em DHT em tecidos-alvo.", "Aromatase converte andrógenos em estrógenos.", "Testosterona e DHT ativam receptor intracelular regulador de transcrição.", "Testosterona e estradiol inibem GnRH/LH; inibina B inibe FSH.", "LH estimula células de Leydig a produzir testosterona a partir de colesterol."], 2, "Após ligação ao ligante, o receptor modifica conformação, dimeriza e interage com elementos responsivos do DNA. A resposta depende de cofatores e expressão local de enzimas, razão pela qual tecidos distintos respondem diferentemente. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [5, 3, "Qual alternativa descreve corretamente feedback masculino?", ["Testosterona e DHT ativam receptor intracelular regulador de transcrição.", "Testosterona e estradiol inibem GnRH/LH; inibina B inibe FSH.", "LH estimula células de Leydig a produzir testosterona a partir de colesterol.", "5-alfa-redutase converte testosterona em DHT em tecidos-alvo.", "Aromatase converte andrógenos em estrógenos."], 1, "O eixo hipotálamo–hipófise–testículo opera por feedback negativo. Redução primária da função testicular tende a elevar gonadotrofinas, enquanto deficiência hipotalâmica ou hipofisária pode manter LH/FSH baixos ou inadequadamente normais. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [6, 3, "Qual alternativa descreve corretamente sertoli e fsh?", ["LH estimula Leydig a produzir testosterona intratesticular.", "Espermatócito primário gera espermatócitos secundários e espermátides.", "A espermatogênese exige temperatura testicular abaixo da corporal.", "NO ativa guanilil ciclase, aumenta GMPc e relaxa músculo liso cavernoso.", "FSH estimula Sertoli, sustentando o ambiente da espermatogênese."], 4, "Células de Sertoli nutrem e organizam células germinativas, formam junções da barreira hematotesticular, produzem ABP e inibina B. O efeito do FSH integra-se à alta testosterona intratesticular produzida pelas células de Leydig. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [6, 3, "Qual alternativa descreve corretamente leydig e lh?", ["A espermatogênese exige temperatura testicular abaixo da corporal.", "NO ativa guanilil ciclase, aumenta GMPc e relaxa músculo liso cavernoso.", "FSH estimula Sertoli, sustentando o ambiente da espermatogênese.", "LH estimula Leydig a produzir testosterona intratesticular.", "Espermatócito primário gera espermatócitos secundários e espermátides."], 3, "A concentração local de testosterona necessária à espermatogênese é muito maior que a circulante. A administração exógena de testosterona pode suprimir LH e FSH e reduzir a produção de espermatozoides. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [6, 3, "Qual alternativa descreve corretamente meiose espermatogênica?", ["FSH estimula Sertoli, sustentando o ambiente da espermatogênese.", "LH estimula Leydig a produzir testosterona intratesticular.", "Espermatócito primário gera espermatócitos secundários e espermátides.", "A espermatogênese exige temperatura testicular abaixo da corporal.", "NO ativa guanilil ciclase, aumenta GMPc e relaxa músculo liso cavernoso."], 2, "A meiose I separa cromossomos homólogos; a meiose II separa cromátides-irmãs. Espermiogênese transforma espermátides haploides em células com acrossomo, flagelo e núcleo condensado, sem nova divisão celular. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [6, 3, "Qual alternativa descreve corretamente temperatura testicular?", ["Espermatócito primário gera espermatócitos secundários e espermátides.", "A espermatogênese exige temperatura testicular abaixo da corporal.", "NO ativa guanilil ciclase, aumenta GMPc e relaxa músculo liso cavernoso.", "FSH estimula Sertoli, sustentando o ambiente da espermatogênese.", "LH estimula Leydig a produzir testosterona intratesticular."], 1, "O plexo pampiniforme e o escroto participam da termorregulação. Exposição térmica persistente, criptorquidia e varicocele podem comprometer parâmetros seminais, embora causas de infertilidade sejam multifatoriais. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [6, 3, "Qual alternativa descreve corretamente ereção e gmpc?", ["NO ativa guanilil ciclase, aumenta GMPc e relaxa músculo liso cavernoso.", "FSH estimula Sertoli, sustentando o ambiente da espermatogênese.", "LH estimula Leydig a produzir testosterona intratesticular.", "Espermatócito primário gera espermatócitos secundários e espermátides.", "A espermatogênese exige temperatura testicular abaixo da corporal."], 0, "Estímulo parassimpático favorece liberação de NO, que ativa guanilil ciclase solúvel. GMPc reduz cálcio intracelular e facilita enchimento dos corpos cavernosos; PDE5 degrada GMPc e sua inibição prolonga a resposta dependente de NO. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [7, 3, "Qual alternativa descreve corretamente duas células e duas gonadotrofinas?", ["Progesterona transforma endométrio proliferativo em secretor.", "Inibina reduz seletivamente secreção hipofisária de FSH.", "Falência folicular reduz estradiol/inibina e eleva FSH.", "LH estimula teca; FSH estimula aromatase na granulosa.", "Estradiol estimula proliferação do endométrio."], 3, "Células da teca produzem andrógenos a partir de colesterol sob estímulo de LH. Andrógenos difundem para a granulosa, onde FSH induz aromatase e conversão em estradiol; a distribuição enzimática explica a cooperação folicular. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [7, 3, "Qual alternativa descreve corretamente estradiol endometrial?", ["Falência folicular reduz estradiol/inibina e eleva FSH.", "LH estimula teca; FSH estimula aromatase na granulosa.", "Estradiol estimula proliferação do endométrio.", "Progesterona transforma endométrio proliferativo em secretor.", "Inibina reduz seletivamente secreção hipofisária de FSH."], 2, "Na fase folicular, estradiol aumenta crescimento de glândulas e estroma endometrial e induz receptores de progesterona. Também torna o muco cervical mais fluido, facilitando passagem de espermatozoides. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [7, 3, "Qual alternativa descreve corretamente progesterona endometrial?", ["Estradiol estimula proliferação do endométrio.", "Progesterona transforma endométrio proliferativo em secretor.", "Inibina reduz seletivamente secreção hipofisária de FSH.", "Falência folicular reduz estradiol/inibina e eleva FSH.", "LH estimula teca; FSH estimula aromatase na granulosa."], 1, "Após ovulação, corpo lúteo secreta progesterona, que favorece diferenciação glandular, secreção e condições de receptividade endometrial. O muco cervical torna-se mais espesso e a temperatura basal tende a aumentar. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [7, 3, "Qual alternativa descreve corretamente inibina ovariana?", ["Inibina reduz seletivamente secreção hipofisária de FSH.", "Falência folicular reduz estradiol/inibina e eleva FSH.", "LH estimula teca; FSH estimula aromatase na granulosa.", "Estradiol estimula proliferação do endométrio.", "Progesterona transforma endométrio proliferativo em secretor."], 0, "Inibina B predomina em parte da fase folicular e inibina A aumenta na fase lútea. A queda da reserva folicular reduz inibina e estradiol, contribuindo para elevação de FSH na menopausa. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [7, 3, "Qual alternativa descreve corretamente menopausa?", ["LH estimula teca; FSH estimula aromatase na granulosa.", "Estradiol estimula proliferação do endométrio.", "Progesterona transforma endométrio proliferativo em secretor.", "Inibina reduz seletivamente secreção hipofisária de FSH.", "Falência folicular reduz estradiol/inibina e eleva FSH."], 4, "A redução sustentada da atividade folicular retira o feedback negativo sobre hipófise e hipotálamo. Sintomas vasomotores, alterações urogenitais e perda óssea relacionam-se à deficiência estrogênica, embora a intensidade varie entre pessoas. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [8, 3, "Qual alternativa descreve corretamente recrutamento folicular?", ["Corpo lúteo secreta progesterona após a ovulação.", "Queda de progesterona e estradiol leva à descamação da camada funcional.", "Coortes de folículos crescem; um folículo dominante costuma emergir.", "Estradiol alto sustentado desencadeia feedback positivo e pico de LH.", "Pico de LH induz ruptura folicular e liberação do ovócito secundário."], 2, "O crescimento inicial de folículos primordiais envolve fatores intraovarianos, enquanto estágios antrais dependem progressivamente de FSH. A seleção do dominante envolve maior sensibilidade a FSH e produção de estradiol, com atresia dos demais. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [8, 3, "Qual alternativa descreve corretamente pico de lh?", ["Coortes de folículos crescem; um folículo dominante costuma emergir.", "Estradiol alto sustentado desencadeia feedback positivo e pico de LH.", "Pico de LH induz ruptura folicular e liberação do ovócito secundário.", "Corpo lúteo secreta progesterona após a ovulação.", "Queda de progesterona e estradiol leva à descamação da camada funcional."], 1, "Na maior parte do ciclo, estradiol exerce feedback negativo. Próximo da ovulação, exposição suficientemente elevada e sustentada ao estradiol muda a resposta central e hipofisária, precipitando pico de LH e maturação ovocitária. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [8, 3, "Qual alternativa descreve corretamente ovulação?", ["Pico de LH induz ruptura folicular e liberação do ovócito secundário.", "Corpo lúteo secreta progesterona após a ovulação.", "Queda de progesterona e estradiol leva à descamação da camada funcional.", "Coortes de folículos crescem; um folículo dominante costuma emergir.", "Estradiol alto sustentado desencadeia feedback positivo e pico de LH."], 0, "LH promove retomada da meiose, luteinização, mudanças em prostaglandinas e enzimas proteolíticas da parede folicular. O ovócito secundário é liberado com células da corona radiata e permanece parado em metáfase II até fertilização. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [8, 3, "Qual alternativa descreve corretamente corpo lúteo?", ["Queda de progesterona e estradiol leva à descamação da camada funcional.", "Coortes de folículos crescem; um folículo dominante costuma emergir.", "Estradiol alto sustentado desencadeia feedback positivo e pico de LH.", "Pico de LH induz ruptura folicular e liberação do ovócito secundário.", "Corpo lúteo secreta progesterona após a ovulação."], 4, "A luteinização das células foliculares gera estrutura vascularizada produtora de progesterona e estradiol. Sem hCG embrionário, ocorre luteólise e queda hormonal, desencadeando alterações vasculares e inflamatórias endometriais. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [8, 3, "Qual alternativa descreve corretamente menstruação?", ["Estradiol alto sustentado desencadeia feedback positivo e pico de LH.", "Pico de LH induz ruptura folicular e liberação do ovócito secundário.", "Corpo lúteo secreta progesterona após a ovulação.", "Queda de progesterona e estradiol leva à descamação da camada funcional.", "Coortes de folículos crescem; um folículo dominante costuma emergir."], 3, "A retirada do suporte hormonal desencadeia produção de prostaglandinas, vasoconstrição das artérias espiraladas, inflamação e degradação da matriz. A camada basal permanece e permite regeneração endometrial no ciclo seguinte. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [9, 3, "Qual alternativa descreve corretamente casr e pth?", ["Hipoalbuminemia pode reduzir cálcio total sem reduzir cálcio ionizado.", "Cálcio ionizado baixo reduz ativação de CaSR e aumenta PTH.", "PTH aumenta reabsorção de cálcio e reduz reabsorção de fosfato.", "Calcitriol aumenta absorção intestinal de cálcio e fosfato.", "FGF23 aumenta fosfatúria e reduz produção renal de calcitriol."], 1, "As células principais da paratireoide monitoram cálcio extracelular pelo receptor sensor de cálcio. Hipocalcemia favorece liberação de PTH, enquanto elevação do cálcio inibe secreção por feedback. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [9, 3, "Qual alternativa descreve corretamente pth renal?", ["PTH aumenta reabsorção de cálcio e reduz reabsorção de fosfato.", "Calcitriol aumenta absorção intestinal de cálcio e fosfato.", "FGF23 aumenta fosfatúria e reduz produção renal de calcitriol.", "Hipoalbuminemia pode reduzir cálcio total sem reduzir cálcio ionizado.", "Cálcio ionizado baixo reduz ativação de CaSR e aumenta PTH."], 0, "No néfron distal, PTH favorece conservação de cálcio; no túbulo proximal, reduz cotransportadores de fosfato, aumentando fosfatúria. Também estimula 1-alfa-hidroxilase renal, elevando calcitriol. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [9, 3, "Qual alternativa descreve corretamente vitamina d ativa?", ["FGF23 aumenta fosfatúria e reduz produção renal de calcitriol.", "Hipoalbuminemia pode reduzir cálcio total sem reduzir cálcio ionizado.", "Cálcio ionizado baixo reduz ativação de CaSR e aumenta PTH.", "PTH aumenta reabsorção de cálcio e reduz reabsorção de fosfato.", "Calcitriol aumenta absorção intestinal de cálcio e fosfato."], 4, "Colecalciferol é convertido em 25-hidroxivitamina D no fígado e depois em 1,25-di-hidroxivitamina D no rim. O calcitriol atua por receptor nuclear, aumentando proteínas de transporte intestinal de minerais. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [9, 3, "Qual alternativa descreve corretamente fgf23?", ["Cálcio ionizado baixo reduz ativação de CaSR e aumenta PTH.", "PTH aumenta reabsorção de cálcio e reduz reabsorção de fosfato.", "Calcitriol aumenta absorção intestinal de cálcio e fosfato.", "FGF23 aumenta fosfatúria e reduz produção renal de calcitriol.", "Hipoalbuminemia pode reduzir cálcio total sem reduzir cálcio ionizado."], 3, "Produzido principalmente por osteócitos, FGF23 atua com participação de Klotho, reduz reabsorção tubular de fosfato e inibe 1-alfa-hidroxilase. Integra o controle de fosfato com PTH e vitamina D. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [9, 3, "Qual alternativa descreve corretamente cálcio ionizado e albumina?", ["Calcitriol aumenta absorção intestinal de cálcio e fosfato.", "FGF23 aumenta fosfatúria e reduz produção renal de calcitriol.", "Hipoalbuminemia pode reduzir cálcio total sem reduzir cálcio ionizado.", "Cálcio ionizado baixo reduz ativação de CaSR e aumenta PTH.", "PTH aumenta reabsorção de cálcio e reduz reabsorção de fosfato."], 2, "A fração ionizada é fisiologicamente ativa. Alcalose aumenta ligação do cálcio à albumina e pode reduzir o ionizado mesmo com cálcio total inalterado; em situações complexas, dosagem direta do cálcio ionizado é preferível. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [10, 3, "Qual alternativa descreve corretamente captação de iodeto?", ["NIS transporta iodeto para o tireócito na membrana basolateral.", "TPO oxida iodeto e ioda tirosinas da tireoglobulina.", "TSH estimula endocitose e proteólise da tireoglobulina iodada.", "D1 e D2 podem formar T3; D3 inativa hormônios tireoidianos.", "T3/T4 inibem TRH e TSH por feedback negativo."], 0, "O simportador sódio–iodeto utiliza o gradiente de sódio mantido por Na+/K+-ATPase. O iodeto atravessa a membrana apical em direção ao coloide, com participação da pendrina e outras vias de transporte. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [10, 3, "Qual alternativa descreve corretamente organificação?", ["TSH estimula endocitose e proteólise da tireoglobulina iodada.", "D1 e D2 podem formar T3; D3 inativa hormônios tireoidianos.", "T3/T4 inibem TRH e TSH por feedback negativo.", "Excesso agudo de iodeto pode inibir temporariamente organificação.", "TPO oxida iodeto e ioda tirosinas da tireoglobulina."], 4, "Na interface apical-coloide, a tireoperoxidase utiliza peróxido de hidrogênio para organificação, formando MIT e DIT. O acoplamento de DIT+DIT forma T4 e MIT+DIT forma T3, ainda ligados à tireoglobulina. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [10, 3, "Qual alternativa descreve corretamente liberação t3/t4?", ["T3/T4 inibem TRH e TSH por feedback negativo.", "Excesso agudo de iodeto pode inibir temporariamente organificação.", "NIS transporta iodeto para o tireócito na membrana basolateral.", "TSH estimula endocitose e proteólise da tireoglobulina iodada.", "D1 e D2 podem formar T3; D3 inativa hormônios tireoidianos."], 3, "A tireoglobulina armazenada no coloide é internalizada e degradada em lisossomos; T4 e T3 são liberados à circulação, enquanto MIT/DIT remanescentes são desiodados para reciclagem de iodeto. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [10, 3, "Qual alternativa descreve corretamente desiodases?", ["NIS transporta iodeto para o tireócito na membrana basolateral.", "TPO oxida iodeto e ioda tirosinas da tireoglobulina.", "D1 e D2 podem formar T3; D3 inativa hormônios tireoidianos.", "T3/T4 inibem TRH e TSH por feedback negativo.", "Excesso agudo de iodeto pode inibir temporariamente organificação."], 2, "T4 é o principal produto secretado pela tireoide, mas T3 possui maior atividade nos receptores. Desiodação periférica controla disponibilidade local de T3; D3 converte T4 em T3 reverso e T3 em T2. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [10, 3, "Qual alternativa descreve corretamente feedback tireoidiano?", ["TSH estimula endocitose e proteólise da tireoglobulina iodada.", "T3/T4 inibem TRH e TSH por feedback negativo.", "Excesso agudo de iodeto pode inibir temporariamente organificação.", "NIS transporta iodeto para o tireócito na membrana basolateral.", "TPO oxida iodeto e ioda tirosinas da tireoglobulina."], 1, "TRH hipotalâmico estimula TSH, que age em receptor acoplado a Gs no tireócito e favorece síntese e liberação hormonal. Na disfunção tireoidiana primária, TSH varia em direção oposta à do T4 livre, salvo condições especiais. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."], [10, 3, "Qual alternativa descreve corretamente wolff–chaikoff?", ["Excesso agudo de iodeto pode inibir temporariamente organificação.", "NIS transporta iodeto para o tireócito na membrana basolateral.", "TPO oxida iodeto e ioda tirosinas da tireoglobulina.", "TSH estimula endocitose e proteólise da tireoglobulina iodada.", "D1 e D2 podem formar T3; D3 inativa hormônios tireoidianos."], 0, "A glândula geralmente escapa do efeito após adaptação da captação de iodeto. O fenômeno não deve ser confundido com Jod–Basedow, em que exposição a iodo pode precipitar hipertireoidismo em tecido autônomo. As demais alternativas descrevem outros mecanismos do módulo e não respondem ao processo solicitado."]]);

const SLIDE_AUDIT={"0": "<section class=\"fisiolab-auditoria\"><h2>Conferência dos slides — tópicos cobrados e complementos</h2><p><b>Base:</b> slides da disciplina. As explicações abaixo ampliam os títulos, esquemas e casos dos slides com conhecimento fisiológico para facilitar o estudo.</p><h3>Síntese e armazenamento dos hormônios</h3><p>Peptídeos são sintetizados como pré-pró-hormônios no retículo endoplasmático rugoso, processados no Golgi e armazenados em vesículas; esteroides são sintetizados a partir do colesterol e difundem-se após a produção; catecolaminas ficam em grânulos, enquanto T3/T4 ficam armazenados no coloide ligados à tireoglobulina.</p><h3>Regulação de receptores</h3><p>Down-regulation é a diminuição da quantidade ou resposta dos receptores diante de estímulo persistente; up-regulation é aumento de disponibilidade ou sensibilidade. Essas mudanças modulam a resposta mesmo quando a concentração do hormônio não se altera.</p><h3>Receptores ligados a enzimas e canais</h3><p>Receptores tirosina-quinase, como o da insulina, fosforilam proteínas intracelulares. Receptores associados a JAK/STAT, como o de GH, recrutam quinases. Receptores-canal alteram rapidamente o fluxo iônico; a classificação do receptor explica a velocidade e a natureza da resposta.</p></section>", "1": "<section class=\"fisiolab-auditoria\"><h2>Conferência dos slides — tópicos cobrados e complementos</h2><p><b>Base:</b> slides da disciplina. As explicações abaixo ampliam os títulos, esquemas e casos dos slides com conhecimento fisiológico para facilitar o estudo.</p><h3>Hormônios hipofisiotróficos</h3><p>TRH estimula TSH e pode estimular prolactina; CRH estimula ACTH; GnRH pulsátil estimula LH e FSH; GHRH estimula GH; somatostatina inibe GH e TSH; dopamina inibe prolactina. A secreção pulsátil de GnRH é fundamental para a função gonadotrófica.</p><h3>Hipofisectomia e disfunção central</h3><p>Após perda da adeno-hipófise, os hormônios tróficos tendem a cair e as glândulas-alvo deixam de receber estímulo. Na insuficiência periférica primária, o hormônio trófico tende a subir por perda do feedback; na falência central, pode ficar baixo ou inadequadamente normal.</p><h3>Núcleos magnocelulares</h3><p>Os corpos celulares hipotalâmicos sintetizam ADH e ocitocina; seus axônios terminam na neuro-hipófise, que armazena e libera os hormônios, mas não os sintetiza. Essa distinção aparece nos esquemas de neurônios magnocelulares.</p></section>", "2": "<section class=\"fisiolab-auditoria\"><h2>Conferência dos slides — tópicos cobrados e complementos</h2><p><b>Base:</b> slides da disciplina. As explicações abaixo ampliam os títulos, esquemas e casos dos slides com conhecimento fisiológico para facilitar o estudo.</p><h3>Somatostatina versus somatomedina</h3><p>Somatostatina é um hormônio inibitório hipotalâmico que reduz a secreção de GH; somatomedina C é o IGF-1, produzido principalmente no fígado sob estímulo de GH e responsável por parte importante dos efeitos de crescimento.</p><h3>Estado nutricional e GH</h3><p>No jejum, GH aumenta a utilização de lipídios e poupa glicose, mas IGF-1 pode cair devido à resistência hepática ao GH. Insulina e nutrição adequada favorecem sinalização de GH e crescimento; não se deve interpretar GH elevado isoladamente como crescimento aumentado.</p><h3>Testes dinâmicos de GH</h3><p>Na suspeita de deficiência, testes de estímulo avaliam a capacidade de elevar GH; na suspeita de acromegalia, a ausência de supressão de GH após glicose é achado sugestivo, interpretado com IGF-1 e critérios laboratoriais atuais. Teste de hipoglicemia insulínica exige ambiente especializado e supervisão.</p><h3>Casos clínicos de crescimento</h3><p>Crescimento linear excessivo antes do fechamento epifisário sugere gigantismo; aumento de mandíbula, mãos, pés e partes moles em adulto sugere acromegalia. Avaliar manifestações metabólicas, alterações visuais, IGF-1 e possível adenoma hipofisário.</p></section>", "3": "<section class=\"fisiolab-auditoria\"><h2>Conferência dos slides — tópicos cobrados e complementos</h2><p><b>Base:</b> slides da disciplina. As explicações abaixo ampliam os títulos, esquemas e casos dos slides com conhecimento fisiológico para facilitar o estudo.</p><h3>Esteroidogênese e StAR</h3><p>Colesterol é transferido à mitocôndria pela proteína StAR; a CYP11A1 converte colesterol em pregnenolona. Enzimas específicas das zonas corticais determinam produção de mineralocorticoides, glicocorticoides e andrógenos. ACTH favorece a disponibilidade de colesterol e esteroidogênese.</p><h3>Cortisol e estresse</h3><p>Cortisol aumenta disponibilidade de substratos energéticos: favorece gliconeogênese hepática, mobilização de aminoácidos e lipólise, além de reduzir utilização periférica de glicose. Também modifica resposta imune e inflamatória, reduz síntese de colágeno e pode comprometer massa óssea em excesso crônico.</p><h3>Transporte e metabolismo de cortisol</h3><p>Cortisol circula predominantemente ligado à globulina ligadora de corticosteroides (CBG) e à albumina; uma fração livre é biologicamente ativa. A interconversão cortisol–cortisona depende de enzimas 11β-HSD, com papel na proteção do receptor mineralocorticoide.</p><h3>Escape da aldosterona</h3><p>Na exposição crônica à aldosterona elevada, expansão de volume e natriurese por pressão limitam a retenção progressiva de sódio, embora a perda de potássio possa persistir. Aldosterona também age em glândulas sudoríparas, salivares e cólon.</p><h3>Hiperplasia adrenal: deficiência de 21-hidroxilase</h3><p>Redução da síntese de cortisol e, nas formas perdedoras de sal, aldosterona; ACTH sobe e precursores são desviados para andrógenos. Podem ocorrer virilização, hiponatremia, hipercalemia e desidratação. O slide menciona deficiência de 21-beta-hidroxilase; a nomenclatura usual é 21-hidroxilase.</p><h3>Hiperplasia adrenal: deficiência de 11β-hidroxilase</h3><p>Redução de cortisol com aumento de ACTH e acúmulo de 11-desoxicortisol e desoxicorticosterona (DOC), que possui ação mineralocorticoide; pode haver hipertensão e hipocalemia, além de excesso de andrógenos.</p><h3>Hiperplasia adrenal: deficiência de 17α-hidroxilase</h3><p>Produção reduzida de cortisol e esteroides sexuais, com aumento relativo de precursores mineralocorticoides, hipertensão e hipocalemia; alterações do desenvolvimento sexual dependem do cariótipo e do grau da deficiência.</p><h3>Conn, Cushing e Addison</h3><p>Conn: hiperaldosteronismo primário, com renina geralmente suprimida. Cushing: hipercortisolismo. Addison: insuficiência adrenal primária, com cortisol baixo e ACTH elevado, frequentemente acompanhada de deficiência mineralocorticoide.</p></section>", "4": "<section class=\"fisiolab-auditoria\"><h2>Conferência dos slides — tópicos cobrados e complementos</h2><p><b>Base:</b> slides da disciplina. As explicações abaixo ampliam os títulos, esquemas e casos dos slides com conhecimento fisiológico para facilitar o estudo.</p><h3>Células das ilhotas</h3><p>Células beta secretam insulina; alfa, glucagon; delta, somatostatina; PP/F, polipeptídeo pancreático. Os percentuais variam por região pancreática e metodologia; o slide destaca beta em cerca de 60% e PP em 5%.</p><h3>Incretinas e secreção de insulina</h3><p>GIP e GLP-1 potencializam a secreção de insulina dependente de glicose; aminoácidos, estímulo vagal e certos hormônios também modulam a célula beta. O acoplamento ATP–KATP–Ca²⁺ é a etapa elétrica essencial.</p><h3>Insulina por tecido</h3><p>No músculo, aumenta GLUT4, captação de glicose, glicogênio e síntese proteica; no adipócito, aumenta GLUT4 e armazenamento de triglicerídeos; no fígado, aumenta glicogênese e lipogênese e reduz produção de glicose, sem depender de GLUT4 para entrada de glicose.</p><h3>Glucagon e somatostatina</h3><p>Glucagon atua principalmente no fígado por receptor Gs–AMPc–PKA, aumentando glicogenólise e gliconeogênese. Somatostatina pancreática inibe secreção de insulina e glucagon e modula absorção e motilidade gastrointestinal.</p><h3>GLUT1, GLUT2, GLUT3 e GLUT4</h3><p>GLUT4 é sensível à insulina em músculo e tecido adiposo. GLUT2 participa do transporte hepático e é muito destacado em modelos de roedores; em células beta humanas, GLUT1 e GLUT3 também são relevantes. Evite tratar GLUT2 como único sensor universal humano.</p></section>", "5": "<section class=\"fisiolab-auditoria\"><h2>Conferência dos slides — tópicos cobrados e complementos</h2><p><b>Base:</b> slides da disciplina. As explicações abaixo ampliam os títulos, esquemas e casos dos slides com conhecimento fisiológico para facilitar o estudo.</p><h3>Síntese de testosterona</h3><p>LH estimula células de Leydig a converter colesterol em esteroides por enzimas mitocondriais e do retículo. Testosterona pode ser convertida em DHT por 5α-redutase e em estradiol por aromatase.</p><h3>DHT versus testosterona</h3><p>DHT possui alta afinidade pelo receptor androgênico e é importante na diferenciação da genitália externa masculina e no desenvolvimento prostático. Testosterona participa de manutenção de ductos de Wolff, massa muscular, libido e espermatogênese.</p><h3>Mecanismo genômico dos andrógenos</h3><p>Testosterona ou DHT liga-se ao receptor androgênico intracelular; o complexo migra ao núcleo e regula transcrição gênica. As respostas de síntese proteica são mais lentas que sinalizações rápidas de membrana.</p></section>", "6": "<section class=\"fisiolab-auditoria\"><h2>Conferência dos slides — tópicos cobrados e complementos</h2><p><b>Base:</b> slides da disciplina. As explicações abaixo ampliam os títulos, esquemas e casos dos slides com conhecimento fisiológico para facilitar o estudo.</p><h3>Sertoli e Leydig</h3><p>Sertoli responde a FSH e testosterona, nutre células germinativas, forma barreira hematotesticular, produz ABP e inibina B e fagocita corpos residuais. Leydig responde a LH e sintetiza testosterona.</p><h3>Testosterona intratesticular</h3><p>A concentração intratesticular de testosterona é muito superior à plasmática e é essencial à espermatogênese; testosterona exógena pode suprimir LH e FSH e comprometer a produção espermática.</p><h3>Interpretação do caso dos slides</h3><p>No caso apresentado, FSH elevado e inibina B baixa sugerem prejuízo do compartimento seminífero/Sertoli e disfunção testicular primária da espermatogênese. Testosterona total próxima ao limite inferior e LH relativamente alto requerem interpretação conjunta e não confirmam isoladamente hipogonadismo clínico.</p><h3>Trajeto dos espermatozoides</h3><p>Túbulos seminíferos → túbulos retos → rede testicular → ductos eferentes → epidídimo → ducto deferente → ducto ejaculatório → uretra. Epidídimo participa da maturação e armazenamento.</p><h3>Glândulas acessórias e sêmen</h3><p>Vesículas seminais fornecem parte relevante do volume seminal e frutose; próstata contribui com enzimas e secreção; glândulas bulbouretrais secretam muco. Ereção envolve parassimpático/NO/GMPc; emissão e ejaculação dependem de componentes simpáticos e somáticos.</p></section>", "7": "<section class=\"fisiolab-auditoria\"><h2>Conferência dos slides — tópicos cobrados e complementos</h2><p><b>Base:</b> slides da disciplina. As explicações abaixo ampliam os títulos, esquemas e casos dos slides com conhecimento fisiológico para facilitar o estudo.</p><h3>Ações do estradiol por tecido</h3><p>Estradiol aumenta proliferação endometrial, fluidez e distensibilidade do muco cervical periovulatório, maturação do epitélio vaginal e motilidade tubária; também modula osso, SNC e expressão de receptores uterinos.</p><h3>Ações da progesterona</h3><p>Progesterona promove transformação secretora endometrial, espessa o muco cervical, reduz contratilidade uterina e aumenta temperatura basal após ovulação. Sua queda ao final da fase lútea favorece menstruação.</p><h3>Transporte e ação esteroidal</h3><p>Estradiol circula ligado a SHBG e albumina, com pequena fração livre; progesterona liga-se principalmente à albumina e outras proteínas plasmáticas. As frações exatas variam conforme método e condição fisiológica.</p><h3>Climatério e menopausa</h3><p>Esgotamento da reserva folicular reduz estradiol e inibinas, elevando FSH. Diferencie transição menopausal (ciclos irregulares) de menopausa definida retrospectivamente após 12 meses de amenorreia, na ausência de outras causas.</p></section>", "8": "<section class=\"fisiolab-auditoria\"><h2>Conferência dos slides — tópicos cobrados e complementos</h2><p><b>Base:</b> slides da disciplina. As explicações abaixo ampliam os títulos, esquemas e casos dos slides com conhecimento fisiológico para facilitar o estudo.</p><h3>Folículo primordial ao secundário</h3><p>Primordial: ovócito primário com células foliculares achatadas. Primário: granulosa cuboide e zona pelúcida em formação. Secundário pré-antral: múltiplas camadas de granulosa e diferenciação de teca; o crescimento inicial independe principalmente de gonadotrofinas.</p><h3>Folículo antral e de Graaf</h3><p>A cavidade antral surge por acúmulo de líquido. O folículo pré-ovulatório apresenta antro amplo, cúmulo oóforo, corona radiata e ovócito excêntrico. O recrutamento antral torna-se progressivamente dependente de FSH.</p><h3>Meiose e ovulação</h3><p>Ovócito primário permanece em prófase I desde a vida fetal. Próximo da ovulação, conclui meiose I, formando ovócito secundário e primeiro corpúsculo polar; o ovócito secundário para em metáfase II até fecundação.</p><h3>Curvas hormonais ao longo do ciclo</h3><p>FSH recruta folículos; estradiol sobe na fase folicular; estradiol alto sustentado provoca pico de LH; progesterona predomina na fase lútea; queda de progesterona e estradiol desencadeia menstruação. Não presuma ovulação obrigatoriamente no dia 14 em ciclos de duração variável.</p><h3>Corpo lúteo e gestação inicial</h3><p>Sem gestação, luteólise reduz progesterona. Com implantação, hCG do trofoblasto mantém corpo lúteo e secreção de progesterona até a placenta assumir progressivamente essa função.</p></section>", "9": "<section class=\"fisiolab-auditoria\"><h2>Conferência dos slides — tópicos cobrados e complementos</h2><p><b>Base:</b> slides da disciplina. As explicações abaixo ampliam os títulos, esquemas e casos dos slides com conhecimento fisiológico para facilitar o estudo.</p><h3>Reservatórios de cálcio e fósforo</h3><p>O slide apresenta aproximadamente 98,9% do cálcio nos ossos, 1% nas células e 0,1% no líquido extracelular; para fosfato, cerca de 85% nos ossos, 14–15% nas células e menos de 1% no líquido extracelular.</p><h3>Cálcio plasmático e albumina</h3><p>Cálcio circula em frações ionizada, ligada a proteínas e complexada a ânions. A fração ionizada participa diretamente da excitabilidade neuromuscular e sinalização. Alterações de pH modificam ligação à albumina.</p><h3>Vitamina D: pele, fígado e rim</h3><p>Radiação UVB permite produção cutânea de vitamina D3; o fígado gera 25(OH)D e o rim gera 1,25(OH)₂D (calcitriol). PTH estimula 1α-hidroxilase; calcitriol aumenta absorção intestinal de cálcio e fosfato.</p><h3>PTH e calcitonina</h3><p>Hipocalcemia aumenta PTH via CaSR: conserva cálcio no rim, promove fosfatúria e estimula calcitriol. Calcitonina, secretada por células C, inibe atividade osteoclástica, mas tem papel homeostático menor em adultos humanos.</p><h3>PTH e osteoclastos</h3><p>PTH atua principalmente em células da linhagem osteoblástica, que alteram sinalização RANKL/OPG e, indiretamente, modulam formação e atividade de osteoclastos; não deve ser descrito simplesmente como ligação direta do PTH ao osteoclasto.</p></section>", "10": "<section class=\"fisiolab-auditoria\"><h2>Conferência dos slides — tópicos cobrados e complementos</h2><p><b>Base:</b> slides da disciplina. As explicações abaixo ampliam os títulos, esquemas e casos dos slides com conhecimento fisiológico para facilitar o estudo.</p><h3>Sequência completa de síntese tireoidiana</h3><p>NIS capta iodeto pela face basolateral; pendrina participa da passagem apical; TPO e H₂O₂ oxidam iodeto e iodam tirosinas da tireoglobulina (MIT e DIT); acoplamento MIT+DIT forma T3 e DIT+DIT forma T4; endocitose e proteólise liberam hormônios.</p><h3>Transporte e desiodação</h3><p>T4 predomina na secreção tireoidiana, circula ligado a TBG, transtirretina e albumina. D1 e D2 geram T3 biologicamente ativo em tecidos; D3 gera metabólitos inativos, incluindo T3 reverso a partir de T4.</p><h3>Autorregulação por iodo</h3><p>Iodo elevado pode causar bloqueio agudo de organificação (Wolff–Chaikoff), com escape adaptativo em muitos indivíduos. Deficiência de iodo aumenta estímulo por TSH e pode provocar bócio.</p><h3>Efeitos sistêmicos de T3</h3><p>T3 aumenta taxa metabólica basal, expressão de Na⁺/K⁺-ATPase, termogênese e sensibilidade cardiovascular a catecolaminas; é crucial ao desenvolvimento do sistema nervoso. Excesso pode causar taquicardia, tremor, perda ponderal e aumento do trânsito intestinal.</p><h3>Caso clínico de tireotoxicose</h3><p>A paciente do slide apresenta agitação, exoftalmia e emagrecimento, quadro sugestivo de tireotoxicose; exoftalmia sugere doença de Graves, mas diagnóstico exige avaliação clínica e laboratorial (TSH, T4 livre e, quando indicado, TRAb).</p></section>"};

CARDS.push(...[[0, "Explique síntese e armazenamento dos hormônios.", "Peptídeos são sintetizados como pré-pró-hormônios no retículo endoplasmático rugoso, processados no Golgi e armazenados em vesículas; esteroides são sintetizados a partir do colesterol e difundem-se após a produção; catecolaminas ficam e...", "Peptídeos são sintetizados como pré-pró-hormônios no retículo endoplasmático rugoso, processados no Golgi e armazenados em vesículas; esteroides são sintetizados a partir do colesterol e difundem-se após a produção; catecolaminas ficam em grânulos, enquanto T3/T4 ficam armazenados no coloide ligados à tireoglobulina."], [0, "Qual mecanismo caracteriza síntese e armazenamento dos hormônios?", "Peptídeos são sintetizados como pré-pró-hormônios no retículo endoplasmático rugoso, processados no Golgi e armazenados em vesículas; esteroides são sintetizados a partir do colesterol e difundem-se após a produção; catecolaminas ficam e...", "Peptídeos são sintetizados como pré-pró-hormônios no retículo endoplasmático rugoso, processados no Golgi e armazenados em vesículas; esteroides são sintetizados a partir do colesterol e difundem-se após a produção; catecolaminas ficam em grânulos, enquanto T3/T4 ficam armazenados no coloide ligados à tireoglobulina."], [0, "Explique regulação de receptores.", "Down-regulation é a diminuição da quantidade ou resposta dos receptores diante de estímulo persistente; up-regulation é aumento de disponibilidade ou sensibilidade.", "Down-regulation é a diminuição da quantidade ou resposta dos receptores diante de estímulo persistente; up-regulation é aumento de disponibilidade ou sensibilidade. Essas mudanças modulam a resposta mesmo quando a concentração do hormônio não se altera."], [0, "Qual mecanismo caracteriza regulação de receptores?", "Down-regulation é a diminuição da quantidade ou resposta dos receptores diante de estímulo persistente; up-regulation é aumento de disponibilidade ou sensibilidade.", "Down-regulation é a diminuição da quantidade ou resposta dos receptores diante de estímulo persistente; up-regulation é aumento de disponibilidade ou sensibilidade. Essas mudanças modulam a resposta mesmo quando a concentração do hormônio não se altera."], [0, "Explique receptores ligados a enzimas e canais.", "Receptores tirosina-quinase, como o da insulina, fosforilam proteínas intracelulares.", "Receptores tirosina-quinase, como o da insulina, fosforilam proteínas intracelulares. Receptores associados a JAK/STAT, como o de GH, recrutam quinases. Receptores-canal alteram rapidamente o fluxo iônico; a classificação do receptor explica a velocidade e a natureza da resposta."], [0, "Qual mecanismo caracteriza receptores ligados a enzimas e canais?", "Receptores tirosina-quinase, como o da insulina, fosforilam proteínas intracelulares.", "Receptores tirosina-quinase, como o da insulina, fosforilam proteínas intracelulares. Receptores associados a JAK/STAT, como o de GH, recrutam quinases. Receptores-canal alteram rapidamente o fluxo iônico; a classificação do receptor explica a velocidade e a natureza da resposta."], [1, "Explique hormônios hipofisiotróficos.", "TRH estimula TSH e pode estimular prolactina; CRH estimula ACTH; GnRH pulsátil estimula LH e FSH; GHRH estimula GH; somatostatina inibe GH e TSH; dopamina inibe prolactina.", "TRH estimula TSH e pode estimular prolactina; CRH estimula ACTH; GnRH pulsátil estimula LH e FSH; GHRH estimula GH; somatostatina inibe GH e TSH; dopamina inibe prolactina. A secreção pulsátil de GnRH é fundamental para a função gonadotrófica."], [1, "Qual mecanismo caracteriza hormônios hipofisiotróficos?", "TRH estimula TSH e pode estimular prolactina; CRH estimula ACTH; GnRH pulsátil estimula LH e FSH; GHRH estimula GH; somatostatina inibe GH e TSH; dopamina inibe prolactina.", "TRH estimula TSH e pode estimular prolactina; CRH estimula ACTH; GnRH pulsátil estimula LH e FSH; GHRH estimula GH; somatostatina inibe GH e TSH; dopamina inibe prolactina. A secreção pulsátil de GnRH é fundamental para a função gonadotrófica."], [1, "Explique hipofisectomia e disfunção central.", "Após perda da adeno-hipófise, os hormônios tróficos tendem a cair e as glândulas-alvo deixam de receber estímulo.", "Após perda da adeno-hipófise, os hormônios tróficos tendem a cair e as glândulas-alvo deixam de receber estímulo. Na insuficiência periférica primária, o hormônio trófico tende a subir por perda do feedback; na falência central, pode ficar baixo ou inadequadamente normal."], [1, "Qual mecanismo caracteriza hipofisectomia e disfunção central?", "Após perda da adeno-hipófise, os hormônios tróficos tendem a cair e as glândulas-alvo deixam de receber estímulo.", "Após perda da adeno-hipófise, os hormônios tróficos tendem a cair e as glândulas-alvo deixam de receber estímulo. Na insuficiência periférica primária, o hormônio trófico tende a subir por perda do feedback; na falência central, pode ficar baixo ou inadequadamente normal."], [1, "Explique núcleos magnocelulares.", "Os corpos celulares hipotalâmicos sintetizam ADH e ocitocina; seus axônios terminam na neuro-hipófise, que armazena e libera os hormônios, mas não os sintetiza.", "Os corpos celulares hipotalâmicos sintetizam ADH e ocitocina; seus axônios terminam na neuro-hipófise, que armazena e libera os hormônios, mas não os sintetiza. Essa distinção aparece nos esquemas de neurônios magnocelulares."], [1, "Qual mecanismo caracteriza núcleos magnocelulares?", "Os corpos celulares hipotalâmicos sintetizam ADH e ocitocina; seus axônios terminam na neuro-hipófise, que armazena e libera os hormônios, mas não os sintetiza.", "Os corpos celulares hipotalâmicos sintetizam ADH e ocitocina; seus axônios terminam na neuro-hipófise, que armazena e libera os hormônios, mas não os sintetiza. Essa distinção aparece nos esquemas de neurônios magnocelulares."], [2, "Explique somatostatina versus somatomedina.", "Somatostatina é um hormônio inibitório hipotalâmico que reduz a secreção de GH; somatomedina C é o IGF-1, produzido principalmente no fígado sob estímulo de GH e responsável por parte importante dos efeitos de crescimento.", "Somatostatina é um hormônio inibitório hipotalâmico que reduz a secreção de GH; somatomedina C é o IGF-1, produzido principalmente no fígado sob estímulo de GH e responsável por parte importante dos efeitos de crescimento."], [2, "Qual mecanismo caracteriza somatostatina versus somatomedina?", "Somatostatina é um hormônio inibitório hipotalâmico que reduz a secreção de GH; somatomedina C é o IGF-1, produzido principalmente no fígado sob estímulo de GH e responsável por parte importante dos efeitos de crescimento.", "Somatostatina é um hormônio inibitório hipotalâmico que reduz a secreção de GH; somatomedina C é o IGF-1, produzido principalmente no fígado sob estímulo de GH e responsável por parte importante dos efeitos de crescimento."], [2, "Explique estado nutricional e gh.", "No jejum, GH aumenta a utilização de lipídios e poupa glicose, mas IGF-1 pode cair devido à resistência hepática ao GH.", "No jejum, GH aumenta a utilização de lipídios e poupa glicose, mas IGF-1 pode cair devido à resistência hepática ao GH. Insulina e nutrição adequada favorecem sinalização de GH e crescimento; não se deve interpretar GH elevado isoladamente como crescimento aumentado."], [2, "Qual mecanismo caracteriza estado nutricional e gh?", "No jejum, GH aumenta a utilização de lipídios e poupa glicose, mas IGF-1 pode cair devido à resistência hepática ao GH.", "No jejum, GH aumenta a utilização de lipídios e poupa glicose, mas IGF-1 pode cair devido à resistência hepática ao GH. Insulina e nutrição adequada favorecem sinalização de GH e crescimento; não se deve interpretar GH elevado isoladamente como crescimento aumentado."], [2, "Explique testes dinâmicos de gh.", "Na suspeita de deficiência, testes de estímulo avaliam a capacidade de elevar GH; na suspeita de acromegalia, a ausência de supressão de GH após glicose é achado sugestivo, interpretado A1 converte colesterol em pregnenolona.", "Colesterol é transferido à mitocôndria pela proteína StAR; a CYP11A1 converte colesterol em pregnenolona. Enzimas específicas das zonas corticais determinam produção de mineralocorticoides, glicocorticoides e andrógenos. ACTH favorece a disponibilidade de colesterol e esteroidogênese."], [3, "Qual mecanismo caracteriza esteroidogênese e star?", "Colesterol é transferido à mitocôndria pela proteína StAR; a CYP11A1 converte colesterol em pregnenolona.", "Colesterol é transferido à mitocôndria pela proteína StAR; a CYP11A1 converte colesterol em pregnenolona. Enzimas específicas das zonas corticais determinam produção de mineralocorticoides, glicocorticoides e andrógenos. ACTH favorece a disponibilidade de colesterol e esteroidogênese."], [3, "Explique cortisol e estresse.", "Cortisol aumenta disponibilidade de substratos energéticos: favorece gliconeogênese hepática, mobilização de aminoácidos e lipólise, além de reduzir utilização periférica de glicose.", "Cortisol aumenta disponibilidade de substratos energéticos: favorece gliconeogênese hepática, mobilização de aminoácidos e lipólise, além de reduzir utilização periférica de glicose. Também modifica resposta imune e inflamatória, reduz síntese de colágeno e pode comprometer massa óssea em excesso crônico."], [3, "Qual mecanismo caracteriza cortisol e estresse?", "Cortisol aumenta disponibilidade de substratos energéticos: favorece gliconeogênese hepática, mobilização de aminoácidos e lipólise, além de reduzir utilização periférica de glicose.", "Cortisol aumenta disponibilidade de substratos energéticos: favorece gliconeogênese hepática, mobilização de aminoácidos e lipólise, além de reduzir utilização periférica de glicose. Também modifica resposta imune e inflamatória, reduz síntese de colágeno e pode comprometer massa óssea em excesso crônico."], [3, "Explique transporte e metabolismo de cortisol.", "Cortisol circula predominantemente ligado à globulina ligadora de cort pós 12 meses de amenorreia, na ausência de outras causas."], [8, "Explique folículo primordial ao secundário.", "Primordial: ovócito primário com células foliculares achatadas.", "Primordial: ovócito primário com células foliculares achatadas. Primário: granulosa cuboide e zona pelúcida em formação. Secundário pré-antral: múltiplas camadas de granulosa e diferenciação de teca; o crescimento inicial independe principalmente de gonadotrofinas."], [8, "Qual mecanismo caracteriza folículo primordial ao secundário?", "Primordial: ovócito primário com células foliculares achatadas.", "Primordial: ovócito primário com células foliculares achatadas. Primário: granulosa cuboide e zona pelúcida em formação. Secundário pré-antral: múltiplas camadas de granulosa e diferenciação de teca; o crescimento inicial independe principalmente de gonadotrofinas."], [8, "Explique folículo antral e de graaf.", "A cavidade antral surge por acúmulo de líquido.", "A cavidade antral surge por acúmulo de líquido. O folículo pré-ovulatório apresenta antro amplo, cúmulo oóforo, corona radiata e ovócito excêntrico. O recrutamento antral torna-se progressivamente dependente de FSH."], [8, "Qual mecanismo caracteriza folículo antral e de graaf?", "A cavidade antral surge por acúmulo de líquido.", "A cavidade antral surge por acúmulo de líquido. O folículo pré-ovulatório apresenta antro amplo, cúmulo oóforo, corona radiata e ovócito excêntrico. O recrutamento antral torna-se progressivamente dependente de FSH."], [8, "Explique meiose e ovulação.", "Ovócito primário permanece em prófase I desde a vida fetal.", "Ovócito primário permanece em prófase I desde a vida fetal. Próximo da ovulação, conclui meiose I, formando ovócito secundário e primeiro corpúsculo polar; o ovócito secundário para em metáfase II até fecundação."], [8, "Qual mecanismo caracteriza meiose e ovulação?", "Ovócito primário permanece em prófase I desde a vida fetal.", "Ovócito primário permanece em prófase I desde a vida fetal. Próxi
