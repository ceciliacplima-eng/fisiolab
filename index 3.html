const EXT={6:{m:10,t:['Cinética da espermatogênese','Temperatura e espermograma','Infertilidade e hormônios','Ereção e ejaculação','Revisão final'],h:`<h2 id='x6_1'>8. Cinética da espermatogênese</h2><p>A espermatogênese dura cerca de 70 dias nos túbulos, com mais 10 a 14 dias de trânsito no epidídimo, e produz da ordem de 100 milhões de espermatozoides por dia. Cada espermatócito primário origina <b>4 espermatozoides</b>. A profáse da meiose I (leptotêno, zigotêno, paquitêno, diplotêno) inclui o pareamento e o <i>crossing-over</i>, que gera variabilidade genética. Na espermiogênese, o Golgi forma o <b>acrossoma</b> (hialuronidase e acrosina), o centríolo origina o flagelo, as mitocôndrias se concentram na peça intermediária e o citoplasma excedente é descartado como corpo residual. A <b>capacitação</b> ocorre no trato genital feminino e a <b>reação acrossomal</b> ao contato com a zona pelúcida.</p>${`<svg viewBox='0 0 560 90' width='100%' role='img' aria-label='Espermatogênese'>`+bxs([[10,30,88,'Espermatogônia',B,10],[118,30,88,'Espermatócito I',B,10],[226,30,88,'Espermatócito II',B,10],[334,30,88,'Espermátide',B,10],[442,30,88,'Espermatozoide',G,10]])+lns([['M98 44H118'],['M206 44H226'],['M314 44H334'],['M422 44H442']])+txs([[108,24,'mitose'],[216,24,'meiose I'],[324,24,'meiose II'],[432,24,'espermiogênese'],[54,76,'2n'],[162,76,'2n (4n DNA)'],[270,76,'n'],[378,76,'n'],[486,76,'n']])+`</svg>`}<h2 id='x6_2'>9. Temperatura e espermograma</h2><p>O escroto mantém os testículos 2 a 4 °C abaixo da temperatura corporal graças ao cremaster, ao dartos e ao <b>plexo pampiniforme</b>, que resfria o sangue arterial por troca contracorrente. Criptorquidia, <b>varicocele</b> (causa corrigível mais comum), febre, calor, tabaco, álcool, quimioterapia, radiação e anabolizantes pioram a espermatogênese. No espermograma, os limites inferiores de referência da OMS (2021) são aproximadamente: volume 1,4 mL, concentração 16 milhões/mL, motilidade total 42% e morfologia normal 4%. Termos: <b>azoospermia</b> (sem espermatozoides), oligozoospermia (concentração baixa), astenozoospermia (motilidade baixa), teratozoospermia (morfologia alterada).</p><h2 id='x6_3'>10. Infertilidade e interpretação hormonal</h2><div class='sc'><table><tr><th>Causa</th><th>FSH</th><th>LH</th><th>Testosterona</th><th>Inibina B</th><th>Exemplos</th></tr><tr><td>Pré-testicular (hipogonadotrópica)</td><td>↓</td><td>↓</td><td>↓</td><td>↓</td><td>Kallmann (anosmia), hiperprolactinemia, anabolizantes</td></tr><tr><td>Testicular primária</td><td>↑</td><td>Normal ou ↑</td><td>Normal ou ↓</td><td>↓</td><td>Orquite por caxumba, Klinefelter (47,XXY), quimioterapia</td></tr><tr><td>Obstrutiva (pós-testicular)</td><td>Normal</td><td>Normal</td><td>Normal</td><td>Normal</td><td>Vasectomia, ausência de ductos deferentes</td></tr></table></div><p>Na azoospermia com <b>FSH normal e testículos de volume normal</b>, pensa-se em obstrução; com <b>FSH alto e testículos pequenos</b>, em falha da espermatogênese. No caso do João, os próximos passos seriam repetir o espermograma, solicitar cariótipo e microdeleções do cromossomo Y e discutir biopsia testicular para busca de espermatozoides (reprodução assistida), já que a azoospermia pós-orquite é por dano do epitélio germinativo.</p><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>Hipogonadismo hipogonadotrópico tem FSH e LH <b>baixos</b>, e não altos. A infertilidade com androgênio exógeno tem testosterona sérica alta, mas LH baixo e testosterona intratesticular baixa.</div><h2 id='x6_4'>11. Ereção e ejaculação</h2><p>Em repouso, o tono simpático (noradrenalina, α1) mantém a musculatura lisa contraída e o pênis flexido. Na <b>ereção</b>, a via parassimpática (S2-S4) libera NO e acetilcolina; o relaxamento da musculatura lisa aumenta o fluxo arterial e o sangue expande os corpos cavernosos, comprimindo as vênulas contra a túnica albugínea (mecanismo veno-oclusivo). A <b>emissão</b> é simpática (T10-L2: contração do epidídimo, deferente, vesículas e próstata) e a <b>ejeção</b> é somatomotora (nervo pudendo: contração ritmada do bulboesponjoso). A detumescência ocorre pela degradação do GMPc pela PDE5 e pelo retorno do tono simpático. As causas de disfunção erétil incluem aterosclerose, diabetes (neuropatia e disfunção endotelial), hipogonadismo, fármacos e fatores psicogênicos. Inibidores de PDE5 são <b>contraindicados com nitratos</b>, pelo risco de hipotensão grave (soma de efeitos sobre o GMPc).</p><h2 id='x6_5'>12. Revisão final</h2><p><b>Dez conceitos essenciais</b></p><ol><li>Sertoli sustenta as células germinativas e forma a barreira.</li><li>Leydig produz testosterona sob LH.</li><li>FSH atua na Sertoli.</li><li>Inibina B inibe o FSH.</li><li>ABP retém a testosterona no túbulo.</li><li>Espermatogônias diferenciam-se na puberdade.</li><li>Meiose gera células haploides; espermiogênese é transformação.</li><li>O escroto mantém temperatura menor que a corporal.</li><li>NO → GMPc → ereção; PDE5 degrada o GMPc.</li><li>Emissão é simpática; ereção é parassimpática.</li></ol><p><b>Cinco relações de causa e efeito</b></p><ul><li>Dano de Sertoli → inibina B ↓ → FSH ↑.</li><li>Criptorquidia → temperatura ↑ → espermatogênese ↓.</li><li>Androgênio exógeno → LH ↓ → testosterona intratesticular ↓.</li><li>Nitrato + inibidor de PDE5 → hipotensão grave.</li><li>Obstrução → azoospermia com FSH normal.</li></ul><p><b>Cinco perguntas de revisão ativa</b></p><ol><li>Por que o FSH está alto na orquite prévia?</li><li>Como a barreira hematotesticular protege as células haploides?</li><li>Qual a diferença entre espermatogênese e espermiogênese?</li><li>Como a vasectomia afeta FSH e testosterona?</li><li>Quais etapas neurais compõem ereção, emissão e ejeção?</li></ol><div class='sc'><table><tr><th>Célula</th><th>Receptor</th><th>Produtos</th></tr><tr><td>Sertoli</td><td>FSH e testosterona</td><td>ABP, inibina B, AMH, aromatase</td></tr><tr><td>Leydig</td><td>LH</td><td>Testosterona</td></tr></table></div>`},7:{m:9,t:['Esteroides ovarianos em detalhe','Ações em profundidade','Climatério em detalhe','Revisão final'],h:`<h2 id='x7_1'>7. Esteroides ovarianos em detalhe</h2><p>Os estrogênios são o <b>estradiol (E2, o mais potente e principal no menacme)</b>, a <b>estrona (E1, predominante após a menopausa)</b> e o estriol (E3, da placenta). Os receptores nucleares ERα e ERβ são distribuídos de forma diferente (ERα predomina no útero e na mama); a progesterona age em PR-A e PR-B. Há também receptores de membrana de ação rápida. Os esteroides são conjugados no fígado e excretados na urina (a progesterona como pregnanediol). Os <b>SERMs</b> (tamoxifeno) são antagonistas na mama e agonistas parciais no endométrio e no osso; os <b>contraceptivos combinados</b> suprimem GnRH, LH e FSH por feedback e impedem a ovulação. O corpo lúteo secreta progesterona, estradiol e inibina A, sob o estímulo do LH.</p><h2 id='x7_2'>8. Ações em profundidade</h2><p>No <b>útero</b>, o estradiol induz proliferacao e receptores de ocitocina; a progesterona induz diferenciação secretora e reduz a contratilidade (manutenção da gestação). O <b>muco cervical</b> no pico estrogênico é abundante, filante e cristaliza em <i>folha de samambaia</i>; na fase lútea é espesso e impede a penetração. O colo fica aberto sob estrogênio e fechado sob progesterona. Na ovariectomia experimental, o útero atrofia e o estrogênio restaura seu peso e o endométrio. O esfregaço vaginal reflete o estado hormonal, como mostra o ciclo estral de roedores:</p><div class='sc'><table><tr><th>Fase</th><th>Citologia</th><th>Ambiente hormonal</th></tr><tr><td>Proestro</td><td>Células epiteliais nucleadas</td><td>Estradiol subindo</td></tr><tr><td>Estro</td><td>Células anucleadas cornificadas</td><td>Estradiol alto</td></tr><tr><td>Diestro I</td><td>Leucócitos e resíduos de células anucleadas</td><td>Queda hormonal</td></tr><tr><td>Diestro II</td><td>Leucócitos e células epiteliais nucleadas</td><td>Progesterona</td></tr></table></div><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>Cornificação e abertura do colo indicam estrogênio; leucócitos, muco espesso e colo fechado indicam progesterona. O tamoxifeno bloqueia o receptor na mama, mas estimula o endométrio.</div><h2 id='x7_3'>9. Climatério em detalhe</h2>${`<svg viewBox='0 0 560 150' width='100%' role='img' aria-label='Estrogênio ao longo da vida'>`+`<polyline fill='none' stroke='#3E8E5A' stroke-width='3' points='${[[0,25],[12,25],[14,60],[20,85],[30,100],[40,85],[45,60],[50,30],[55,15],[65,12]].map(([a,v])=>`${40+a*7.4},${130-v}`).join(' ')}'/><text x='${40+13*7.4}' y='20' font-size='11' fill='#C0392B' text-anchor='middle'>puberdade</text><text x='${40+51*7.4}' y='20' font-size='11' fill='#C0392B' text-anchor='middle'>menopausa</text>${[0,12,25,40,51,65].map(a=>`<text x='${40+a*7.4}' y='146' font-size='10' fill='#776B63' text-anchor='middle'>${a}</text>`).join('')}</svg>`}<div class='sm'>Esquema relativo da secreção de estrogênio por idade (anos).</div><p>Na transição menopausal, o reservatório folicular diminui, a inibina B cai primeiro e o <b>FSH sobe antes da queda do estradiol</b>; os ciclos encurtam e se tornam anovulatórios. A menopausa é definida por 12 meses de amenorreia (por volta dos 51 anos). Consequências: ondas de calor (alteração da termorregulação central), atrofia urogenital (menos glicogênio e lactobacilos, pH vaginal mais alto), perda óssea acelerada, perfil lipídico menos favorável e distúrbios do sono e do humor. A terapia hormonal alivia os sintomas; em mulheres com útero deve incluir progestagênio para evitar hiperplasia do endométrio, com riscos como tromboembolismo.</p><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br>Mulher de 50 anos com ciclos irregulares, ondas de calor e FSH elevado: transição menopausal por redução de inibina B e estradiol.</div><h2 id='x7_4'>10. Revisão final</h2><p><b>Dez conceitos essenciais</b></p><ol><li>Teca: LH → androgênios; granulosa: FSH → aromatase.</li><li>E2 é o estrogênio principal; E1 predomina após a menopausa.</li><li>Estrogênio circula 60% na SHBG.</li><li>Estrogênio induz receptores de progesterona.</li><li>Progesterona reduz a contratilidade uterina.</li><li>Estrogênio proliferativo; progesterona secretor.</li><li>Estrogênio protege o osso.</li><li>Progesterona ↑ temperatura basal.</li><li>Feedback positivo do estradiol gera o pico de LH.</li><li>Menopausa: FSH ↑ e estradiol ↓.</li></ol><p><b>Cinco relações de causa e efeito</b></p><ul><li>FSH ↑ → aromatase → estradiol ↑.</li><li>Estradiol ↑ por 48 h → pico de LH.</li><li>Inibina B ↓ → FSH ↑ (transição menopausal).</li><li>Progesterona ↑ → muco espesso e colo fechado.</li><li>Falta de estrogênio → perda óssea e atrofia urogenital.</li></ul><p><b>Cinco perguntas de revisão ativa</b></p><ol><li>Por que a granulosa não produz androgênios?</li><li>Como o tamoxifeno atua em diferentes tecidos?</li><li>O que muda no muco cervical entre as fases?</li><li>Por que os contraceptivos impedem a ovulação?</li><li>Por que o FSH sobe antes do estradiol cair na menopausa?</li></ol><div class='sc'><table><tr><th>Hormônio</th><th>Origem</th><th>Efeito-chave</th></tr><tr><td>Estradiol</td><td>Granulosa</td><td>Proliferação, osso, feedback</td></tr><tr><td>Progesterona</td><td>Corpo lúteo</td><td>Secreção, quiescência, temperatura</td></tr><tr><td>Inibina</td><td>Granulosa</td><td>Inibe FSH</td></tr></table></div>`},4:{m:10,t:['Ilhota e incretinas','Estados alimentado e jejum','Diabetes e hipoglicemia','Revisão final'],h:`<h2 id='x4_1'>6. Ilhota, paracão e incretinas</h2><p>As ilhotas ocupam 1 a 2% do pâncreas e são muito vascularizadas. O fluxo sanguíneo vai do centro (células B) para a periferia (A e D), de modo que a insulina chega às células A e <b>inibe o glucagon</b>; a somatostatina inibe ambos; o glucagon estimula a célula B. A inervação parassimpática (acetilcolina) estimula a insulina; a simpática (receptor α2) a inibe e estimula o glucagon. A insulina tem meia-vida de 5 a 6 min e cerca de metade é removida na primeira passagem hepática; o peptídeo C, mais estável, reflete a secreção.</p><p>O <b>efeito incretina</b> explica por que a glicose oral gera mais insulina que a venosa: o GLP-1 (células L) e o GIP (células K) potencializam a secreção dependente de glicose. O GLP-1 também inibe o glucagon e retarda o esvaziamento gástrico; a DPP-4 o degrada em minutos.</p>${`<svg viewBox='0 0 560 150' width='100%' role='img' aria-label='Sinalização da insulina'>`+bxs([[10,10,80,'Insulina',O],[110,10,110,'Receptor TK',B],[240,10,80,'IRS-1/2',B],[340,10,100,'PI3K → Akt',B],[460,10,90,'GLUT4 ↑',G],[240,90,100,'Ras → MAPK',B],[360,90,190,'Crescimento e genes',G],[10,90,200,'Akt → glicogênio, lipídeos',G,10]])+lns([['M90 24H110'],['M220 24H240'],['M320 24H340'],['M440 24H460'],['M280 38V90'],['M340 104H360'],['M390 38V70H110V90']])+`</svg>`}<h2 id='x4_2'>7. Estados alimentado e de jejum</h2><div class='sc'><table><tr><th>Estado</th><th>Hormônios</th><th>Vias principais</th></tr><tr><td>Alimentado</td><td>Insulina ↑, glucagon ↓</td><td>Glicogênese, lipogênese, síntese proteica, captação por GLUT4</td></tr><tr><td>Pós-absortivo (horas)</td><td>Insulina ↓, glucagon ↑</td><td>Glicogenólise hepática</td></tr><tr><td>Jejum prolongado (&gt;24 h)</td><td>Insulina muito baixa; glucagon, cortisol, GH, adrenalina ↑</td><td>Gliconeogênese (lactato, glicerol, aminoácidos), lipólise, cetogênese, proteólise muscular</td></tr></table></div><p>O cérebro não depende de insulina (GLUT1 e GLUT3) e, no jejum prolongado, passa a usar cetonas. No exercício, a contração muscular insere GLUT4 na membrana sem insulina.</p><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>O fígado, ao contrário do músculo, libera glicose (tem glicose-6-fosfatase). O GLUT2 hepático não depende de insulina; o GLUT4 depende.</div><h2 id='x4_3'>8. Diabetes e hipoglicemia</h2><p><b>DM1:</b> destruição autoimune das células B e deficiência absoluta. Sem insulina, há hiperglicemia, diurese osmótica com desidratação e lipólise sem freio, com excesso de cetonas (cetoacidose). <b>DM2:</b> resistência à insulina (obesidade visceral, ácidos graxos livres, inflamação) associada a falha progressiva da célula B; a hiperglicemia e os lípides pioram a função da célula B. As complicações crescem por glicação de proteínas e dano vascular (retina, rim, nervos, coração). Critérios usuais: glicemia de jejum ≥126 mg/dL, ≥200 mg/dL em 2 h no TOTG ou HbA1c ≥6,5%.</p><p><b>Hipoglicemia:</b> a contrarregulação começa com a queda da insulina e a seguir libera glucagon e adrenalina (sintomas adrenérgicos: tremor, sudorese, palpitação), depois cortisol e GH; abaixo disso surgem sintomas neuroglicopênicos (confusão, convulsão). A insulina e as sulfonilureias podem causar hipoglicemia; a metformina reduz a gliconeogênese; inibidores da DPP-4 e agonistas de GLP-1 atuam nas incretinas; inibidores de SGLT2 causam glicosúria.</p><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br>Hipoglicemia com insulina e peptídeo C altos: secreção endógena excessiva (sulfonilureia ou insulinoma). Insulina alta com peptídeo C baixo: insulina exógena.</div><h2 id='x4_4'>9. Revisão final</h2><p><b>Dez conceitos essenciais</b></p><ol><li>Ilhota: B (insulina), A (glucagon), D (somatostatina), PP.</li><li>A pró-insulina libera insulina e peptídeo C.</li><li>GLUT2 e glicocinase detectam a glicemia.</li><li>ATP fecha o K-ATP → despolariza → Ca²⁺ → exocitose.</li><li>Incretinas potencializam a secreção dependente de glicose.</li><li>O receptor de insulina é tirosina-quinase (IRS, PI3K/Akt, MAPK).</li><li>GLUT4 é dependente de insulina (músculo e adiposo).</li><li>A insulina é o único hormônio hipoglicemiante.</li><li>O glucagon ↑ glicogenólise e gliconeogênese.</li><li>No DM2 se perde a 1ª fase da secreção.</li></ol><p><b>Cinco relações de causa e efeito</b></p><ul><li>Glicose ↑ → ATP ↑ → K-ATP fecha → insulina ↑.</li><li>Sulfonilureia → K-ATP fecha → hipoglicemia.</li><li>Insulina ↑ → glucagon ↓ (paracão).</li><li>Insulina ausente → lipólise → cetonas.</li><li>Jejum → insulina ↓ → glicogenólise e gliconeogênese.</li></ul><p><b>Cinco perguntas de revisão ativa</b></p><ol><li>Por que o GLUT2 é bom sensor de glicose?</li><li>O que o peptídeo C diferencia?</li><li>Como a insulina ativa o GLUT4?</li><li>Por que a cetoacidose ocorre no DM1?</li><li>Como a contrarregulação responde à hipoglicemia?</li></ol><div class='sc'><table><tr><th>Hormônio</th><th>Estado</th><th>Glicemia</th><th>Fígado</th></tr><tr><td>Insulina</td><td>Alimentado</td><td>↓</td><td>Armazena</td></tr><tr><td>Glucagon</td><td>Jejum</td><td>↑</td><td>Libera</td></tr></table></div>`},5:{m:9,t:['Ciclo de vida','Receptor androgênico e 5α-redutase','Efeitos clínicos','Revisão final'],h:`<h2 id='x5_1'>7. Ciclo de vida da testosterona</h2><p>Na vida fetal (cerca de 8 a 15 semanas), a testosterona estimulada por hCG e LH, promove a virilização do feto; há novo pico após o nascimento (mini-puberdade), seguido de quiescência na infância. Na puberdade, o aumento da pulsatilidade do GnRH (modulada por kisspeptina) eleva o LH e a testosterona, que promovem os caracteres sexuais secundários: aumento testicular e peniano, pelos, barba, voz, massa muscular e estirão. A adrenarca (DHEA adrenal) contribui para os pelos pubianos. Após os 40 anos, a testosterona cai lentamente e a SHBG aumenta, de modo que a fração livre cai mais.</p>${`<svg viewBox='0 0 560 150' width='100%' role='img' aria-label='Testosterona ao longo da vida'>`+`<polyline fill='none' stroke='#C96B3C' stroke-width='3' points='40,70 136,90 232,115 328,40 424,20 520,55'/>`+['Feto','RN','Infância','Puberdade','Adulto','Idoso'].map((t,k)=>`<text x='${40+k*96}' y='142' font-size='11' fill='#776B63' text-anchor='middle'>${t}</text><circle cx='${40+k*96}' cy='${[70,90,115,40,20,55][k]}' r='4' fill='#A94E2D'/>`).join('')+`</svg>`}<div class='sm'>Esquema relativo: não representa valores absolutos.</div><h2 id='x5_2'>8. Receptor androgênico e 5α-redutase</h2><p>A testosterona e o DHT ligam-se ao mesmo receptor androgênico (gene no cromossomo X); o DHT tem maior afinidade e dissocia mais devagar, sendo mais potente. A 5α-redutase tipo 2 predomina na próstata e na pele genital; a finasterida a inibe (hiperplasia prostática e alopecia androgenética). Os efeitos dependem do tecido: músculo e osso respondem à testosterona; próstata, genitália externa e folículos pilosos respondem ao DHT.</p><div class='sc'><table><tr><th>Condição</th><th>Testosterona</th><th>DHT</th><th>Quadro</th></tr><tr><td>Deficiência de 5α-redutase 2</td><td>Normal</td><td>↓</td><td>Genitália externa pouco virilizada ao nascer; virilização puberal</td></tr><tr><td>Insensibilidade androgênica completa (46,XY)</td><td>Normal ou ↑</td><td>Normal ou ↑</td><td>Fenótipo feminino, testículos, sem útero (AMH atua)</td></tr><tr><td>Hipogonadismo adquirido</td><td>↓</td><td>↓</td><td>Libido ↓, massa muscular ↓, osteoporose</td></tr></table></div><h2 id='x5_3'>9. Efeitos clínicos</h2><p>A testosterona aumenta a síntese proteica e a massa muscular, estimula a formação óssea (diretamente e via estradiol), aumenta a eritropoese (por isso a reposição pode causar policitemia), modula a libido (cérebro, via DHT e estradiol) e reduz a gordura visceral. O DHT causa acne e alopecia androgenética. No <b>hipogonadismo masculino</b>, avalia-se a testosterona total matinal (repetida), SHBG ou fração livre, LH e FSH para separar causa primária de secundária. A reposição suprime o eixo e a espermatogênese, e deve ser evitada quando se deseja fertilidade (nesses casos usa-se estimulação com gonadotrofinas).</p><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>Reposição de testosterona causa infertilidade (suprime LH e FSH) e policitemia. Na insensibilidade androgênica completa, a testosterona é normal ou alta, mas não há útero porque o AMH atua.</div><h2 id='x5_4'>10. Revisão final</h2><p><b>Dez conceitos essenciais</b></p><ol><li>O LH estimula a Leydig.</li><li>A via passa por 3β-HSD, CYP17 e 17β-HSD III.</li><li>A testosterona é convertida em DHT (5α-redutase) e estradiol (aromatase).</li><li>O DHT é mais potente.</li><li>O receptor androgênico é intracelular.</li><li>SHBG e albumina transportam a testosterona.</li><li>O feedback ocorre no hipotálamo e na hipófise.</li><li>A testosterona intratesticular é ~100× a sérica.</li><li>SRY induz o testículo; AMH remove os ductos de Müller.</li><li>Anabolizantes suprimem a espermatogênese.</li></ol><p><b>Cinco relações de causa e efeito</b></p><ul><li>LH ↓ → testosterona ↓ → espermatogênese ↓.</li><li>5α-redutase deficiente → DHT ↓ → genitália externa pouco virilizada.</li><li>↑ SHBG → testosterona livre ↓.</li><li>Aromatase ↑ → estradiol ↑ → feedback.</li><li>Androgênio exógeno → LH ↓ → atrofia testicular.</li></ul><p><b>Cinco perguntas de revisão ativa</b></p><ol><li>Por que o DHT é mais potente que a testosterona?</li><li>Como o estradiol protege o osso masculino?</li><li>Por que anabolizantes reduzem os testículos?</li><li>Como diferenciar 5α-redutase deficiente de insensibilidade androgênica?</li><li>Quais exames separam hipogonadismo primário do secundário?</li></ol><div class='sc'><table><tr><th>Enzima</th><th>Produto</th><th>Local</th></tr><tr><td>3β-HSD</td><td>Progesterona</td><td>Leydig</td></tr><tr><td>CYP17</td><td>Androstenediona</td><td>Leydig</td></tr><tr><td>5α-redutase</td><td>DHT</td><td>Pele genital, próstata</td></tr><tr><td>Aromatase</td><td>Estradiol</td><td>Adiposo, Sertoli</td></tr></table></div>`},2:{m:9,t:['Regulação em detalhe','GH, insulina e IGF-1','Crescimento linear','Acromegalia e deficiência','Revisão final'],h:`<h2 id='x2_1'>6. Regulação em detalhe</h2><p>O GHRH é produzido no núcleo arqueado e a somatostatina em neurônios periventriculares; ambos chegam aos somatotrofos pelo sistema porta. A grelina age no receptor GHS-R (hipotálamo e hipófise). O GH tem meia-vida de ~20 min e é liberado em 6 a 8 pulsos por dia, com o maior pulso na <b>primeira fase de sono de ondas lentas</b>. O IGF-1 circula ligado a IGFBP-3, o que lhe dá meia-vida longa e concentração estável: por isso é o melhor marcador do eixo. A secreção é alta no recém-nascido, atinge pico na puberdade (esteroides sexuais amplificam o GH) e declina com a idade (somatopausa). Arginina, exercício e estresse estimulam; excesso de glicocorticoide, hipotireoidismo e hiperglicemia inibem.</p><h2 id='x2_2'>7. GH, insulina e IGF-1: integração</h2><p>Os três hormônios compartilham efeitos anabólicos, mas divergem no metabolismo da glicose. No <b>estado alimentado</b>, a insulina está alta e o GH baixo: predominam o armazenamento de glicose e lipídeos. No <b>jejum</b>, a insulina cai e o GH sobe: ocorre lipólise, o músculo passa a usar ácidos graxos e a glicose é poupada para o cérebro. O GH tem efeito insulino-símile transitório e depois efeito anti-insulina; o IGF-1 é estruturalmente parecido com a insulina e pode ativar fracamente seu receptor. A insulina também é necessária para o fígado responder ao GH: no DM1 descompensado, o GH é alto e o IGF-1, baixo. Na desnutrição ocorre o mesmo (GH ↑, IGF-1 ↓); na obesidade o GH cai, mas o IGF-1 costuma ficar normal.</p><div class='sc'><table><tr><th>Efeito</th><th>GH</th><th>Insulina</th><th>IGF-1</th></tr><tr><td>Captação de glicose (músculo, adiposo)</td><td>↓</td><td>↑</td><td>↑ (fraco)</td></tr><tr><td>Lipólise</td><td>↑</td><td>↓</td><td>—</td></tr><tr><td>Síntese proteica</td><td>↑</td><td>↑</td><td>↑</td></tr><tr><td>Crescimento ósseo</td><td>↑ (via IGF-1)</td><td>Permissiva</td><td>↑↑</td></tr><tr><td>Glicemia</td><td>↑</td><td>↓</td><td>↓ (leve)</td></tr></table></div>${'<svg viewBox=\'0 0 560 150\' width=\'100%\' role=\'img\' aria-label=\'Alimentado e jejum\'>'+bxs([[10,10,200,'ALIMENTADO',O],[10,60,200,'Insulina ↑ · GH ↓',B],[10,110,200,'Armazena glicose e lipídeos',G],[350,10,200,'JEJUM',R],[350,60,200,'Insulina ↓ · GH ↑',B],[350,110,200,'Lipólise; poupa glicose',G]])+lns([['M110 38V60'],['M110 88V110'],['M450 38V60'],['M450 88V110']])+'</svg>'}<div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>Hipoglicemia e jejum aumentam o GH; hiperglicemia reduz. GH alto causa hiperglicemia (efeito diabetogênico), e não hipoglicemia.</div><h2 id='x2_3'>8. Crescimento linear</h2><p>Nas placas de crescimento, o GH estimula pré-condrócitos a se diferenciarem e a produzirem IGF-1 local, que induz sua proliferação e a deposição de matriz. Hormônios tireoidianos, nutrição e esteroides sexuais modulam o crescimento: o estrogênio acelera o estirão e fecha as epífises (também no homem, por aromatização); o cortisol em excesso o inibe. Na investigação de baixa estatura avaliam-se velocidade de crescimento, idade óssea, IGF-1 e IGFBP-3.</p><h2 id='x2_4'>9. Acromegalia e deficiência em detalhe</h2><p><b>Acromegalia:</b> geralmente por adenoma de somatotrofo. Aumento de mãos e pés, prognatismo, macroglossia, espessamento da pele, hiperidrose, síndrome do túnel do carpo, hipertensão, cardiomiopatia, apneia do sono e diabetes (resistência à insulina). Diagnóstico: IGF-1 elevado e GH sem supressão no TOTG com 75 g, seguido de ressonância da sela. Tratamento: cirurgia transesfenoidal, análogos de somatostatina (octreotida), agonistas dopaminérgicos e pegvisomanto (antagonista do receptor de GH). <b>Deficiência na infância:</b> baixa velocidade de crescimento com proporções preservadas, face infantil e hipoglicemia (falta de contrarregulação). <b>No adulto:</b> aumento de gordura visceral, redução de massa magra e dislipidemia. No <b>teste de tolerância à insulina</b>, a hipoglicemia induzida deveria elevar o GH; pico baixo confirma a deficiência. Na <b>síndrome de Laron</b> o receptor de GH é defeituoso: tratamento com IGF-1 recombinante.</p><div class='box'>🩺 <b>CORRELAÇÃO CLÍNICA</b><br>Adulto com sapatos e anéis ficando apertados, voz grossa e hipertensão: IGF-1 elevado e GH que não suprime com glicose indicam acromegalia.</div><h2 id='x2_5'>10. Revisão final</h2><p><b>Dez conceitos essenciais</b></p><ol><li>O GH é pulsátil, com maior pico no sono profundo.</li><li>GHRH (+), somatostatina (−) e grelina (+) controlam o GH.</li><li>O receptor de GH usa JAK2/STAT.</li><li>O IGF-1 hepático medeia grande parte dos efeitos de crescimento.</li><li>O IGF-1 faz feedback negativo.</li><li>O GH é lipolítico e diabetogênico.</li><li>O GH sobe no jejum e na hipoglicemia.</li><li>A insulina é permissiva para o IGF-1 hepático.</li><li>Laron: GH alto, IGF-1 baixo.</li><li>Acromegalia: GH sem supressão no TOTG.</li></ol><p><b>Cinco relações de causa e efeito</b></p><ul><li>Jejum → insulina ↓ → GH ↑ → lipólise.</li><li>DM1 descompensado → resistência hepática ao GH → IGF-1 ↓.</li><li>Adenoma de somatotrofo → GH ↑ → IGF-1 ↑ → acromegalia.</li><li>Receptor de GH defeituoso → IGF-1 ↓ → nanismo.</li><li>Estrogênio ↑ na puberdade → aceleração e fechamento das epífises.</li></ul><p><b>Cinco perguntas de revisão ativa</b></p><ol><li>Por que dosar IGF-1 em vez de GH isolado?</li><li>Por que o GH é diabetogênico?</li><li>Como a insulina influencia o IGF-1?</li><li>Como distinguir deficiência de GH de Laron?</li><li>Por que o TOTG detecta acromegalia?</li></ol><div class='sc'><table><tr><th>Condição</th><th>GH</th><th>IGF-1</th><th>Achado-chave</th></tr><tr><td>Acromegalia</td><td>↑ (sem supressão)</td><td>↑</td><td>Extremidades</td></tr><tr><td>Deficiência</td><td>↓</td><td>↓</td><td>Baixa estatura</td></tr><tr><td>Laron</td><td>↑</td><td>↓</td><td>Receptor defeituoso</td></tr></table></div>`},3:{m:10,t:['Vascularização, ACTH e HAC','Cortisol em detalhe','SRAA e aldosterona','Catecolaminas e feocromocitoma','Revisão final'],h:`<h2 id='x3_1'>7. Vascularização, ACTH e hiperplasia adrenal congênita</h2><p>O sangue flui do córtex para a medula (drenagem centrípeta): o cortisol chega à medula em alta concentração e induz a PNMT, que forma adrenalina. O ACTH (derivado da POMC) age no receptor MC2R (Gs/AMPc): em minutos aumenta a StAR e a entrada de colesterol, e, cronicamente, mantém o tamanho da glândula e a expressão das enzimas. Por isso, glicocorticoide exógeno prolongado atrofia a fasciculada e o ACTH excessivo causa hiperplasia. Na <b>deficiência de 21-hidroxilase</b> (hiperplasia adrenal congênita) o bloqueio reduz o cortisol e a aldosterona, o ACTH sobe e o excesso de precursores é desviado para androgênios: 17-OH-progesterona elevada, virilização e, nas formas graves, perda de sal.</p><h2 id='x3_2'>8. Cortisol em detalhe</h2><p>O receptor de glicocorticoide (citoplasmático, com HSP90) induz genes como PEPCK, glicose-6-fosfatase e aminotransferases (gliconeogênese) e a anexina-1, que inibe a fosfolipase A2, reduzindo prostaglandinas e leucotrienos; também reprime NF-κB e citocinas. No hemograma: neutrofilia e linfopenia/eosinopenia. Permite a ação vasoconstritora das catecolaminas e a excreção de água livre. A avaliação inclui cortisol salivar noturno, cortisol livre urinário de 24 h e o <b>teste de supressão com dexametasona</b> (no Cushing o cortisol não suprime); a insuficiência é avaliada pelo cortisol basal e pelo teste de estímulo com ACTH sintético.</p><div class='box w'>⚠️ <b>PEGADINHA DE PROVA</b><br>Cortisol alto causa eosinopenia e linfopenia, mas neutrofilia. Corticoide exógeno suprime o ACTH e causa atrofia adrenal; a retirada brusca é perigosa.</div><h2 id='x3_3'>9. SRAA e aldosterona</h2><p>A renina é liberada pelas células justaglomerulares por queda da pressão de perfusão, queda do NaCl na mácula densa e estímulo simpático (β1). Ela converte o angiotensinogênio (fígado) em angiotensina I; a ECA gera a angiotensina II, que, pelo receptor AT1, causa vasoconstrição, estimula a aldosterona, o ADH e a sede e aumenta a reabsorção proximal de Na⁺. O aumento de pressão e de volume e a própria angiotensina II inibem a renina; o K⁺ elevado estimula diretamente a glomerulosa; o peptídeo natriurético atrial a inibe.</p>${'<svg viewBox=\'0 0 560 190\' width=\'100%\' role=\'img\' aria-label=\'SRAA\'>'+bxs([[10,10,120,'↓ PA / volume',O],[150,10,100,'Renina',B],[280,10,140,'Ang I → Ang II (ECA)',B],[230,80,110,'Vasoconstrição',G],[350,80,100,'Aldosterona',G],[460,80,90,'ADH e sede',G],[350,150,200,'Retém Na⁺ e água; perde K⁺',G]])+lns([['M130 24H150'],['M250 24H280'],['M350 38V60H285V80'],['M400 38V80'],['M400 60H505V80'],['M400 108V150'],['M350 164H200V38',R]])+txs([[200,178,'volume e PA ↑ inibem a renina']])+'</svg>'}<div class='sc'><table><tr><th></th><th>Cortisol</th><th>Aldosterona</th></tr><tr><td>Zona</td><td>Fasciculada</td><td>Glomerulosa</td></tr><tr><td>Controle</td><td>CRH–ACTH</td><td>AngII e K⁺</td></tr><tr><td>Transporte</td><td>CBG (80%)</td><td>Livre, meia-vida curta</td></tr><tr><td>Alvo principal</td><td>Fígado, músculo, imune</td><td>Células principais do néfron distal</td></tr><tr><td>Excesso</td><td>Cushing</td><td>HAS, hipocalemia</td></tr><tr><td>Deficiência</td><td>Hipoglicemia, hipotensão</td><td>Hipercalemia, perda de Na⁺</td></tr></table></div><p>A espironolactona antagoniza o receptor mineralocorticoide; IECA e BRA bloqueiam a angiotensina II e reduzem a aldosterona.</p><h2 id='x3_4'>10. Catecolaminas e feocromocitoma</h2><p>A adrenalina age em receptores α1 (vasoconstrição), β1 (↑ frequência e contratilidade), β2 (broncodilatação e vasodilatação muscular, glicogenólise) e α2 (inibe a insulina). O metabolismo por MAO e COMT gera metanefrinas e VMA na urina. O <b>feocromocitoma</b> (tumor de cromafins) causa hipertensão paroxística com cefaleia, sudorese e palpitações; o diagnóstico é por metanefrinas plasmáticas ou urinárias.</p><h2 id='x3_5'>11. Revisão final</h2><p><b>Dez conceitos essenciais</b></p><ol><li>Glomerulosa: aldosterona; fasciculada: cortisol; reticular: androgênios.</li><li>StAR é a etapa limitante.</li><li>O ACTH vem da POMC.</li><li>O cortisol é circadiano (pico ao despertar).</li><li>CBG liga 80% do cortisol; só a fração livre é ativa.</li><li>O cortisol aumenta a glicemia e causa catabolismo proteico.</li><li>A renina inicia o SRAA.</li><li>Aldosterona retém Na⁺ e excreta K⁺ e H⁺.</li><li>O escape evita o edema.</li><li>A medula depende do cortisol (PNMT).</li></ol><p><b>Cinco relações de causa e efeito</b></p><ul><li>Hipovolemia → renina ↑ → AngII ↑ → aldosterona ↑.</li><li>K⁺ ↑ → aldosterona ↑ → K⁺ ↓.</li><li>Corticoide exógeno → ACTH ↓ → atrofia adrenal.</li><li>Deficiência de 21-hidroxilase → cortisol ↓ → ACTH ↑ → androgênios ↑.</li><li>Falha adrenal primária → ACTH ↑ → hiperpigmentação.</li></ul><p><b>Cinco perguntas de revisão ativa</b></p><ol><li>Por que o Addison causa hipercalemia e a insuficiência secundária não?</li><li>Como o teste de supressão com dexametasona diferencia Cushing?</li><li>Por que não há edema no hiperaldosteronismo?</li><li>Qual a função do cortisol na síntese de adrenalina?</li><li>Quais enzimas diferenciam as zonas do córtex?</li></ol><div class='sc'><table><tr><th>Eixo</th><th>Estímulo</th><th>Produto</th><th>Falha</th></tr><tr><td>CRH–ACTH–cortisol</td><td>Estresse, ritmo</td><td>Cortisol</td><td>Cushing / Addison</td></tr><tr><td>SRAA</td><td>Hipovolemia, K⁺</td><td>Aldosterona</td><td>Hiperaldosteronismo / hipoaldosteronismo</td></tr><tr><td>Simpático–medula</td><td>Estresse agudo</td><td>Adrenalina</td><td>Feocromocitoma</td></tr></table></div>`}};

APX[10]={t:['Anatomia e histologia','Síntese de T3 e T4','Transporte e conversão periférica','Mecanismo de ação','Eixo TRH–TSH–tireoide','Autorregulação pelo iodo','Efeitos fisiológicos','Caso clínico dos slides','Revisão ativa','Minhas anotações'],mins:35,
f:()=>`<svg viewBox='0 0 560 205' width='100%' role='img' aria-label='Etapas da síntese e regulação dos hormônios tireoidianos'>${bxs([[10,12,115,'Hipotálamo: TRH',O],[165,12,115,'Hipófise: TSH',B],[320,12,185,'Folículo tireoidiano',G],[10,90,120,'Iodeto: NIS',O],[160,90,135,'Pendrina e TPO',B],[325,90,180,'MIT/DIT → T3/T4',G],[330,160,175,'T3 → receptor nuclear',G]])}${lns([['M125 26H165'],['M280 26H320'],['M130 104H160'],['M295 104H325'],['M420 118V160'],['M505 172H540V5H225V12',R]])}${txs([[280,195,'T3/T4 inibem TRH e TSH por feedback negativo']])}</svg>`,
h:`<div class='box b'><b>Roteiro de cobertura:</b> material organizado a partir das 13 páginas do arquivo “Glândula tireoide 2024”. Os mecanismos são apresentados em sequência para estudo; o caso clínico é discutido separadamente. As figuras originais dos slides continuam sendo uma referência visual útil.</div>
<h2 id='u10_1'>1. Anatomia e histologia (slides 1–2)</h2><p>A <b>tireoide</b> localiza-se anteriormente à traqueia. Sua unidade funcional é o <b>folículo tireoidiano</b>, revestido por células foliculares que circundam o <b>coloide</b>, rico em tireoglobulina. As células foliculares sintetizam T4 e T3. As células parafoliculares, ou <b>células C</b>, secretam calcitonina, que pertence ao controle do metabolismo do cálcio e não à síntese de T3/T4.</p><div class='box w'><b>Pegadinha:</b> o armazenamento extracelular do precursor hormonal no coloide é uma característica especial da tireoide.</div>
<h2 id='u10_2'>2. Síntese e secreção de T3/T4 (slides 3–4)</h2><p><b>Etapa 1 — Captação de iodeto:</b> na membrana basolateral, o cotransportador <b>NIS</b> transporta iodeto do sangue para a célula folicular, acoplado ao sódio. O TSH estimula essa etapa. <b>Etapa 2 — Transporte apical:</b> o iodeto alcança o lúmen folicular por transportadores como a <b>pendrina</b>. <b>Etapa 3 — Oxidação e organificação:</b> a <b>tireoperoxidase (TPO)</b>, com peróxido de hidrogênio, oxida o iodeto e promove a iodação de resíduos de tirosina na tireoglobulina, formando <b>MIT</b> (monoiodotirosina) e <b>DIT</b> (diiodotirosina). <b>Etapa 4 — Acoplamento:</b> DIT + DIT forma <b>T4</b>; MIT + DIT forma <b>T3</b>. <b>Etapa 5 — Liberação:</b> a tireoglobulina iodada é endocitada, sofre proteólise lisossomal e libera T3/T4 ao sangue; MIT/DIT remanescentes são desiodadas para reciclagem do iodo.</p><div class='sc'><table><tr><th>Estrutura</th><th>Função</th><th>O que lembrar</th></tr><tr><td>NIS</td><td>Entrada basolateral de iodeto</td><td>Estímulo por TSH</td></tr><tr><td>Pendrina</td><td>Passagem apical do iodeto</td><td>Direção do coloide</td></tr><tr><td>TPO</td><td>Oxidação, organificação e acoplamento</td><td>MIT, DIT, T3 e T4</td></tr><tr><td>Tireoglobulina</td><td>Arcabouço e estoque no coloide</td><td>Proteólise libera hormônios</td></tr></table></div><p>O slide 4 apresenta a secreção predominantemente de <b>T4 (aproximadamente 90%)</b> e menor proporção de <b>T3 (aproximadamente 10%)</b>, com pequena fração de T3 reverso. Grande parte do T3 biologicamente ativo resulta da conversão periférica de T4.</p>
<h2 id='u10_3'>3. Transporte e conversão periférica (slides 5–6)</h2><p>No plasma, T3 e T4 circulam majoritariamente ligados a <b>TBG</b> (globulina ligadora de tiroxina), <b>transtirretina</b> e <b>albumina</b>. A pequena fração livre é a que exerce ação nos tecidos e participa do feedback. O T4 funciona como importante pró-hormônio, convertido em T3 ou em metabólitos inativos conforme o tecido.</p><p><b>Desiodase tipo I (D1):</b> destacada nos slides em tireoide, fígado, rins e músculo esquelético; participa da conversão periférica. <b>Tipo II (D2):</b> destacada no sistema nervoso central e hipófise; contribui para o T3 intracelular. <b>Tipo III (D3):</b> destacada em tireoide, pele e sistema nervoso central; favorece a inativação hormonal, incluindo formação de T3 reverso.</p><div class='box'><b>Raciocínio:</b> T4 total pode variar quando muda a concentração de proteínas transportadoras; por isso é necessário distinguir hormônio <b>total</b> de <b>livre</b>.</div>
<h2 id='u10_4'>4. Mecanismo de ação (slide 6)</h2><p>O T3 exerce seus principais efeitos pela ligação a <b>receptores nucleares</b>, modulando a transcrição de genes e a síntese de proteínas. O T4 pode ser convertido em T3 pela desiodação. A resposta gênica explica por que muitos efeitos metabólicos são graduais e persistentes, diferentemente da ação imediata de alguns hormônios peptídicos.</p>
<h2 id='u10_5'>5. Regulação por TRH e TSH (slides 7–8)</h2><p><b>Hipotálamo (TRH) → adeno-hipófise (TSH) → tireoide (T4 e T3).</b> T3/T4 exercem <b>feedback negativo</b> sobre hipófise e hipotálamo. O slide 7 apresenta o <b>frio</b> como estímulo ao eixo e agitação/ansiedade como fatores associados à sua redução no esquema didático.</p><p>O <b>TSH</b> aumenta a captação de iodeto, a iodação de tirosinas, a proteólise da tireoglobulina armazenada, a síntese de proteínas e a atividade secretória. Seu estímulo crônico também aumenta o <b>tamanho</b> e o <b>número</b> de células foliculares, favorecendo crescimento glandular.</p><div class='box w'><b>Interpretação laboratorial:</b> T4 livre elevado com TSH muito baixo aponta para tireotoxicose com supressão do eixo. Em falência primária da tireoide, T4 tende a cair e TSH a subir.</div>
<h2 id='u10_6'>6. Autorregulação pelo iodo (slides 9–10)</h2><p>Quando a concentração intratireoidiana de iodeto aumenta muito, ocorre uma <b>inibição aguda da organificação e síntese hormonal</b>, conhecida como <b>efeito Wolff–Chaikoff</b>. Os slides relacionam o fenômeno à redução de atividades necessárias à síntese, incluindo NADPH-oxidase, NIS e TPO. Na <b>deficiência de iodo</b>, o material destaca o aumento da captação pelas células foliculares. Em fisiologia, a adaptação ao excesso de iodo pode permitir escape do bloqueio agudo; esse detalhe é complemento explicativo, não uma etapa descrita nos esquemas fornecidos.</p>
<h2 id='u10_7'>7. Efeitos fisiológicos (slides 11–12)</h2><p><b>Cardiovascular:</b> aumento da frequência e da força de contração cardíaca. <b>Sistema nervoso:</b> participação essencial no desenvolvimento e modulação da excitabilidade. <b>Trato gastrointestinal:</b> aumento da motilidade. <b>Músculos:</b> tremor quando há excesso hormonal. <b>Metabolismo:</b> aumento da atividade mitocondrial, da Na⁺/K⁺-ATPase, da taxa metabólica basal e da utilização de carboidratos, lipídios e proteínas.</p><div class='sc'><table><tr><th>Excesso hormonal</th><th>Justificativa fisiológica</th></tr><tr><td>Taquicardia e palpitações</td><td>Maior estímulo cardíaco e sensibilidade adrenérgica</td></tr><tr><td>Emagrecimento</td><td>Aumento do gasto energético basal</td></tr><tr><td>Tremor e agitação</td><td>Maior excitabilidade neuromuscular</td></tr><tr><td>Maior motilidade intestinal</td><td>Estímulo funcional do trato digestório</td></tr></table></div>
<h2 id='u10_8'>8. Caso clínico da professora (slide 13)</h2><p>Mulher, 39 anos, com agitação psicomotora, exoftalmia, perda ponderal, palpitações, taquicardia, tremor, tireoide difusamente aumentada e proptose bilateral. Exames apresentados: <b>TSH 0,008 mUI/L</b> (referência 0,47–4,54) e <b>T4 livre 4,51 ng/L</b> (referência 0,71–1,86). O slide informa diagnóstico de <b>tireotoxicose</b> e tratamento com metimazol.</p><p><b>Interpretação:</b> T4 livre acima do intervalo e TSH suprimido são compatíveis com <b>hipertireoidismo primário</b>. O quadro de bócio difuso e orbitopatia sugere <b>doença de Graves</b>, embora o slide não forneça dosagem de TRAb para confirmação etiológica. O metimazol reduz a síntese hormonal por inibição da TPO.</p><div class='box b'><b>Pergunta típica:</b> Por que o TSH está baixo? Porque o excesso de hormônio tireoidiano promove feedback negativo sobre a hipófise.</div>
<h2 id='u10_9'>9. Revisão ativa</h2><ol><li>Explique NIS → pendrina → TPO → MIT/DIT → T3/T4 → proteólise.</li><li>Qual a diferença entre T3, T4 e T3 reverso?</li><li>Quais proteínas transportam os hormônios no plasma?</li><li>Como D1, D2 e D3 modificam a disponibilidade hormonal?</li><li>Desenhe o feedback TRH–TSH–T3/T4.</li><li>Quais ações celulares o TSH estimula?</li><li>Defina o efeito Wolff–Chaikoff.</li><li>Relacione excesso de T3/T4 a taquicardia, tremor e emagrecimento.</li><li>Interprete TSH 0,008 e T4 livre 4,51 no caso clínico.</li></ol><div class='box k'><b>Para memorizar:</b> NIS capta iodo · TPO organiza a síntese · DIT+DIT = T4 · MIT+DIT = T3 · T3 atua no núcleo · T3/T4 inibem TSH · excesso de iodo pode inibir agudamente a síntese.</div>`};

EXT[8]=EXT[8]||{m:0,t:[],h:''};
EXT[8].m+=12;
EXT[8].t.push('Morfologia folicular dos slides','Crescimento folicular e curvas hormonais');
EXT[8].h+=`<h2 id='x8_${EXT[8].t.length-1}'>Foliculogênese: morfologia exigida nos slides 2–4</h2><p><b>Primordial:</b> oócito envolvido por uma camada de células foliculares achatadas; crescimento inicial independente de gonadotrofinas. <b>Primário:</b> células da granulosa cúbicas, com zona pelúcida em formação. <b>Secundário/pré-antral:</b> múltiplas camadas de granulosa e diferenciação da teca interna. <b>Terciário/antral:</b> aparece o antro preenchido por líquido folicular e diferencia-se a teca externa. <b>Pré-ovulatório/de Graaf:</b> antro volumoso, oócito excêntrico ligado ao cúmulo oóforo (disco prolígero), com corona radiata e zona pelúcida.</p><p>O esquema da página 4 acompanha o desenvolvimento em <b>mais de um ciclo</b>, distinguindo fase de crescimento tônico dependente de FSH e fase final rápida com seleção, dominância, maturação e ovulação. Não confunda o desenvolvimento de um folículo desde o primordial com um único ciclo menstrual de aproximadamente um mês.</p><h2 id='x8_${EXT[8].t.length}'>Curvas hormonais e corpo lúteo (slides 5–9)</h2><p>No início da fase folicular, FSH favorece o recrutamento e o crescimento. O folículo dominante produz estradiol; quando o estradiol se mantém elevado, ocorre <b>feedback positivo</b> e <b>pico de LH</b>, que desencadeia a ovulação. Depois, o folículo roto sofre luteinização e forma o <b>corpo lúteo</b>, secretor principalmente de progesterona. Sem manutenção pela hCG, o corpo lúteo regride e forma o <b>corpo albicans</b>. A queda de progesterona e estradiol contribui para a menstruação. Nas figuras de regulação, LH estimula a teca, enquanto FSH atua na granulosa, incluindo indução de aromatase, síntese de inibina e aquisição de receptores de LH.</p>`;
EXT[9]=EXT[9]||{m:0,t:[],h:''};EXT[9].m+=10;EXT[9].t.push('Gráficos e percentuais dos slides','Integração do cálcio e fosfato');
EXT[9].h+=`<h2 id='x9_${EXT[9].t.length-1}'>Percentuais e gráficos dos slides (páginas 3–4, 13–14 e 17–20)</h2><p><b>Distribuição:</b> cálcio 98,9% no osso, 1% nas células e 0,1% no líquido extracelular; fosfato 85% no osso, 14–15% intracelular e menos de 1% extracelular. No plasma, o slide apresenta aproximadamente <b>50% de cálcio iônico</b>, <b>41% ligado a proteínas</b> e <b>9% complexado a ânions</b>. O PTH aumenta quando o cálcio iônico cai; o calcitriol é regulado por cálcio, PTH e metabolismo renal. No gráfico de resposta ao PTH, <b>cálcio plasmático sobe e fosfato cai</b>, pois o hormônio favorece a retenção renal de cálcio e a perda de fosfato.</p><h2 id='x9_${EXT[9].t.length}'>Integração fisiológica e mecanismos (slides 9–12, 19–22)</h2><p>A vitamina D é produzida na pele ou obtida da dieta, sofre <b>25-hidroxilação hepática</b> e <b>1α-hidroxilação nos túbulos proximais renais</b> para formar calcitriol. O calcitriol aumenta a absorção intestinal de cálcio por proteínas transportadoras, incluindo calbindina. O PTH ativa vias de sinalização com <b>AMPc e quinases</b>, aumenta a reabsorção renal de cálcio e reduz a de fosfato, além de estimular a produção renal de calcitriol. A calcitonina, secretada por células C da tireoide, reduz a atividade dos osteoclastos. A resposta integrada à queda de cálcio envolve <b>paratireoide → PTH → osso/rim → calcitriol → intestino</b>.</p>`;
EXT[6]=EXT[6]||{m:0,t:[],h:''};EXT[6].m+=7;EXT[6].t.push('Diferenciação sexual e composição do sêmen');
EXT[6].h+=`<h2 id='x6_${EXT[6].t.length}'>Diferenciação sexual e sêmen (slides 5–6 e 13–16)</h2><p>No embrião com <b>SRY</b>, a diferenciação testicular permite produção de testosterona pelas células de Leydig e hormônio antimülleriano pelas células de Sertoli. A testosterona sustenta estruturas derivadas dos ductos de Wolff, o DHT participa da diferenciação da genitália externa masculina e o AMH promove regressão dos ductos de Müller. Nos esquemas de diferenciação feminina, a ausência de SRY, AMH e testosterona permite diferenciação ovariana, persistência dos ductos de Müller e regressão dos ductos de Wolff.</p><p>O trajeto é túbulos seminíferos → rede testicular → ductos eferentes → epidídimo → ducto deferente → ducto ejaculatório → uretra. O <b>sêmen</b> reúne espermatozoides e secreções das glândulas acessórias. As vesículas seminais contribuem com frutose e prostaglandinas; a próstata fornece componentes como citrato e enzimas; as glândulas bulbouretrais contribuem com muco lubrificante. A ereção depende da via parassimpática e do NO/GMPc; a ejaculação envolve mecanismos simpáticos e somáticos.</p>`;
