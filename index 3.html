const ADDITIONAL_SECTIONS={"0": "<section class=\"fisiolab-ampliacao\"><h2>Complemento aprofundado — mecanismos e integração</h2><p><b>Como estudar:</b> para cada processo abaixo, identifique estímulo, célula-alvo, receptor, via de sinalização, efeito e feedback. Esta seção complementa a explicação anterior; não substitui os esquemas originais da aula.</p><h3>Sinalização Gs</h3><p>O ligante modifica a conformação do receptor de sete hélices transmembrana; Gαs troca GDP por GTP, ativa a adenilil ciclase e amplia o sinal por AMPc. A PKA fosforila proteínas e pode alterar a transcrição por CREB. Fosfodiesterases degradam AMPc e a hidrólise de GTP encerra o sinal.</p><div class=\"box k\"><b>Conceito-chave:</b> Gs ativa adenilil ciclase, eleva AMPc e ativa PKA.</div><h3>Sinalização Gq</h3><p>IP3 se liga a receptores do retículo endoplasmático e mobiliza cálcio para o citosol; DAG, com cálcio, favorece ativação de PKC. O aumento de cálcio ativa calmodulina e quinases dependentes de cálcio. Esses mediadores integram secreção, contração e respostas metabólicas.</p><div class=\"box k\"><b>Conceito-chave:</b> Gq ativa PLC, que gera IP3 e DAG a partir de PIP2.</div><h3>Receptor intracelular</h3><p>A fração livre do hormônio entra na célula e se liga a proteínas receptoras citoplasmáticas ou nucleares. O complexo reconhece sequências reguladoras de DNA, recruta cofatores e modifica síntese de proteínas. O início tende a ser mais lento, embora também existam ações rápidas não genômicas.</p><div class=\"box k\"><b>Conceito-chave:</b> Esteroides e hormônios tireoidianos regulam transcrição por receptores intracelulares.</div><h3>Transporte hormonal</h3><p>Albumina e globulinas específicas formam um reservatório circulante, retardam a depuração e amortecem oscilações da concentração livre. Alterações de proteínas transportadoras podem modificar a concentração total sem mudar a fração biologicamente ativa.</p><div class=\"box k\"><b>Conceito-chave:</b> Apenas a fração livre do hormônio ligado a proteínas está prontamente disponível.</div><h3>Feedback negativo</h3><p>A concentração de hormônio periférico modula hipotálamo e hipófise, limitando a secreção trófica. A perda de função de glândula periférica pode elevar hormônio trófico, enquanto uma lesão hipofisária pode causar ambos baixos ou inadequadamente normais.</p><div class=\"box k\"><b>Conceito-chave:</b> A resposta final reduz a atividade de etapas anteriores do eixo.</div><h3>Quadro comparativo de mecanismos</h3><div class=\"sc\"><table><tr><th>Mecanismo</th><th>Resultado fisiológico</th></tr><tr><td><b>Sinalização Gs</b></td><td>Gs ativa adenilil ciclase, eleva AMPc e ativa PKA.</td></tr><tr><td><b>Sinalização Gq</b></td><td>Gq ativa PLC, que gera IP3 e DAG a partir de PIP2.</td></tr><tr><td><b>Receptor intracelular</b></td><td>Esteroides e hormônios tireoidianos regulam transcrição por receptores intracelulares.</td></tr><tr><td><b>Transporte hormonal</b></td><td>Apenas a fração livre do hormônio ligado a proteínas está prontamente disponível.</td></tr><tr><td><b>Feedback negativo</b></td><td>A resposta final reduz a atividade de etapas anteriores do eixo.</td></tr></table></div><div class=\"box w\"><b>Questão integradora:</b> explique como a alteração do estímulo inicial modifica o mecanismo e como o feedback tende a responder. Identifique o ponto de falha em uma disfunção primária versus central, quando aplicável.</div></section>", "1": "<section class=\"fisiolab-ampliacao\"><h2>Complemento aprofundado — mecanismos e integração</h2><p><b>Como estudar:</b> para cada processo abaixo, identifique estímulo, célula-alvo, receptor, via de sinalização, efeito e feedback. Esta seção complementa a explicação anterior; não substitui os esquemas originais da aula.</p><h3>Sistema porta</h3><p>Neurônios parvocelulares liberam fatores na eminência mediana. O sangue do plexo capilar primário segue por veias porta até o plexo secundário da adeno-hipófise, permitindo concentrações locais elevadas sem grande diluição sistêmica.</p><div class=\"box k\"><b>Conceito-chave:</b> Hormônios hipotalâmicos alcançam a adeno-hipófise pelo sistema porta.</div><h3>Neuro-hipófise</h3><p>Neurônios magnocelulares dos núcleos supraóptico e paraventricular sintetizam precursores hormonais; vesículas percorrem axônios até a hipófise posterior. Potenciais de ação induzem entrada de cálcio e exocitose nos terminais.</p><div class=\"box k\"><b>Conceito-chave:</b> ADH e ocitocina são sintetizados no hipotálamo e liberados na neuro-hipófise.</div><h3>ADH renal</h3><p>A elevação da osmolaridade estimula osmorreceptores e a secreção de vasopressina. A via V2–Gs–AMPc–PKA promove inserção de AQP2 na membrana apical, elevando reabsorção de água. Hipovolemia intensa também estimula ADH mesmo com osmolaridade baixa.</p><div class=\"box k\"><b>Conceito-chave:</b> ADH ativa receptores V2 e aumenta aquaporina-2 no ducto coletor.</div><h3>Prolactina</h3><p>A interrupção da haste hipofisária reduz o aporte de dopamina e pode elevar prolactina. TRH pode estimulá-la, e a sucção reduz a inibição dopaminérgica; prolactina favorece produção de leite, enquanto ocitocina promove ejeção.</p><div class=\"box k\"><b>Conceito-chave:</b> Dopamina hipotalâmica inibe tonicamente a secreção de prolactina.</div><h3>Lesão primária</h3><p>No hipotireoidismo primário, T4 livre baixo retira o feedback negativo e eleva TSH. Na insuficiência hipofisária, TSH pode estar baixo ou inapropriadamente normal para T4 livre reduzido. Interpretar sempre o par hormonal e o contexto clínico.</p><div class=\"box k\"><b>Conceito-chave:</b> Falência glandular primária tende a elevar o hormônio trófico correspondente.</div><h3>Quadro comparativo de mecanismos</h3><div class=\"sc\"><table><tr><th>Mecanismo</th><th>Resultado fisiológico</th></tr><tr><td><b>Sistema porta</b></td><td>Hormônios hipotalâmicos alcançam a adeno-hipófise pelo sistema porta.</td></tr><tr><td><b>Neuro-hipófise</b></td><td>ADH e ocitocina são sintetizados no hipotálamo e liberados na neuro-hipófise.</td></tr><tr><td><b>ADH renal</b></td><td>ADH ativa receptores V2 e aumenta aquaporina-2 no ducto coletor.</td></tr><tr><td><b>Prolactina</b></td><td>Dopamina hipotalâmica inibe tonicamente a secreção de prolactina.</td></tr><tr><td><b>Lesão primária</b></td><td>Falência glandular primária tende a elevar o hormônio trófico correspondente.</td></tr></table></div><div class=\"box w\"><b>Questão integradora:</b> explique como a alteração do estímulo inicial modifica o mecanismo e como o feedback tende a responder. Identifique o ponto de falha em uma disfunção primária versus central, quando aplicável.</div></section>", "2": "<section class=\"fisiolab-ampliacao\"><h2>Complemento aprofundado — mecanismos e integração</h2><p><b>Como estudar:</b> para cada processo abaixo, identifique estímulo, célula-alvo, receptor, via de sinalização, efeito e feedback. Esta seção complementa a explicação anterior; não substitui os esquemas originais da aula.</p><h3>Secreção pulsátil de GH</h3><p>A secreção somatotrófica resulta da interação entre GHRH estimulatório, somatostatina inibitória e ghrelina. Por isso, uma medida isolada de GH basal pode ser pouco informativa; IGF-1 e testes dinâmicos têm maior utilidade conforme a hipótese clínica.</p><div class=\"box k\"><b>Conceito-chave:</b> GH é secretado em pulsos, sobretudo durante o sono de ondas lentas.</div><h3>Eixo GH–IGF-1</h3><p>GH se liga ao receptor associado a JAK2, ativando STAT e transcrição gênica. IGF-1 age por receptor tirosina-quinase e estimula proliferação condrocitária e crescimento longitudinal enquanto placas epifisárias estão abertas.</p><div class=\"box k\"><b>Conceito-chave:</b> GH estimula IGF-1 hepático e tecidual, que medeia parte do crescimento.</div><h3>GH e glicose</h3><p>Além do crescimento, GH aumenta lipólise e disponibilidade de ácidos graxos. Em excesso crônico, favorece resistência à insulina e hiperglicemia; seus efeitos metabólicos diretos diferem das ações promotoras de crescimento do IGF-1.</p><div class=\"box k\"><b>Conceito-chave:</b> GH reduz a utilização periférica de glicose e pode antagonizar a insulina.</div><h3>Acromegalia</h3><p>Após a fusão das placas de crescimento, não ocorre gigantismo longitudinal; predominam crescimento acral, alterações de tecidos moles e efeitos cardiometabólicos. IGF-1 elevado e ausência de supressão apropriada do GH após glicose sustentam a investigação.</p><div class=\"box k\"><b>Conceito-chave:</b> Excesso de GH após fechamento epifisário causa acromegalia.</div><h3>Resistência ao GH</h3><p>Na síndrome de Laron, alterações do receptor de GH ou da via de sinalização comprometem geração de IGF-1. A redução do feedback pode elevar GH apesar de crescimento insuficiente.</p><div class=\"box k\"><b>Conceito-chave:</b> GH alto com IGF-1 baixo pode indicar resistência ao GH.</div><h3>Quadro comparativo de mecanismos</h3><div class=\"sc\"><table><tr><th>Mecanismo</th><th>Resultado fisiológico</th></tr><tr><td><b>Secreção pulsátil de GH</b></td><td>GH é secretado em pulsos, sobretudo durante o sono de ondas lentas.</td></tr><tr><td><b>Eixo GH–IGF-1</b></td><td>GH estimula IGF-1 hepático e tecidual, que medeia parte do crescimento.</td></tr><tr><td><b>GH e glicose</b></td><td>GH reduz a utilização periférica de glicose e pode antagonizar a insulina.</td></tr><tr><td><b>Acromegalia</b></td><td>Excesso de GH após fechamento epifisário causa acromegalia.</td></tr><tr><td><b>Resistência ao GH</b></td><td>GH alto com IGF-1 baixo pode indicar resistência ao GH.</td></tr></table></div><div class=\"box w\"><b>Questão integradora:</b> explique como a alteração do estímulo inicial modifica o mecanismo e como o feedback tende a responder. Identifique o ponto de falha em uma disfunção primária versus central, quando aplicável.</div></section>", "3": "<section class=\"fisiolab-ampliacao\"><h2>Complemento aprofundado — mecanismos e integração</h2><p><b>Como estudar:</b> para cada processo abaixo, identifique estímulo, célula-alvo, receptor, via de sinalização, efeito e feedback. Esta seção complementa a explicação anterior; não substitui os esquemas originais da aula.</p><h3>Zonas do córtex</h3><p>A zona glomerulosa expressa aldosterona sintase e responde sobretudo à angiotensina II e ao potássio. A fasciculada depende de ACTH para esteroidogênese de cortisol, enquanto a reticular contribui para DHEA e androstenediona.</p><div class=\"box k\"><b>Conceito-chave:</b> Glomerulosa produz aldosterona; fasciculada cortisol; reticular andrógenos.</div><h3>ACTH e cortisol</h3><p>ACTH atua no receptor MC2R acoplado a Gs e aumenta AMPc/PKA, mobilizando colesterol e estimulando sua transferência mitocondrial por StAR. Cortisol circulante inibe CRH e ACTH; estresse pode elevar a atividade do eixo.</p><div class=\"box k\"><b>Conceito-chave:</b> CRH estimula ACTH, que ativa produção de cortisol.</div><h3>Aldosterona renal</h3><p>O receptor mineralocorticoide induz expressão de ENaC e Na+/K+-ATPase nas células principais do néfron distal. O gradiente eletroquímico favorece secreção de potássio; o efeito sobre H+ nas células intercaladas contribui para alcalose metabólica em excesso.</p><div class=\"box k\"><b>Conceito-chave:</b> Aldosterona aumenta reabsorção de sódio e secreção de potássio.</div><h3>RAAS</h3><p>A redução de perfusão renal, NaCl na mácula densa e ativação simpática beta-1 favorecem liberação de renina. Angiotensina II contrai vasos e estimula aldosterona; o potássio plasmático também regula diretamente a zona glomerulosa.</p><div class=\"box k\"><b>Conceito-chave:</b> Renina inicia a formação de angiotensina II, estimulando aldosterona.</div><h3>Cushing versus Addison</h3><p>Hipercortisolismo crônico favorece hiperglicemia, fraqueza proximal, redistribuição de gordura e fragilidade cutânea. Insuficiência adrenal primária pode cursar com hipotensão, hiponatremia, hipercalemia e ACTH elevado; hiperpigmentação decorre de aumento de derivados de POMC.</p><div class=\"box k\"><b>Conceito-chave:</b> Excesso de cortisol e deficiência adrenal produzem perfis clínicos distintos.</div><h3>Quadro comparativo de mecanismos</h3><div class=\"sc\"><table><tr><th>Mecanismo</th><th>Resultado fisiológico</th></tr><tr><td><b>Zonas do córtex</b></td><td>Glomerulosa produz aldosterona; fasciculada cortisol; reticular andrógenos.</td></tr><tr><td><b>ACTH e cortisol</b></td><td>CRH estimula ACTH, que ativa produção de cortisol.</td></tr><tr><td><b>Aldosterona renal</b></td><td>Aldosterona aumenta reabsorção de sódio e secreção de potássio.</td></tr><tr><td><b>RAAS</b></td><td>Renina inicia a formação de angiotensina II, estimulando aldosterona.</td></tr><tr><td><b>Cushing versus Addison</b></td><td>Excesso de cortisol e deficiência adrenal produzem perfis clínicos distintos.</td></tr></table></div><div class=\"box w\"><b>Questão integradora:</b> explique como a alteração do estímulo inicial modifica o mecanismo e como o feedback tende a responder. Identifique o ponto de falha em uma disfunção primária versus central, quando aplicável.</div></section>", "4": "<section class=\"fisiolab-ampliacao\"><h2>Complemento aprofundado — mecanismos e integração</h2><p><b>Como estudar:</b> para cada processo abaixo, identifique estímulo, célula-alvo, receptor, via de sinalização, efeito e feedback. Esta seção complementa a explicação anterior; não substitui os esquemas originais da aula.</p><h3>Acoplamento glicose–insulina</h3><p>Glicose entra na célula beta por transportadores como GLUT1 e GLUT3 em humanos; a glicocinase participa do sensoriamento metabólico. O aumento de ATP/ADP fecha canais KATP, reduz efluxo de K+, abre canais de Ca2+ voltagem-dependentes e induz exocitose dos grânulos de insulina.</p><div class=\"box k\"><b>Conceito-chave:</b> ATP fecha KATP, despolariza a célula beta e abre canais de Ca2+.</div><h3>Receptor de insulina</h3><p>A autofosforilação do receptor recruta proteínas IRS. PI3K/Akt promove translocação de GLUT4 em músculo e tecido adiposo, síntese de glicogênio e efeitos anabólicos. No fígado, a insulina reduz produção hepática de glicose sem depender de GLUT4.</p><div class=\"box k\"><b>Conceito-chave:</b> Insulina ativa receptor tirosina-quinase e a via IRS–PI3K–Akt.</div><h3>Glucagon</h3><p>Produzido por células alfa, atua predominantemente em receptores hepáticos Gs–AMPc–PKA, favorecendo glicogenólise e gliconeogênese. A secreção aumenta quando glicose cai e é modulada por sinais paracrinos das ilhotas.</p><div class=\"box k\"><b>Conceito-chave:</b> Glucagon eleva produção hepática de glicose no jejum.</div><h3>Peptídeo C</h3><p>A pró-insulina é processada em insulina e peptídeo C, liberados em quantidades equimolares. A dosagem de peptídeo C auxilia na avaliação da produção endógena, diferentemente da insulina administrada externamente.</p><div class=\"box k\"><b>Conceito-chave:</b> Peptídeo C é liberado com insulina endógena na clivagem da pró-insulina.</div><h3>Estado alimentado e jejum</h3><p>Após refeição, a insulina favorece armazenamento de glicogênio e lipídios e síntese proteica. No jejum, redução da razão insulina/glucagon facilita glicogenólise, gliconeogênese e mobilização de combustíveis; a adaptação depende da duração do jejum.</p><div class=\"box k\"><b>Conceito-chave:</b> Insulina domina no estado alimentado; glucagon aumenta no jejum.</div><h3>Quadro comparativo de mecanismos</h3><div class=\"sc\"><table><tr><th>Mecanismo</th><th>Resultado fisiológico</th></tr><tr><td><b>Acoplamento glicose–insulina</b></td><td>ATP fecha KATP, despolariza a célula beta e abre canais de Ca2+.</td></tr><tr><td><b>Receptor de insulina</b></td><td>Insulina ativa receptor tirosina-quinase e a via IRS–PI3K–Akt.</td></tr><tr><td><b>Glucagon</b></td><td>Glucagon eleva produção hepática de glicose no jejum.</td></tr><tr><td><b>Peptídeo C</b></td><td>Peptídeo C é liberado com insulina endógena na clivagem da pró-insulina.</td></tr><tr><td><b>Estado alimentado e jejum</b></td><td>Insulina domina no estado alimentado; glucagon aumenta no jejum.</td></tr></table></div><div class=\"box w\"><b>Questão integradora:</b> explique como a alteração do estímulo inicial modifica o mecanismo e como o feedback tende a responder. Identifique o ponto de falha em uma disfunção primária versus central, quando aplicável.</div></section>", "5": "<section class=\"fisiolab-ampliacao\"><h2>Complemento aprofundado — mecanismos e integração</h2><p><b>Como estudar:</b> para cada processo abaixo, identifique estímulo, célula-alvo, receptor, via de sinalização, efeito e feedback. Esta seção complementa a explicação anterior; não substitui os esquemas originais da aula.</p><h3>Síntese de testosterona</h3><p>LH ativa receptor acoplado a Gs, elevando AMPc e facilitando a transferência de colesterol para a mitocôndria por StAR. Enzimas esteroidogênicas convertem intermediários em testosterona, que atua localmente e na circulação.</p><div class=\"box k\"><b>Conceito-chave:</b> LH estimula células de Leydig a produzir testosterona a partir de colesterol.</div><h3>DHT</h3><p>DHT se liga com alta afinidade ao receptor androgênico e participa da diferenciação de genitália externa masculina e crescimento prostático. A deficiência de 5-alfa-redutase altera virilização externa, apesar de produção de testosterona.</p><div class=\"box k\"><b>Conceito-chave:</b> 5-alfa-redutase converte testosterona em DHT em tecidos-alvo.</div><h3>Aromatase</h3><p>Parte da testosterona se transforma em estradiol no tecido adiposo, cérebro e outros locais. Estradiol contribui para maturação óssea e feedback do eixo masculino; não é um hormônio exclusivo da fisiologia feminina.</p><div class=\"box k\"><b>Conceito-chave:</b> Aromatase converte andrógenos em estrógenos.</div><h3>Receptor androgênico</h3><p>Após ligação ao ligante, o receptor modifica conformação, dimeriza e interage com elementos responsivos do DNA. A resposta depende de cofatores e expressão local de enzimas, razão pela qual tecidos distintos respondem diferentemente.</p><div class=\"box k\"><b>Conceito-chave:</b> Testosterona e DHT ativam receptor intracelular regulador de transcrição.</div><h3>Feedback masculino</h3><p>O eixo hipotálamo–hipófise–testículo opera por feedback negativo. Redução primária da função testicular tende a elevar gonadotrofinas, enquanto deficiência hipotalâmica ou hipofisária pode manter LH/FSH baixos ou inadequadamente normais.</p><div class=\"box k\"><b>Conceito-chave:</b> Testosterona e estradiol inibem GnRH/LH; inibina B inibe FSH.</div><h3>Quadro comparativo de mecanismos</h3><div class=\"sc\"><table><tr><th>Mecanismo</th><th>Resultado fisiológico</th></tr><tr><td><b>Síntese de testosterona</b></td><td>LH estimula células de Leydig a produzir testosterona a partir de colesterol.</td></tr><tr><td><b>DHT</b></td><td>5-alfa-redutase converte testosterona em DHT em tecidos-alvo.</td></tr><tr><td><b>Aromatase</b></td><td>Aromatase converte andrógenos em estrógenos.</td></tr><tr><td><b>Receptor androgênico</b></td><td>Testosterona e DHT ativam receptor intracelular regulador de transcrição.</td></tr><tr><td><b>Feedback masculino</b></td><td>Testosterona e estradiol inibem GnRH/LH; inibina B inibe FSH.</td></tr></table></div><div class=\"box w\"><b>Questão integradora:</b> explique como a alteração do estímulo inicial modifica o mecanismo e como o feedback tende a responder. Identifique o ponto de falha em uma disfunção primária versus central, quando aplicável.</div></section>", "6": "<section class=\"fisiolab-ampliacao\"><h2>Complemento aprofundado — mecanismos e integração</h2><p><b>Como estudar:</b> para cada processo abaixo, identifique estímulo, célula-alvo, receptor, via de sinalização, efeito e feedback. Esta seção complementa a explicação anterior; não substitui os esquemas originais da aula.</p><h3>Sertoli e FSH</h3><p>Células de Sertoli nutrem e organizam células germinativas, formam junções da barreira hematotesticular, produzem ABP e inibina B. O efeito do FSH integra-se à alta testosterona intratesticular produzida pelas células de Leydig.</p><div class=\"box k\"><b>Conceito-chave:</b> FSH estimula Sertoli, sustentando o ambiente da espermatogênese.</div><h3>Leydig e LH</h3><p>A concentração local de testosterona necessária à espermatogênese é muito maior que a circulante. A administração exógena de testosterona pode suprimir LH e FSH e reduzir a produção de espermatozoides.</p><div class=\"box k\"><b>Conceito-chave:</b> LH estimula Leydig a produzir testosterona intratesticular.</div><h3>Meiose espermatogênica</h3><p>A meiose I separa cromossomos homólogos; a meiose II separa cromátides-irmãs. Espermiogênese transforma espermátides haploides em células com acrossomo, flagelo e núcleo condensado, sem nova divisão celular.</p><div class=\"box k\"><b>Conceito-chave:</b> Espermatócito primário gera espermatócitos secundários e espermátides.</div><h3>Temperatura testicular</h3><p>O plexo pampiniforme e o escroto participam da termorregulação. Exposição térmica persistente, criptorquidia e varicocele podem comprometer parâmetros seminais, embora causas de infertilidade sejam multifatoriais.</p><div class=\"box k\"><b>Conceito-chave:</b> A espermatogênese exige temperatura testicular abaixo da corporal.</div><h3>Ereção e GMPc</h3><p>Estímulo parassimpático favorece liberação de NO, que ativa guanilil ciclase solúvel. GMPc reduz cálcio intracelular e facilita enchimento dos corpos cavernosos; PDE5 degrada GMPc e sua inibição prolonga a resposta dependente de NO.</p><div class=\"box k\"><b>Conceito-chave:</b> NO ativa guanilil ciclase, aumenta GMPc e relaxa músculo liso cavernoso.</div><h3>Quadro comparativo de mecanismos</h3><div class=\"sc\"><table><tr><th>Mecanismo</th><th>Resultado fisiológico</th></tr><tr><td><b>Sertoli e FSH</b></td><td>FSH estimula Sertoli, sustentando o ambiente da espermatogênese.</td></tr><tr><td><b>Leydig e LH</b></td><td>LH estimula Leydig a produzir testosterona intratesticular.</td></tr><tr><td><b>Meiose espermatogênica</b></td><td>Espermatócito primário gera espermatócitos secundários e espermátides.</td></tr><tr><td><b>Temperatura testicular</b></td><td>A espermatogênese exige temperatura testicular abaixo da corporal.</td></tr><tr><td><b>Ereção e GMPc</b></td><td>NO ativa guanilil ciclase, aumenta GMPc e relaxa músculo liso cavernoso.</td></tr></table></div><div class=\"box w\"><b>Questão integradora:</b> explique como a alteração do estímulo inicial modifica o mecanismo e como o feedback tende a responder. Identifique o ponto de falha em uma disfunção primária versus central, quando aplicável.</div></section>", "7": "<section class=\"fisiolab-ampliacao\"><h2>Complemento aprofundado — mecanismos e integração</h2><p><b>Como estudar:</b> para cada processo abaixo, identifique estímulo, célula-alvo, receptor, via de sinalização, efeito e feedback. Esta seção complementa a explicação anterior; não substitui os esquemas originais da aula.</p><h3>Duas células e duas gonadotrofinas</h3><p>Células da teca produzem andrógenos a partir de colesterol sob estímulo de LH. Andrógenos difundem para a granulosa, onde FSH induz aromatase e conversão em estradiol; a distribuição enzimática explica a cooperação folicular.</p><div class=\"box k\"><b>Conceito-chave:</b> LH estimula teca; FSH estimula aromatase na granulosa.</div><h3>Estradiol endometrial</h3><p>Na fase folicular, estradiol aumenta crescimento de glândulas e estroma endometrial e induz receptores de progesterona. Também torna o muco cervical mais fluido, facilitando passagem de espermatozoides.</p><div class=\"box k\"><b>Conceito-chave:</b> Estradiol estimula proliferação do endométrio.</div><h3>Progesterona endometrial</h3><p>Após ovulação, corpo lúteo secreta progesterona, que favorece diferenciação glandular, secreção e condições de receptividade endometrial. O muco cervical torna-se mais espesso e a temperatura basal tende a aumentar.</p><div class=\"box k\"><b>Conceito-chave:</b> Progesterona transforma endométrio proliferativo em secretor.</div><h3>Inibina ovariana</h3><p>Inibina B predomina em parte da fase folicular e inibina A aumenta na fase lútea. A queda da reserva folicular reduz inibina e estradiol, contribuindo para elevação de FSH na menopausa.</p><div class=\"box k\"><b>Conceito-chave:</b> Inibina reduz seletivamente secreção hipofisária de FSH.</div><h3>Menopausa</h3><p>A redução sustentada da atividade folicular retira o feedback negativo sobre hipófise e hipotálamo. Sintomas vasomotores, alterações urogenitais e perda óssea relacionam-se à deficiência estrogênica, embora a intensidade varie entre pessoas.</p><div class=\"box k\"><b>Conceito-chave:</b> Falência folicular reduz estradiol/inibina e eleva FSH.</div><h3>Quadro comparativo de mecanismos</h3><div class=\"sc\"><table><tr><th>Mecanismo</th><th>Resultado fisiológico</th></tr><tr><td><b>Duas células e duas gonadotrofinas</b></td><td>LH estimula teca; FSH estimula aromatase na granulosa.</td></tr><tr><td><b>Estradiol endometrial</b></td><td>Estradiol estimula proliferação do endométrio.</td></tr><tr><td><b>Progesterona endometrial</b></td><td>Progesterona transforma endométrio proliferativo em secretor.</td></tr><tr><td><b>Inibina ovariana</b></td><td>Inibina reduz seletivamente secreção hipofisária de FSH.</td></tr><tr><td><b>Menopausa</b></td><td>Falência folicular reduz estradiol/inibina e eleva FSH.</td></tr></table></div><div class=\"box w\"><b>Questão integradora:</b> explique como a alteração do estímulo inicial modifica o mecanismo e como o feedback tende a responder. Identifique o ponto de falha em uma disfunção primária versus central, quando aplicável.</div></section>", "8": "<section class=\"fisiolab-ampliacao\"><h2>Complemento aprofundado — mecanismos e integração</h2><p><b>Como estudar:</b> para cada processo abaixo, identifique estímulo, célula-alvo, receptor, via de sinalização, efeito e feedback. Esta seção complementa a explicação anterior; não substitui os esquemas originais da aula.</p><h3>Recrutamento folicular</h3><p>O crescimento inicial de folículos primordiais envolve fatores intraovarianos, enquanto estágios antrais dependem progressivamente de FSH. A seleção do dominante envolve maior sensibilidade a FSH e produção de estradiol, com atresia dos demais.</p><div class=\"box k\"><b>Conceito-chave:</b> Coortes de folículos crescem; um folículo dominante costuma emergir.</div><h3>Pico de LH</h3><p>Na maior parte do ciclo, estradiol exerce feedback negativo. Próximo da ovulação, exposição suficientemente elevada e sustentada ao estradiol muda a resposta central e hipofisária, precipitando pico de LH e maturação ovocitária.</p><div class=\"box k\"><b>Conceito-chave:</b> Estradiol alto sustentado desencadeia feedback positivo e pico de LH.</div><h3>Ovulação</h3><p>LH promove retomada da meiose, luteinização, mudanças em prostaglandinas e enzimas proteolíticas da parede folicular. O ovócito secundário é liberado com células da corona radiata e permanece parado em metáfase II até fertilização.</p><div class=\"box k\"><b>Conceito-chave:</b> Pico de LH induz ruptura folicular e liberação do ovócito secundário.</div><h3>Corpo lúteo</h3><p>A luteinização das células foliculares gera estrutura vascularizada produtora de progesterona e estradiol. Sem hCG embrionário, ocorre luteólise e queda hormonal, desencadeando alterações vasculares e inflamatórias endometriais.</p><div class=\"box k\"><b>Conceito-chave:</b> Corpo lúteo secreta progesterona após a ovulação.</div><h3>Menstruação</h3><p>A retirada do suporte hormonal desencadeia produção de prostaglandinas, vasoconstrição das artérias espiraladas, inflamação e degradação da matriz. A camada basal permanece e permite regeneração endometrial no ciclo seguinte.</p><div class=\"box k\"><b>Conceito-chave:</b> Queda de progesterona e estradiol leva à descamação da camada funcional.</div><h3>Quadro comparativo de mecanismos</h3><div class=\"sc\"><table><tr><th>Mecanismo</th><th>Resultado fisiológico</th></tr><tr><td><b>Recrutamento folicular</b></td><td>Coortes de folículos crescem; um folículo dominante costuma emergir.</td></tr><tr><td><b>Pico de LH</b></td><td>Estradiol alto sustentado desencadeia feedback positivo e pico de LH.</td></tr><tr><td><b>Ovulação</b></td><td>Pico de LH induz ruptura folicular e liberação do ovócito secundário.</td></tr><tr><td><b>Corpo lúteo</b></td><td>Corpo lúteo secreta progesterona após a ovulação.</td></tr><tr><td><b>Menstruação</b></td><td>Queda de progesterona e estradiol leva à descamação da camada funcional.</td></tr></table></div><div class=\"box w\"><b>Questão integradora:</b> explique como a alteração do estímulo inicial modifica o mecanismo e como o feedback tende a responder. Identifique o ponto de falha em uma disfunção primária versus central, quando aplicável.</div></section>", "9": "<section class=\"fisiolab-ampliacao\"><h2>Complemento aprofundado — mecanismos e integração</h2><p><b>Como estudar:</b> para cada processo abaixo, identifique estímulo, célula-alvo, receptor, via de sinalização, efeito e feedback. Esta seção complementa a explicação anterior; não substitui os esquemas originais da aula.</p><h3>CaSR e PTH</h3><p>As células principais da paratireoide monitoram cálcio extracelular pelo receptor sensor de cálcio. Hipocalcemia favorece liberação de PTH, enquanto elevação do cálcio inibe secreção por feedback.</p><div class=\"box k\"><b>Conceito-chave:</b> Cálcio ionizado baixo reduz ativação de CaSR e aumenta PTH.</div><h3>PTH renal</h3><p>No néfron distal, PTH favorece conservação de cálcio; no túbulo proximal, reduz cotransportadores de fosfato, aumentando fosfatúria. Também estimula 1-alfa-hidroxilase renal, elevando calcitriol.</p><div class=\"box k\"><b>Conceito-chave:</b> PTH aumenta reabsorção de cálcio e reduz reabsorção de fosfato.</div><h3>Vitamina D ativa</h3><p>Colecalciferol é convertido em 25-hidroxivitamina D no fígado e depois em 1,25-di-hidroxivitamina D no rim. O calcitriol atua por receptor nuclear, aumentando proteínas de transporte intestinal de minerais.</p><div class=\"box k\"><b>Conceito-chave:</b> Calcitriol aumenta absorção intestinal de cálcio e fosfato.</div><h3>FGF23</h3><p>Produzido principalmente por osteócitos, FGF23 atua com participação de Klotho, reduz reabsorção tubular de fosfato e inibe 1-alfa-hidroxilase. Integra o controle de fosfato com PTH e vitamina D.</p><div class=\"box k\"><b>Conceito-chave:</b> FGF23 aumenta fosfatúria e reduz produção renal de calcitriol.</div><h3>Cálcio ionizado e albumina</h3><p>A fração ionizada é fisiologicamente ativa. Alcalose aumenta ligação do cálcio à albumina e pode reduzir o ionizado mesmo com cálcio total inalterado; em situações complexas, dosagem direta do cálcio ionizado é preferível.</p><div class=\"box k\"><b>Conceito-chave:</b> Hipoalbuminemia pode reduzir cálcio total sem reduzir cálcio ionizado.</div><h3>Quadro comparativo de mecanismos</h3><div class=\"sc\"><table><tr><th>Mecanismo</th><th>Resultado fisiológico</th></tr><tr><td><b>CaSR e PTH</b></td><td>Cálcio ionizado baixo reduz ativação de CaSR e aumenta PTH.</td></tr><tr><td><b>PTH renal</b></td><td>PTH aumenta reabsorção de cálcio e reduz reabsorção de fosfato.</td></tr><tr><td><b>Vitamina D ativa</b></td><td>Calcitriol aumenta absorção intestinal de cálcio e fosfato.</td></tr><tr><td><b>FGF23</b></td><td>FGF23 aumenta fosfatúria e reduz produção renal de calcitriol.</td></tr><tr><td><b>Cálcio ionizado e albumina</b></td><td>Hipoalbuminemia pode reduzir cálcio total sem reduzir cálcio ionizado.</td></tr></table></div><div class=\"box w\"><b>Questão integradora:</b> explique como a alteração do estímulo inicial modifica o mecanismo e como o feedback tende a responder. Identifique o ponto de falha em uma disfunção primária versus central, quando aplicável.</div></section>", "10": "<section class=\"fisiolab-ampliacao\"><h2>Complemento aprofundado — mecanismos e integração</h2><p><b>Como estudar:</b> para cada processo abaixo, identifique estímulo, célula-alvo, receptor, via de sinalização, efeito e feedback. Esta seção complementa a explicação anterior; não substitui os esquemas originais da aula.</p><h3>Captação de iodeto</h3><p>O simportador sódio–iodeto utiliza o gradiente de sódio mantido por Na+/K+-ATPase. O iodeto atravessa a membrana apical em direção ao coloide, com participação da pendrina e outras vias de transporte.</p><div class=\"box k\"><b>Conceito-chave:</b> NIS transporta iodeto para o tireócito na membrana basolateral.</div><h3>Organificação</h3><p>Na interface apical-coloide, a tireoperoxidase utiliza peróxido de hidrogênio para organificação, formando MIT e DIT. O acoplamento de DIT+DIT forma T4 e MIT+DIT forma T3, ainda ligados à tireoglobulina.</p><div class=\"box k\"><b>Conceito-chave:</b> TPO oxida iodeto e ioda tirosinas da tireoglobulina.</div><h3>Liberação T3/T4</h3><p>A tireoglobulina armazenada no coloide é internalizada e degradada em lisossomos; T4 e T3 são liberados à circulação, enquanto MIT/DIT remanescentes são desiodados para reciclagem de iodeto.</p><div class=\"box k\"><b>Conceito-chave:</b> TSH estimula endocitose e proteólise da tireoglobulina iodada.</div><h3>Desiodases</h3><p>T4 é o principal produto secretado pela tireoide, mas T3 possui maior atividade nos receptores. Desiodação periférica controla disponibilidade local de T3; D3 converte T4 em T3 reverso e T3 em T2.</p><div class=\"box k\"><b>Conceito-chave:</b> D1 e D2 podem formar T3; D3 inativa hormônios tireoidianos.</div><h3>Feedback tireoidiano</h3><p>TRH hipotalâmico estimula TSH, que age em receptor acoplado a Gs no tireócito e favorece síntese e liberação hormonal. Na disfunção tireoidiana primária, TSH varia em direção oposta à do T4 livre, salvo condições especiais.</p><div class=\"box k\"><b>Conceito-chave:</b> T3/T4 inibem TRH e TSH por feedback negativo.</div><h3>Wolff–Chaikoff</h3><p>A glândula geralmente escapa do efeito após adaptação da captação de iodeto. O fenômeno não deve ser confundido com Jod–Basedow, em que exposição a iodo pode precipitar hipertireoidismo em tecido autônomo.</p><div class=\"box k\"><b>Conceito-chave:</b> Excesso agudo de iodeto pode inibir temporariamente organificação.</div><h3>Quadro comparativo de mecanismos</h3><div class=\"sc\"><table><tr><th>Mecanismo</th><th>Resultado fisiológico</th></tr><tr><td><b>Captação de iodeto</b></td><td>NIS transporta iodeto para o tireócito na membrana basolateral.</td></tr><tr><td><b>Organificação</b></td><td>TPO oxida iodeto e ioda tirosinas da tireoglobulina.</td></tr><tr><td><b>Liberação T3/T4</b></td><td>TSH estimula endocitose e proteólise da tireoglobulina iodada.</td></tr><tr><td><b>Desiodases</b></td><td>D1 e D2 podem formar T3; D3 inativa hormônios tireoidianos.</td></tr><tr><td><b>Feedback tireoidiano</b></td><td>T3/T4 inibem TRH e TSH por feedback negativo.</td></tr><tr><td><b>Wolff–Chaikoff</b></td><td>Excesso agudo de iodeto pode inibir temporariamente organificação.</td></tr></table></div><div class=\"box w\"><b>Questão integradora:</b> explique como a alteração do estímulo inicial modifica o mecanismo e como o feedback tende a responder. Identifique o ponto de falha em uma disfunção primária versus central, quando aplicável.</div></section>"};

CARDS.push(...[[0, "Explique: Sinalização Gs?", "Gs ativa adenilil ciclase, eleva AMPc e ativa PKA.", "O ligante modifica a conformação do receptor de sete hélices transmembrana; Gαs troca GDP por GTP, ativa a adenilil ciclase e amplia o sinal por AMPc. A PKA fosforila proteínas e pode alterar a transcrição por CREB. Fosfodiesterases degradam AMPc e a hidrólise de GTP encerra o sinal."], [0, "Qual a importância fisiológica de sinalização gs?", "O ligante modifica a conformação do receptor de sete hélices transmembrana; Gαs troca GDP por GTP, ativa a adenilil ciclase e amplia o sinal por AMPc.", "Gs ativa adenilil ciclase, eleva AMPc e ativa PKA."], [0, "Explique: Sinalização Gq?", "Gq ativa PLC, que gera IP3 e DAG a partir de PIP2.", "IP3 se liga a receptores do retículo endoplasmático e mobiliza cálcio para o citosol; DAG, com cálcio, favorece ativação de PKC. O aumento de cálcio ativa calmodulina e quinases dependentes de cálcio. Esses mediadores integram secreção, contração e respostas metabólicas."], [0, "Qual a importância fisiológica de sinalização gq?", "IP3 se liga a receptores do retículo endoplasmático e mobiliza cálcio para o citosol; DAG, com cálcio, favorece ativação de PKC.", "Gq ativa PLC, que gera IP3 e DAG a partir de PIP2."], [0, "Explique: Receptor intracelular?", "Esteroides e hormônios tireoidianos regulam transcrição por receptores intracelulares.", "A fração livre do hormônio entra na célula e se liga a proteínas receptoras citoplasmáticas ou nucleares. O complexo reconhece sequências reguladoras de DNA, recruta cofatores e modifica síntese de proteínas. O início tende a ser mais lento, embora também existam ações rápidas não genômicas."], [0, "Qual a importância fisiológica de receptor intracelular?", "A fração livre do hormônio entra na célula e se liga a proteínas receptoras citoplasmáticas ou nucleares.", "Esteroides e hormônios tireoidianos regulam transcrição por receptores intracelulares."], [0, "Explique: Transporte hormonal?", "Apenas a fração livre do hormônio ligado a proteínas está prontamente disponível.", "Albumina e globulinas específicas formam um reservatório circulante, retardam a depuração e amortecem oscilações da concentração livre. Alterações de proteínas transportadoras podem modificar a concentração total sem mudar a fração biologicamente ativa."], [0, "Qual a importância fisiológica de transporte hormonal?", "Albumina e globulinas específicas formam um reservatório circulante, retardam a depuração e amortecem oscilações da concentração livre.", "Apenas a fração livre do hormônio ligado a proteínas está prontamente disponível."], [0, "Explique: Feedback negativo?", "A resposta final reduz a atividade de etapas anteriores do eixo.", "A concentração de hormônio periférico modula hipotálamo e hipófise, limitando a secreção trófica. A perda de função de glândula periférica pode elevar hormônio trófico, enquanto uma lesão hipofisária pode causar ambos baixos ou inadequadamente normais."], [0, "Qual a importância fisiológica de feedback negativo?", "A concentração de hormônio periférico modula hipotálamo e hipófise, limitando a secreção trófica.", "A resposta final reduz a atividade de etapas anteriores do eixo."], [1, "Explique: Sistema porta?", "Hormônios hipotalâmicos alcançam a adeno-hipófise pelo sistema porta.", "Neurônios parvocelulares liberam fatores na eminência mediana. O sangue do plexo capilar primário segue por veias porta até o plexo secundário da adeno-hipófise, permitindo concentrações locais elevadas sem grande diluição sistêmica."], [1, "Qual a importância fisiológica de sistema porta?", "Neurônios parvocelulares liberam fatores na eminência mediana.", "Hormônios hipotalâmicos alcançam a adeno-hipófise pelo sistema porta."], [1, "Explique: Neuro-hipófise?", "ADH e ocitocina são sintetizados no hipotálamo e liberados na neuro-hipófise.", "Neurônios magnocelulares dos núcleos supraóptico e paraventricular sintetizam precursores hormonais; vesículas percorrem axônios até a hipófise posterior. Potenciais de ação induzem entrada de cálcio e exocitose nos terminais."], [1, "Qual a importância fisiológica de neuro-hipófise?", "Neurônios magnocelulares dos núcleos supraóptico e paraventricular sintetizam precursores hormonais; vesículas percorrem axônios até a hipófise posterior.", "ADH e ocitocina são sintetizados no hipotálamo e liberados na neuro-hipófise."], [1, "Explique: ADH renal?", "ADH ativa receptores V2 e aumenta aquaporina-2 no ducto coletor.", "A elevação da osmolaridade estimula osmorreceptores e a secreção de vasopressina. A via V2–Gs–AMPc–PKA promove inserção de AQP2 na membrana apical, elevando reabsorção de água. Hipovolemia intensa também estimula ADH mesmo com osmolaridade baixa."], [1, "Qual a importância fisiológica de adh renal?", "A elevação da osmolaridade estimula osmorreceptores e a secreção de vasopressina.", "ADH ativa receptores V2 e aumenta aquaporina-2 no ducto coletor."], [1, "Explique: Prolactina?", "Dopamina hipotalâmica inibe tonicamente a secreção de prolactina.", "A interrupção da haste hipofisária reduz o aporte de dopamina e pode elevar prolactina. TRH pode estimulá-la, e a sucção reduz a inibição dopaminérgica; prolactina favorece produção de leite, enquanto ocitocina promove ejeção."], [1, "Qual a importância fisiológica de prolactina?", "A interrupção da haste hipofisária reduz o aporte de dopamina e pode elevar prolactina.", "Dopamina hipotalâmica inibe tonicamente a secreção de prolactina."], [1, "Explique: Lesão primária?", "Falência glandular primária tende a elevar o hormônio trófico correspondente.", "No hipotireoidismo primário, T4 livre baixo retira o feedback negativo e eleva TSH. Na insuficiência hipofisária, TSH pode estar baixo ou inapropriadamente normal para T4 livre reduzido. Interpretar sempre o par hormonal e o contexto clínico."], [1, "Qual a importância fisiológica de lesão primária?", "No hipotireoidismo primário, T4 livre baixo retira o feedback negativo e eleva TSH.", "Falência glandular primária tende a elevar o hormônio trófico correspondente."], [2, "Explique: Secreção pulsátil de GH?", "GH é secretado em pulsos, sobretudo durante o sono de ondas lentas.", "A secreção somatotrófica resulta da interação entre GHRH estimulatório, somatostatina inibitória e ghrelina. Por isso, uma medida isolada de GH basal pode ser pouco informativa; IGF-1 e testes dinâmicos têm maior utilidade conforme a hipótese clínica."], [2, "Qual a importância fisiológica de secreção pulsátil de gh?", "A secreção somatotrófica resulta da interação entre GHRH estimulatório, somatostatina inibitória e ghrelina.", "GH é secretado em pulsos, sobretudo durante o sono de ondas lentas."], [2, "Explique: Eixo GH–IGF-1?", "GH estimula IGF-1 hepático e tecidual, que medeia parte do crescimento.", "GH se liga ao receptor associado a JAK2, ativando STAT e transcrição gênica. IGF-1 age por receptor tirosina-quinase e estimula proliferação condrocitária e crescimento longitudinal enquanto placas epifisárias estão abertas."], [2, "Qual a importância fisiológica de eixo gh–igf-1?", "GH se liga ao receptor associado a JAK2, ativando STAT e transcrição gênica.", "GH estimula IGF-1 hepático e tecidual, que medeia parte do crescimento."], [2, "Explique: GH e glicose?", "GH reduz a utilização periférica de glicose e pode antagonizar a insulina.", "Além do crescimento, GH aumenta lipólise e disponibilidade de ácidos graxos. Em excesso crônico, favorece resistência à insulina e hiperglicemia; seus efeitos metabólicos diretos diferem das ações promotoras de crescimento do IGF-1."], [2, "Qual a importância fisiológica de gh e glicose?", "Além do crescimento, GH aumenta lipólise e disponibilidade de ácidos graxos.", "GH reduz a utilização periférica de glicose e pode antagonizar a insulina."], [2, "Explique: Acromegalia?", "Excesso de GH após fechamento epifisário causa acromegalia.", "Após a fusão das placas de crescimento, não ocorre gigantismo longitudinal; predominam crescimento acral, alterações de tecidos moles e efeitos cardiometabólicos. IGF-1 elevado e ausência de supressão apropriada do GH após glicose sustentam a investigação."], [2, "Qual a importância fisiológica de acromegalia?", "Após a fusão das placas de crescimento, não ocorre gigantismo longitudinal; predominam crescimento acral, alterações de tecidos moles e efeitos cardiometabólicos.", "Excesso de GH após fechamento epifisário causa acromegalia."], [2, "Explique: Resistência ao GH?", "GH alto com IGF-1 baixo pode indicar resistência ao GH.", "Na síndrome de Laron, alterações do receptor de GH ou da via de sinalização comprometem geração de IGF-1. A redução do feedback pode elevar GH apesar de crescimento insuficiente."], [2, "Qual a importância fisiológica de resistência ao gh?", "Na síndrome de Laron, alterações do receptor de GH ou da via de sinalização comprometem geração de IGF-1.", "GH alto com IGF-1 baixo pode indicar resistência ao GH."], [3, "Explique: Zonas do córtex?", "Glomerulosa produz aldosterona; fasciculada cortisol; reticular andrógenos.", "A zona glomerulosa expressa aldosterona sintase e responde sobretudo à angiotensina II e ao potássio. A fasciculada depende de ACTH para esteroidogênese de cortisol, enquanto a reticular contribui para DHEA e androstenediona."], [3, "Qual a importância fisiológica de zonas do córtex?", "A zona glomerulosa expressa aldosterona sintase e responde sobretudo à angiotensina II e ao potássio.", "Glomerulosa produz aldosterona; fasciculada cortisol; reticular andrógenos."], [3, "Explique: ACTH e cortisol?", "CRH estimula ACTH, que ativa produção de cortisol.", "ACTH atua no receptor MC2R acoplado a Gs e aumenta AMPc/PKA, mobilizando colesterol e estimulando sua transferência mitocondrial por StAR. Cortisol circulante inibe CRH e ACTH; estresse pode elevar a atividade do eixo."], [3, "Qual a importância fisiológica de acth e cortisol?", "ACTH atua no receptor MC2R acoplado a Gs e aumenta AMPc/PKA, mobilizando colesterol e estimulando sua transferência mitocondrial por StAR.", "CRH estimula ACTH, que ativa produção de cortisol."], [3, "Explique: Aldosterona renal?", "Aldosterona aumenta reabsorção de sódio e secreção de potássio.", "O receptor mineralocorticoide induz expressão de ENaC e Na+/K+-ATPase nas células principais do néfron distal. O gradiente eletroquímico favorece secreção de potássio; o efeito sobre H+ nas células intercaladas contribui para alcalose metabólica em excesso."], [3, "Qual a importância fisiológica de aldosterona renal?", "O receptor mineralocorticoide induz expressão de ENaC e Na+/K+-ATPase nas células principais do néfron distal.", "Aldosterona aumenta reabsorção de sódio e secreção de potássio."], [3, "Explique: RAAS?", "Renina inicia a formação de angiotensina II, estimulando aldosterona.", "A redução de perfusão renal, NaCl na mácula densa e ativação simpática beta-1 favorecem liberação de renina. Angiotensina II contrai vasos e estimula aldosterona; o potássio plasmático também regula diretamente a zona glomerulosa."], [3, "Qual a importância fisiológica de raas?", "A redução de perfusão renal, NaCl na mácula densa e ativação simpática beta-1 favorecem liberação de renina.", "Renina inicia a formação de angiotensina II, estimulando aldosterona."], [3, "Explique: Cushing versus Addison?", "Excesso de cortisol e deficiência adrenal produzem perfis clínicos distintos.", "Hipercortisolismo crônico favorece hiperglicemia, fraqueza proximal, redistribuição de gordura e fragilidade cutânea. Insuficiência adrenal primária pode cursar com hipotensão, hiponatremia, hipercalemia e ACTH elevado; hiperpigmentação decorre de aumento de derivados de POMC."], [3, "Qual a importância fisiológica de cushing versus addison?", "Hipercortisolismo crônico favorece hiperglicemia, fraqueza proximal, redistribuição de gordura e fragilidade cutânea.", "Excesso de cortisol e deficiência adrenal produzem perfis clínicos distintos."], [4, "Explique: Acoplamento glicose–insulina?", "ATP fecha KATP, despolariza a célula beta e abre canais de Ca2+.", "Glicose entra na célula beta por transportadores como GLUT1 e GLUT3 em humanos; a glicocinase participa do sensoriamento metabólico. O aumento de ATP/ADP fecha canais KATP, reduz efluxo de K+, abre canais de Ca2+ voltagem-dependentes e induz exocitose dos grânulos de insulina."], [4, "Qual a importância fisiológica de acoplamento glicose–insulina?", "Glicose entra na célula beta por transportadores como GLUT1 e GLUT3 em humanos; a glicocinase participa do sensoriamento metabólico.", "ATP fecha KATP, despolariza a célula beta e abre canais de Ca2+."], [4, "Explique: Receptor de insulina?", "Insulina ativa receptor tirosina-quinase e a via IRS–PI3K–Akt.", "A autofosforilação do receptor recruta proteínas IRS. PI3K/Akt promove translocação de GLUT4 em músculo e tecido adiposo, síntese de glicogênio e efeitos anabólicos. No fígado, a insulina reduz produção hepática de glicose sem depender de GLUT4."], [4, "Qual a importância fisiológica de receptor de insulina?", "A autofosforilação do receptor recruta proteínas IRS.", "Insulina ativa receptor tirosina-quinase e a via IRS–PI3K–Akt."], [4, "Explique: Glucagon?", "Glucagon eleva produção hepática de glicose no jejum.", "Produzido por células alfa, atua predominantemente em receptores hepáticos Gs–AMPc–PKA, favorecendo glicogenólise e gliconeogênese. A secreção aumenta quando glicose cai e é modulada por sinais paracrinos das ilhotas."], [4, "Qual a importância fisiológica de glucagon?", "Produzido por células alfa, atua predominantemente em receptores hepáticos Gs–AMPc–PKA, favorecendo glicogenólise e gliconeogênese.", "Glucagon eleva produção hepática de glicose no jejum."], [4, "Explique: Peptídeo C?", "Peptídeo C é liberado com insulina endógena na clivagem da pró-insulina.", "A pró-insulina é processada em insulina e peptídeo C, liberados em quantidades equimolares. A dosagem de peptídeo C auxilia na avaliação da produção endógena, diferentemente da insulina administrada externamente."], [4, "Qual a importância fisiológica de peptídeo c?", "A pró-insulina é processada em insulina e peptídeo C, liberados em quantidades equimolares.", "Peptídeo C é liberado com insulina endógena na clivagem da pró-insulina."], [4, "Explique: Estado alimentado e jejum?", "Insulina domina no estado alimentado; glucagon aumenta no jejum.", "Após refeição, a insulina favorece armazenamento de glicogênio e lipídios e síntese proteica. No jejum, redução da razão insulina/glucagon facilita glicogenólise, gliconeogênese e mobilização de combustíveis; a adaptação depende da duração do jejum."], [4, "Qual a importância fisiológica de estado alimentado e jejum?", "Após refeição, a insulina favorece armazenamento de glicogênio e lipídios e síntese proteica.", "Insulina domina no estado alimentado; glucagon aumenta no jejum."], [5, "Explique: Síntese de testosterona?", "LH estimula células de Leydig a produzir testosterona a partir de colesterol.", "LH ativa receptor acoplado a Gs, elevando AMPc e facilitando a transferência de colesterol para a mitocôndria por StAR. Enzimas esteroidogênicas convertem intermediários em testosterona, que atua localmente e na circulação."], [5, "Qual a importância fisiológica de síntese de testosterona?", "LH ativa receptor acoplado a Gs, elevando AMPc e facilitando a transferência de colesterol para a mitocôndria por StAR.", "LH estimula células de Leydig a produzir testosterona a partir de colesterol."], [5, "Explique: DHT?", "5-alfa-redutase converte testosterona em DHT em tecidos-alvo.", "DHT se liga com alta afinidade ao receptor androgênico e participa da diferenciação de genitália externa masculina e crescimento prostático. A deficiência de 5-alfa-redutase altera virilização externa, apesar de produção de testosterona."], [5, "Qual a importância fisiológica de dht?", "DHT se liga com alta afinidade ao receptor androgênico e participa da diferenciação de genitália externa masculina e crescimento prostático.", "5-alfa-redutase converte testosterona em DHT em tecidos-alvo."], [5, "Explique: Aromatase?", "Aromatase converte andrógenos em estrógenos.", "Parte da testosterona se transforma em estradiol no tecido adiposo, cérebro e outros locais. Estradiol contribui para maturação óssea e feedback do eixo masculino; não é um hormônio exclusivo da fisiologia feminina."], [5, "Qual a importância fisiológica de aromatase?", "Parte da testosterona se transforma em estradiol no tecido adiposo, cérebro e outros locais.", "Aromatase converte andrógenos em estrógenos."], [5, "Explique: Receptor androgênico?", "Testosterona e DHT ativam receptor intracelular regulador de transcrição.", "Após ligação ao ligante, o receptor modifica conformação, dimeriza e interage com elementos responsivos do DNA. A resposta depende de cofatores e expressão local de enzimas, razão pela qual tecidos distintos respondem diferentemente."], [5, "Qual a importância fisiológica de receptor androgênico?", "Após ligação ao ligante, o receptor modifica conformação, dimeriza e interage com elementos responsivos do DNA.", "Testosterona e DHT ativam receptor intracelular regulador de transcrição."], [5, "Explique: Feedback masculino?", "Testosterona e estradiol inibem GnRH/LH; inibina B inibe FSH.", "O eixo hipotálamo–hipófise–testículo opera por feedback negativo. Redução primária da função testicular tende a elevar gonadotrofinas, enquanto deficiência hipotalâmica ou hipofisária pode manter LH/FSH baixos ou inadequadamente normais."], [5, "Qual a importância fisiológica de feedback masculino?", "O eixo hipotálamo–hipófise–testículo opera por feedback negativo.", "Testosterona e estradiol inibem GnRH/LH; inibina B inibe FSH."], [6, "Explique: Sertoli e FSH?", "FSH estimula Sertoli, sustentando o ambiente da espermatogênese.", "Células de Sertoli nutrem e organizam células germinativas, formam junções da barreira hematotesticular, produzem ABP e inibina B. O efeito do FSH integra-se à alta testosterona intratesticular produzida pelas células de Leydig."], [6, "Qual a importância fisiológica de sertoli e fsh?", "Células de Sertoli nutrem e organizam células germinativas, formam junções da barreira hematotesticular, produzem ABP e inibina B.", "FSH estimula Sertoli, sustentando o ambiente da espermatogênese."], [6, "Explique: Leydig e LH?", "LH estimula Leydig a produzir testosterona intratesticular.", "A concentração local de testosterona necessária à espermatogênese é muito maior que a circulante. A administração exógena de testosterona pode suprimir LH e FSH e reduzir a produção de espermatozoides."], [6, "Qual a importância fisiológica de leydig e lh?", "A concentração local de testosterona necessária à espermatogênese é muito maior que a circulante.", "LH estimula Leydig a produzir testosterona intratesticular."], [6, "Explique: Meiose espermatogênica?", "Espermatócito primário gera espermatócitos secundários e espermátides.", "A meiose I separa cromossomos homólogos; a meiose II separa cromátides-irmãs. Espermiogênese transforma espermátides haploides em células com acrossomo, flagelo e núcleo condensado, sem nova divisão celular."], [6, "Qual a importância fisiológica de meiose espermatogênica?", "A meiose I separa cromossomos homólogos; a meiose II separa cromátides-irmãs.", "Espermatócito primário gera espermatócitos secundários e espermátides."], [6, "Explique: Temperatura testicular?", "A espermatogênese exige temperatura testicular abaixo da corporal.", "O plexo pampiniforme e o escroto participam da termorregulação. Exposição térmica persistente, criptorquidia e varicocele podem comprometer parâmetros seminais, embora causas de infertilidade sejam multifatoriais."], [6, "Qual a importância fisiológica de temperatura testicular?", "O plexo pampiniforme e o escroto participam da termorregulação.", "A espermatogênese exige temperatura testicular abaixo da corporal."], [6, "Explique: Ereção e GMPc?", "NO ativa guanilil ciclase, aumenta GMPc e relaxa músculo liso cavernoso.", "Estímulo parassimpático favorece liberação de NO, que ativa guanilil ciclase solúvel. GMPc reduz cálcio intracelular e facilita enchimento dos corpos cavernosos; PDE5 degrada GMPc e sua inibição prolonga a resposta dependente de NO."], [6, "Qual a importância fisiológica de ereção e gmpc?", "Estímulo parassimpático favorece liberação de NO, que ativa guanilil ciclase solúvel.", "NO ativa guanilil ciclase, aumenta GMPc e relaxa músculo liso cavernoso."], [7, "Explique: Duas células e duas gonadotrofinas?", "LH estimula teca; FSH estimula aromatase na granulosa.", "Células da teca produzem andrógenos a partir de colesterol sob estímulo de LH. Andrógenos difundem para a granulosa, onde FSH induz aromatase e conversão em estradiol; a distribuição enzimática explica a cooperação folicular."], [7, "Qual a importância fisiológica de duas células e duas gonadotrofinas?", "Células da teca produzem andrógenos a partir de colesterol sob estímulo de LH.", "LH estimula teca; FSH estimula aromatase na granulosa."], [7, "Explique: Estradiol endometrial?", "Estradiol estimula proliferação do endométrio.", "Na fase folicular, estradiol aumenta crescimento de glândulas e estroma endometrial e induz receptores de progesterona. Também torna o muco cervical mais fluido, facilitando passagem de espermatozoides."], [7, "Qual a importância fisiológica de estradiol endometrial?", "Na fase folicular, estradiol aumenta crescimento de glândulas e estroma endometrial e induz receptores de progesterona.", "Estradiol estimula proliferação do endométrio."], [7, "Explique: Progesterona endometrial?", "Progesterona transforma endométrio proliferativo em secretor.", "Após ovulação, corpo lúteo secreta progesterona, que favorece diferenciação glandular, secreção e condições de receptividade endometrial. O muco cervical torna-se mais espesso e a temperatura basal tende a aumentar."], [7, "Qual a importância fisiológica de progesterona endometrial?", "Após ovulação, corpo lúteo secreta progesterona, que favorece diferenciação glandular, secreção e condições de receptividade endometrial.", "Progesterona transforma endométrio proliferativo em secretor."], [7, "Explique: Inibina ovariana?", "Inibina reduz seletivamente secreção hipofisária de FSH.", "Inibina B predomina em parte da fase folicular e inibina A aumenta na fase lútea. A queda da reserva folicular reduz inibina e estradiol, contribuindo para elevação de FSH na menopausa."], [7, "Qual a importância fisiológica de inibina ovariana?", "Inibina B predomina em parte da fase folicular e inibina A aumenta na fase lútea.", "Inibina reduz seletivamente secreção hipofisária de FSH."], [7, "Explique: Menopausa?", "Falência folicular reduz estradiol/inibina e eleva FSH.", "A redução sustentada da atividade folicular retira o feedback negativo sobre hipófise e hipotálamo. Sintomas vasomotores, alterações urogenitais e perda óssea relacionam-se à deficiência estrogênica, embora a intensidade varie entre pessoas."], [7, "Qual a importância fisiológica de menopausa?", "A redução sustentada da atividade folicular retira o feedback negativo sobre hipófise e hipotálamo.", "Falência folicular reduz estradiol/inibina e eleva FSH."], [8, "Explique: Recrutamento folicular?", "Coortes de folículos crescem; um folículo dominante costuma emergir.", "O crescimento inicial de folículos primordiais envolve fatores intraovarianos, enquanto estágios antrais dependem progressivamente de FSH. A seleção do dominante envolve maior sensibilidade a FSH e produção de estradiol, com atresia dos demais."], [8, "Qual a importância fisiológica de recrutamento folicular?", "O crescimento inicial de folículos primordiais envolve fatores intraovarianos, enquanto estágios antrais dependem progressivamente de FSH.", "Coortes de folículos crescem; um folículo dominante costuma emergir."], [8, "Explique: Pico de LH?", "Estradiol alto sustentado desencadeia feedback positivo e pico de LH.", "Na maior parte do ciclo, estradiol exerce feedback negativo. Próximo da ovulação, exposição suficientemente elevada e sustentada ao estradiol muda a resposta central e hipofisária, precipitando pico de LH e maturação ovocitária."], [8, "Qual a importância fisiológica de pico de lh?", "Na maior parte do ciclo, estradiol exerce feedback negativo.", "Estradiol alto sustentado desencadeia feedback positivo e pico de LH."], [8, "Explique: Ovulação?", "Pico de LH induz ruptura folicular e liberação do ovócito secundário.", "LH promove retomada da meiose, luteinização, mudanças em prostaglandinas e enzimas proteolíticas da parede folicular. O ovócito secundário é liberado com células da corona radiata e permanece parado em metáfase II até fertilização."], [8, "Qual a importância fisiológica de ovulação?", "LH promove retomada da meiose, luteinização, mudanças em prostaglandinas e enzimas proteolíticas da parede folicular.", "Pico de LH induz ruptura folicular e liberação do ovócito secundário."], [8, "Explique: Corpo lúteo?", "Corpo lúteo secreta progesterona após a ovulação.", "A luteinização das células foliculares gera estrutura vascularizada produtora de progesterona e estradiol. Sem hCG embrionário, ocorre luteólise e queda hormonal, desencadeando alterações vasculares e inflamatórias endometriais."], [8, "Qual a importância fisiológica de corpo lúteo?", "A luteinização das células foliculares gera estrutura vascularizada produtora de progesterona e estradiol.", "Corpo lúteo secreta progesterona após a ovulação."], [8, "Explique: Menstruação?", "Queda de progesterona e estradiol leva à descamação da camada funcional.", "A retirada do suporte hormonal desencadeia produção de prostaglandinas, vasoconstrição das artérias espiraladas, inflamação e degradação da matriz. A camada basal permanece e permite regeneração endometrial no ciclo seguinte."], [8, "Qual a importância fisiológica de menstruação?", "A retirada do suporte hormonal desencadeia produção de prostaglandinas, vasoconstrição das artérias espiraladas, inflamação e degradação da matriz.", "Queda de progesterona e estradiol leva à descamação da camada funcional."], [9, "Explique: CaSR e PTH?", "Cálcio ionizado baixo reduz ativação de CaSR e aumenta PTH.", "As células principais da paratireoide monitoram cálcio extracelular pelo receptor sensor de cálcio. Hipocalcemia favorece liberação de PTH, enquanto elevação do cálcio inibe secreção por feedback."], [9, "Qual a importância fisiológica de casr e pth?", "As células principais da paratireoide monitoram cálcio extracelular pelo receptor sensor de cálcio.", "Cálcio ionizado baixo reduz ativação de CaSR e aumenta PTH."], [9, "Explique: PTH renal?", "PTH aumenta reabsorção de cálcio e reduz reabsorção de fosfato.", "No néfron distal, PTH favorece conservação de cálcio; no túbulo proximal, reduz cotransportadores de fosfato, aumentando fosfatúria. Também estimula 1-alfa-hidroxilase renal, elevando calcitriol."], [9, "Qual a importância fisiológica de pth renal?", "No néfron distal, PTH favorece conservação de cálcio; no túbulo proximal, reduz cotransportadores de fosfato, aumentando fosfatúria.", "PTH aumenta reabsorção de cálcio e reduz reabsorção de fosfato."], [9, "Explique: Vitamina D ativa?", "Calcitriol aumenta absorção intestinal de cálcio e fosfato.", "Colecalciferol é convertido em 25-hidroxivitamina D no fígado e depois em 1,25-di-hidroxivitamina D no rim. O calcitriol atua por receptor nuclear, aumentando proteínas de transporte intestinal de minerais."], [9, "Qual a importância fisiológica de vitamina d ativa?", "Colecalciferol é convertido em 25-hidroxivitamina D no fígado e depois em 1,25-di-hidroxivitamina D no rim.", "Calcitriol aumenta absorção intestinal de cálcio e fosfato."], [9, "Explique: FGF23?", "FGF23 aumenta fosfatúria e reduz produção renal de calcitriol.", "Produzido principalmente por osteócitos, FGF23 atua com participação de Klotho, reduz reabsorção tubular de fosfato e inibe 1-alfa-hidroxilase. Integra o controle de fosfato com PTH e vitamina D."], [9, "Qual a importância fisiológica de fgf23?", "Produzido principalmente por osteócitos, FGF23 atua com participação de Klotho, reduz reabsorção tubular de fosfato e inibe 1-alfa-hidroxilase.", "FGF23 aumenta fosfatúria e reduz produção renal de calcitriol."], [9, "Explique: Cálcio ionizado e albumina?", "Hipoalbuminemia pode reduzir cálcio total sem reduzir cálcio ionizado.", "A fração ionizada é fisiologicamente ativa. Alcalose aumenta ligação do cálcio à albumina e pode reduzir o ionizado mesmo com cálcio total inalterado; em situações complexas, dosagem direta do cálcio ionizado é preferível."], [9, "Qual a importância fisiológica de cálcio ionizado e albumina?", "A fração ionizada é fisiologicamente ativa.", "Hipoalbuminemia pode reduzir cálcio total sem reduzir cálcio ionizado."], [10, "Explique: Captação de iodeto?", "NIS transporta iodeto para o tireócito na membrana basolateral.", "O simportador sódio–iodeto utiliza o gradiente de sódio mantido por Na+/K+-ATPase. O iodeto atravessa a membrana apical em direção ao coloide, com participação da pendrina e outras vias de transporte."], [10, "Qual a importância fisiológica de captação de iodeto?", "O simportador sódio–iodeto utiliza o gradiente de sódio mantido por Na+/K+-ATPase.", "NIS transporta iodeto para o tireócito na membrana basolateral."], [10, "Explique: Organificação?", "TPO oxida iodeto e ioda tirosinas da tireoglobulina.", "Na interface apical-coloide, a tireoperoxidase utiliza peróxido de hidrogênio para organificação, formando MIT e DIT. O acoplamento de DIT+DIT forma T4 e MIT+DIT forma T3, ainda ligados à tireoglobulina."], [10, "Qual a importância fisiológica de organificação?", "Na interface apical-coloide, a tireoperoxidase utiliza peróxido de hidrogênio para organificação, formando MIT e DIT.", "TPO oxida iodeto e ioda tirosinas da tireoglobulina."], [10, "Explique: Liberação T3/T4?", "TSH estimula endocitose e proteólise da tireoglobulina iodada.", "A tireoglobulina armazenada no coloide é internalizada e degradada em lisossomos; T4 e T3 são liberados à circulação, enquanto MIT/DIT remanescentes são desiodados para reciclagem de iodeto."], [10, "Qual a importância fisiológica de liberação t3/t4?", "A tireoglobulina armazenada no coloide é internalizada e degradada em lisossomos; T4 e T3 são liberados à circulação, enquanto MIT/DIT remanescentes são desiodados para reciclagem de iodeto.", "TSH estimula endocitose e proteólise da tireoglobulina iodada."], [10, "Explique: Desiodases?", "D1 e D2 podem formar T3; D3 inativa hormônios tireoidianos.", "T4 é o principal produto secretado pela tireoide, mas T3 possui maior atividade nos receptores. Desiodação periférica controla disponibilidade local de T3; D3 converte T4 em T3 reverso e T3 em T2."], [10, "Qual a importância fisiológica de desiodases?", "T4 é o principal produto secretado pela tireoide, mas T3 possui maior atividade nos receptores.", "D1 e D2 podem formar T3; D3 inativa hormônios tireoidianos."], [10, "Explique: Feedback tireoidiano?", "T3/T4 inibem TRH e TSH por feedback negativo.", "TRH hipotalâmico estimula TSH, que age em receptor acoplado a Gs no tireócito e favorece síntese e liberação hormonal. Na disfunção tireoidiana primária, TSH varia em direção oposta à do T4 livre, salvo condições especiais."], [10, "Qual a importância fisiológica de feedback tireoidiano?", "TRH hipotalâmico estimula TSH, que age em receptor acoplado a Gs no tireócito e favorece síntese e liberação hormonal.", "T3/T4 inibem TRH e TSH por feedback negativo."], [10, "Explique: Wolff–Chaikoff?", "Excesso agudo de iodeto pode inibir temporariamente organificação.", "A glândula geralmente escapa do efeito após adaptação da captação de iodeto. O fenômeno não deve ser confundido com Jod–Basedow, em que exposição a iodo pode precipitar hipertireoidismo em tecido autônomo."], [10, "Qual a importância fisiológica de wolff–chaikoff?", "A glândula geralmente escapa do efeito após adaptação da captação de iodeto.", "Excesso agudo de iodeto pode inibir temporariamente organificação."]]);
